name: Publish source documentation
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Validate reviewed source without any Pages publication
        type: boolean
        default: false
      expected_head:
        description: Required exact commit for artifact-only native acceptance
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Civ13/Civ13' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit publication or reviewed artifact-only source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ARTIFACT_ONLY: ${{ github.event.inputs.artifact_only }}
          SOURCE_BRANCH: ${{ github.ref }}
          ACTUAL_HEAD: ${{ github.sha }}
        run: |
          case "$ARTIFACT_ONLY" in
            true)
              [[ "$SOURCE_BRANCH" == refs/heads/* ]]
              [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
              test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
              git diff --exit-code HEAD
              ;;
            false|'')
              test "$SOURCE_BRANCH" = refs/heads/master
              test -z "$EXPECTED_HEAD"
              ;;
            *) echo 'Unrecognized artifact-only mode' >&2; exit 2 ;;
          esac
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure exact source links
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          git switch -C api-docs-build
          git config branch.api-docs-build.remote origin
          git update-ref "refs/remotes/origin/$SOURCE_REF" HEAD
          git config branch.api-docs-build.merge "refs/heads/$SOURCE_REF"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || !inputs.artifact_only)
      - run: python scripts/build-api-docs.py
      - name: Check toolchain and sprite admission contracts offline
        run: python -B -m unittest discover -s tests -p 'test_byond_runtime.py' && python -B tests/test_sprite_toolchain.py
      - name: Install checked BYOND for actual sprite extraction
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 libstdc++6:i386 libgcc-s1:i386 libcurl4:i386 libncurses6:i386
          mkdir "$RUNNER_TEMP/api-byond"
          mkdir -p .ci/api-pages
          python -B scripts/byond_toolchain.py download --platform linux --source repository-release --output "$RUNNER_TEMP/api-byond/pinned.zip" > .ci/api-pages/acquisition.json
          unzip -q "$RUNNER_TEMP/api-byond/pinned.zip" -d "$RUNNER_TEMP/api-byond"
          python -B scripts/byond_runtime.py --byond-bin "$RUNNER_TEMP/api-byond/byond/bin" --byond-archive "$RUNNER_TEMP/api-byond/pinned.zip" > .ci/api-pages/runtime-identity.json
          (cd "$RUNNER_TEMP/api-byond/byond" && make here)
      - name: Generate recipe atlas and in-game catalog from this commit
        run: |
          python -m pip install Pillow==11.3.0
          source "$RUNNER_TEMP/api-byond/byond/bin/byondsetup"
          python scripts/build-crafting-atlas.py --output dmdoc/crafting --byond-bin "$RUNNER_TEMP/api-byond/byond/bin" --byond-archive "$RUNNER_TEMP/api-byond/pinned.zip" --game-catalog UI/crafting-atlas.json
          node scripts/atlas/check.mjs dmdoc/crafting
      - name: Verify wrong-resource control with the same checked runtime
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_only
        run: |
          python tests/sprites/run.py --byond-bin "$RUNNER_TEMP/api-byond/byond/bin" --byond-archive "$RUNNER_TEMP/api-byond/pinned.zip" --output .ci/api-pages/sprites-negative.json --negative-control
      - name: Retain artifact-only output and complete evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.artifact_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-pages-acceptance-${{ github.sha }}-${{ github.run_id }}
          include-hidden-files: true
          path: |
            dmdoc
            .ci/api-pages/
          if-no-files-found: error
      - name: Retain toolchain and extraction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-pages-evidence-${{ github.sha }}-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .ci/api-pages/
            dmdoc/crafting/compiled-sprites.*
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || !inputs.artifact_only)
        with:
          path: dmdoc
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || !inputs.artifact_only)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
