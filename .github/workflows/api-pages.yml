name: Publish source documentation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Civ13/Civ13' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure exact source links
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          git switch -C api-docs-build
          git config branch.api-docs-build.remote origin
          git update-ref "refs/remotes/origin/$SOURCE_REF" HEAD
          git config branch.api-docs-build.merge "refs/heads/$SOURCE_REF"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: python scripts/build-api-docs.py
      - name: Install pinned BYOND for actual sprite extraction
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32z1 libstdc++6:i386 libgcc1:i386 libcurl4:i386 libncurses6:i386
          curl --fail --location --retry 3 --output /tmp/byond.zip https://civ13.com/downloads/516.1681_byond_linux.zip
          unzip -q /tmp/byond.zip -d /tmp/crafting-byond
          make -C /tmp/crafting-byond/byond here
      - name: Generate recipe atlas and in-game catalog from this commit
        run: |
          python -m pip install Pillow==11.3.0
          source /tmp/crafting-byond/byond/bin/byondsetup
          export LD_LIBRARY_PATH="/tmp/crafting-byond/byond/bin:${LD_LIBRARY_PATH:-}"
          printf '/world/New()\n\tshutdown()\n' > /tmp/crafting-byond/compiler-preflight.dme
          /tmp/crafting-byond/byond/bin/DreamMaker -max_errors 0 /tmp/crafting-byond/compiler-preflight.dme
          python scripts/build-crafting-atlas.py --output dmdoc/crafting --byond-bin /tmp/crafting-byond/byond/bin --game-catalog UI/crafting-atlas.json
          node scripts/atlas/check.mjs dmdoc/crafting
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dmdoc
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
