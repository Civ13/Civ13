              args+=(--rack-control "$control")
            fi
            if /usr/bin/python3 tests/food_progression/preservation_run.py "${args[@]}" > "$evidence/$control.log" 2>&1; then
              printf '%s\tpassed\n' "$control" >> "$evidence/results.tsv"
