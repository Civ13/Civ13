# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  BYOND_MAJOR: "516"
  BYOND_MINOR: "1681"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: sudo bash ./scripts/travis_pre_byond.sh
        shell: bash

      - name: Offline world-save round-trip regression
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          bash tests/world_save/run.sh
        shell: bash
      - name: Verify isolated chemistry reactions and negative control
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control

      - name: Run isolated power accounting regressions
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File scripts/test-power.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          bash scripts/check-power-gameplay.sh
