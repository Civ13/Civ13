  ci-required:
    name: ${{ needs.changes.result == 'success' && needs.changes.outputs.gating && needs.changes.outputs.gating == '0' && 'CI informational aggregate' || 'CI required aggregate' }}
    if: always()
    needs: [changes, baseline, evidence-checker, build, extraction-instances]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain dependency job outcomes before validating artifacts
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p .ci/aggregate
          python3 -c 'import json,os; from pathlib import Path; Path(".ci/aggregate/jobs.json").write_text(json.dumps(json.loads(os.environ["CI_NEEDS"]), indent=2))'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ needs.changes.outputs.attempt }}
          path: .ci/selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-baseline-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ needs.baseline.outputs.attempt }}
          path: .ci/baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-compile-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ needs.build.outputs.attempt }}
          path: .ci/compile
      - name: Require selected jobs and exact-source execution receipts
        env:
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_NEEDS: ${{ toJSON(needs) }}
          EXTRACTION_SELECTED: ${{ needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests || '[]'), 'tests/extraction') || (github.event_name == 'workflow_dispatch' && inputs.extraction_instance_regressions) }}
          GATING_SELECTION: ${{ needs.changes.outputs.gating }}
          SELECTION_ATTEMPT: ${{ needs.changes.outputs.attempt }}
          BASELINE_ATTEMPT: ${{ needs.baseline.outputs.attempt }}
          COMPILE_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: python3 -B scripts/ci_baseline.py aggregate --selection .ci/selection/selection.json --head "$CI_HEAD" --base "$CI_BASE" --selection-attempt "$SELECTION_ATTEMPT" --baseline .ci/baseline/baseline.json --baseline-attempt "$BASELINE_ATTEMPT" --compile-receipt .ci/compile/compile.json --compile-attempt "$COMPILE_ATTEMPT" --output .ci/aggregate/aggregate.json
      - name: Summarize explicit execution and skip meanings
        if: always()
        run: |
          echo 'The aggregate requires successful selection, offline execution receipts, and selected compiler/job outcomes. A documentation compile skip is not a compiler or native runtime pass. Inspect the ci-* artifacts for exact head/base, commands, counts, fallback and skip reasons.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain aggregate verdict and dependency outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-aggregate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci/aggregate/
          retention-days: 7
          if-no-files-found: error
