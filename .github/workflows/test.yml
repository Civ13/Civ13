# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      extensive_regressions:
        description: 'Opt in to all existing game and offline regression suites'
        type: boolean
        default: false

permissions:
  contents: read

env:
  BYOND_MAJOR: "516"
  BYOND_MINOR: "1681"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      extensive: ${{ github.event_name == 'workflow_dispatch' && inputs.extensive_regressions }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  evidence-checker:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test offline evidence checker
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_game_evidence.py')
        run: python3 -m unittest discover -s tests -p test_game_evidence.py -v
      - name: Test current-source atlas generation and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_crafting_atlas.py')
        run: python3 -m unittest discover -s tests -p test_crafting_atlas.py -v
      - name: Test and inventory placed outdoor bootstrap resources
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_outdoor_bootstrap.py')
        run: |
          python3 -m unittest discover -s tests -p test_outdoor_bootstrap.py -v
          python3 scripts/check-outdoor-bootstrap.py

  # Existing game compilation gate.
  build:
    needs: changes
    if: always()
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Require successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GAME_SELECTION: ${{ needs.changes.outputs.game }}
          EXTENSIVE_SELECTION: ${{ needs.changes.outputs.extensive }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$GAME_SELECTION" in true|false) ;; *) exit 1 ;; esac
          case "$EXTENSIVE_SELECTION" in true|false) ;; *) exit 1 ;; esac
      - name: Explain documentation-only skip
        if: needs.changes.outputs.game != 'true'
        run: echo 'Game compilation skipped because only documentation changed.'
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.game == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs a single command using the runners shell
      - name: Run a one-line script
        if: needs.changes.outputs.game == 'true'
        run: sudo bash ./scripts/travis_pre_byond.sh
        shell: bash

      - name: Verify explicit object processing units and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/process_time')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control units
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control legacy
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control fuel
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control damage
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control probability
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control dispatch

      - name: Verify compiled sprite defaults and wrong-resource control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/sprites')
        shell: bash
        run: |
          sudo apt-get install -y python3-pil
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/sprites/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/sprites.json"
          /usr/bin/python3 tests/sprites/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/sprites-negative.json" --negative-control

      - name: Verify generated atlas assets and native bounded viewer
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting_atlas')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 scripts/build-crafting-atlas.py --output "$RUNNER_TEMP/crafting" --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --check-game-catalog UI/crafting-atlas.json
          node scripts/atlas/check.mjs "$RUNNER_TEMP/crafting"
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --full-catalog

      - name: Explain opt-in runtime coverage
        if: needs.changes.outputs.extensive != 'true'
        run: echo 'Existing regression suites are opt-in. Use Run workflow with extensive_regressions enabled; PRs introducing executable tests run only their corresponding suites.'
      - name: Verify bounded winter survival and cold-loss negative control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/weather')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/weather/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/weather/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control
      - name: Validate compiled crafting recipes
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting')
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 scripts/check-recipes.py --report recipe-checks.txt
          python3 scripts/check-recipes.py --camera-prototype-negative-control
        shell: bash

      - name: Upload recipe validation report
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting'))
        uses: actions/upload-artifact@v4
        with:
          name: recipe-validation
          path: recipe-checks.txt
          if-no-files-found: warn
      - name: Offline world-save round-trip regression
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save')
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          bash tests/world_save/run.sh
        shell: bash
      - name: Bounded world-save graph and heartbeat regression
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/save_latency')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --dense
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --scenario movement
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --scenario parent-deletion
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --scenario concurrent
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --interrupt
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control ownership
          python3 tests/save_latency/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control yield

      - name: Verify isolated chemistry reactions and negative control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/chemistry')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe fuel
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe fuel --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe processing
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe processing --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe biochemistry
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe biochemistry --negative-control

      - name: Run isolated plant lifecycle regression and baseline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/plant_lifecycle')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/plant_lifecycle/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          git fetch --no-tags --depth=1 origin e48afe3a84485de779b2076b80841c1119288930
          pwsh -NoProfile -File tests/plant_lifecycle/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Revision e48afe3a84485de779b2076b80841c1119288930 -Baseline

      - name: Run automobile construction, movement and save regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/car_workshop')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/car_workshop/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"

      - name: Run isolated crop diagnostics regression
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/plant_diagnostics')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/plant_diagnostics/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"

      - name: Run isolated disease and medicine regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/survival')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/survival/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/survival/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control

      - name: Run outdoor crop bootstrap and water regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/outdoor_crops')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/outdoor_crops/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          git fetch --no-tags --depth=1 origin 9e44a2eb25945281979453b8aa060a9b1bad044b
          pwsh -NoProfile -File tests/outdoor_crops/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Revision 9e44a2eb25945281979453b8aa060a9b1bad044b -Baseline

      - name: Run irrigation propagation regression and baseline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/irrigation')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/irrigation/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          git fetch --no-tags --depth=1 origin b43ff97a5a97745f29727e11a29c3783257fd619
          pwsh -NoProfile -File tests/irrigation/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Revision b43ff97a5a97745f29727e11a29c3783257fd619 -Baseline

      - name: Run isolated power accounting regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/power') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/native_grid')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File scripts/test-power.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          bash scripts/check-power-gameplay.sh

      - name: Compare native cable graph work and retained entries
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/native_grid')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          git fetch --no-tags --depth=1 origin aa675de6dbade0f3740c516dc4b5945c5c9a43c7
          pwsh -NoProfile -File tests/native_grid/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          pwsh -NoProfile -File tests/native_grid/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Baseline
          pwsh -NoProfile -File tests/native_grid/run-game.ps1 -ByondBin "$PWD/BYOND/byond/bin"

      - name: Run isolated resource extraction regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/automated_sifting') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/hydraulic_fracturing') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/mining_yields') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/petroleum_lifecycle') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/resource_extraction')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/resource_extraction/digging_probe.dm
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/resource_extraction/digging_probe.dm -DiggingBaseline
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/hydraulic_fracturing/probe.dm
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/automated_sifting/probe.dm
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/mining_yields/probe.dm
          pwsh -NoProfile -File tests/resource_extraction/run.ps1 -ByondBin "$PWD/BYOND/byond/bin" -Probe tests/petroleum_lifecycle/probe.dm

      - name: Run constructed vehicle movement regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/boat_movement')
        shell: bash
        run: |
          source ./BYOND/byond/bin/byondsetup
          pwsh -NoProfile -File ./tests/boat_movement/run.ps1 -ByondBin "$PWD/BYOND/byond/bin"
          pwsh -NoProfile -File ./tests/boat_movement/run-game.ps1 -ByondBin "$PWD/BYOND/byond/bin"
      - name: Run isolated battery energy and network regressions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/batteries') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/native_grid')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          pwsh -NoProfile -File scripts/test-batteries.ps1 -ByondBin "$PWD/BYOND/byond/bin"

      - name: Check battery construction and durable state with compiled game types
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/batteries')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 scripts/check-battery-items.py

      - name: Verify bounded abandoned-item decay and negative control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/abandoned_items')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/abandoned_items/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/abandoned_items/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/abandoned_items/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control storage
          /usr/bin/python3 tests/abandoned_items/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control save
          /usr/bin/python3 tests/abandoned_items/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control seasons

      - name: Verify native human corpse lifecycle and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/human_corpse_decay')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/human_corpse_decay/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/human_corpse_decay/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control nodrop
          /usr/bin/python3 tests/human_corpse_decay/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control restart
          /usr/bin/python3 tests/human_corpse_decay/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control noop

      - name: Verify bounded GC outcome and reference triage
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/gc_triage')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/gc_triage/run.py --byond-bin "$PWD/BYOND/byond/bin"
          for control in triage-slots triage-identity triage-lists triage-metadata triage-delete-result triage-requested; do
            /usr/bin/python3 tests/gc_triage/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control "$control"
          done

      - name: Verify bounded GC profiling and mutation controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/garbage_profile')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/garbage_profile/run.py --byond-bin "$PWD/BYOND/byond/bin"
          for control in bound cleanup forced clock; do
            /usr/bin/python3 tests/garbage_profile/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control "$control"
          done
          for control in gc-soft-budget gc-hard-budget; do
            /usr/bin/python3 tests/memory_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --case collector --negative-control "$control"
          done

      - name: Verify native memory ownership and mutation controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/callback_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/global_vars_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/memory_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/nanoui_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/pool_effects') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/process_snapshot_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/reagent_ownership') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/weakref_ownership')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/memory_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/memory_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --case collector
          for control in gc-soft-budget gc-hard-budget; do
            /usr/bin/python3 tests/memory_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --case collector --negative-control "$control"
          done
          for control in cancel-retention deletion-state pool-cleanup pool-cap pool-global pool-idle hard-reference startup ref-identity hard-now let-live; do
            /usr/bin/python3 tests/memory_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control "$control"
          done
          git fetch --no-tags --depth=1 origin 7cfa850bd9d2788dcbb9fd35f5c5915ccb528dd2
          /usr/bin/python3 tests/process_loop_lifecycle/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/process_loop_lifecycle/run.py --byond-bin "$PWD/BYOND/byond/bin" --baseline
          for control in token deadline successful-run; do
            /usr/bin/python3 tests/process_loop_lifecycle/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control "$control"
          done
          git fetch --no-tags --depth=1 origin f556e39b93fc97f41020b2d8c5f2abed63fab497
          /usr/bin/python3 tests/global_vars_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/global-vars-fixed"
          for suite in weakref_ownership callback_ownership reagent_ownership process_snapshot_ownership nanoui_ownership; do
            /usr/bin/python3 "tests/$suite/run.py" --byond-bin "$PWD/BYOND/byond/bin"
            /usr/bin/python3 "tests/$suite/run.py" --byond-bin "$PWD/BYOND/byond/bin" --baseline
          done
          /usr/bin/python3 tests/process_snapshot_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/process_snapshot_ownership/run.py --byond-bin "$PWD/BYOND/byond/bin" --reset-control
          /usr/bin/python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/pool-effects-fixed"
          /usr/bin/python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/pool-effects-lighting-control" --negative-control lighting
          /usr/bin/python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/pool-effects-lifetime-control" --negative-control fallback
          /usr/bin/python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/pool-effects-chem-control" --negative-control chem
      - name: Verify native copied processing-list removal contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/processing_list_removal')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          git fetch --no-tags --depth=1 origin aa675de6dbade0f3740c516dc4b5945c5c9a43c7
