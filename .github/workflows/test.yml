# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      extensive_regressions:
        description: 'Opt in to all existing game and offline regression suites'
        type: boolean
        default: false
      rack_save_regressions:
        description: 'Opt in only to the paid rack save probe and its six mutation controls'
        type: boolean
        default: false

permissions:
  contents: read

env:
  BYOND_MAJOR: "516"
  BYOND_MINOR: "1681"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      extensive: ${{ github.event_name == 'workflow_dispatch' && inputs.extensive_regressions }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  evidence-checker:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test offline evidence checker
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_game_evidence.py')
        run: python3 -m unittest discover -s tests -p test_game_evidence.py -v
      - name: Test isolated OpenDream process and control adapter
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_control.py') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_receipts.py')
        run: python3 -m unittest discover -s tests -p 'test_opendream*.py' -v
      - name: Test current-source atlas generation and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_crafting_atlas.py')
        run: python3 -m unittest discover -s tests -p test_crafting_atlas.py -v
      - name: Test and inventory placed outdoor bootstrap resources
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_outdoor_bootstrap.py')
        run: |
          python3 -m unittest discover -s tests -p test_outdoor_bootstrap.py -v
          python3 scripts/check-outdoor-bootstrap.py

  # Existing game compilation gate.
  build:
    needs: changes
    if: always() && !cancelled()
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Require successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GAME_SELECTION: ${{ needs.changes.outputs.game }}
          EXTENSIVE_SELECTION: ${{ needs.changes.outputs.extensive }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$GAME_SELECTION" in true|false) ;; *) exit 1 ;; esac
          case "$EXTENSIVE_SELECTION" in true|false) ;; *) exit 1 ;; esac
      - name: Explain documentation-only skip
        if: needs.changes.outputs.game != 'true'
        run: echo 'Game compilation skipped because only documentation changed.'
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.game == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs a single command using the runners shell
      - name: Run a one-line script
        if: needs.changes.outputs.game == 'true'
        run: sudo bash ./scripts/travis_pre_byond.sh
        shell: bash

      - name: Verify paid rack save and six mutation controls
        if: github.event_name == 'workflow_dispatch' && inputs.rack_save_regressions
        timeout-minutes: 20
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/rack-save"
          mkdir -p "$evidence"
          failed=0
          for control in baseline coverage runtime storage stale-wait duplicate conversion; do
            args=(--probe rack-save --byond-bin "$PWD/BYOND/byond/bin" --output "$evidence/$control")
            if [[ "$control" != baseline ]]; then
              args+=(--rack-control "$control")
            fi
            if /usr/bin/python3 tests/food_progression/preservation_run.py "${args[@]}" > "$evidence/$control.log" 2>&1; then
              printf '%s\tpassed\n' "$control" >> "$evidence/results.tsv"
            else
              printf '%s\tfailed\n' "$control" >> "$evidence/results.tsv"
              failed=1
            fi
            cat "$evidence/$control.log"
          done
          cat "$evidence/results.tsv"
          exit "$failed"
      - name: Upload paid rack save evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.rack_save_regressions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rack-save-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rack-save/
            !${{ runner.temp }}/rack-save/**/*.dmb
            !${{ runner.temp }}/rack-save/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify optional player help bridge and native negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/player_help')
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 -m unittest discover -s tests/player_help -v
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control escaping
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control heartbeat
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control identity
      - name: Verify scheduler replacement ownership and omission controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/process_replacement')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 tests/process_replacement/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --evidence-dir data/process-replacement/fixed
          python3 tests/process_replacement/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --baseline --evidence-dir data/process-replacement/baseline
          python3 tests/process_replacement/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control bookkeeping --evidence-dir data/process-replacement/bookkeeping
          python3 tests/process_replacement/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control configuration --evidence-dir data/process-replacement/configuration
          python3 tests/process_replacement/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control chemistry --evidence-dir data/process-replacement/chemistry
      - name: Preserve scheduler replacement native evidence
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/process_replacement'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-replacement-${{ github.event.pull_request.head.sha || github.sha }}
          path: data/process-replacement
          if-no-files-found: error

      - name: Verify unsupported shell compatibility with offline adapters
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/opendream_shell')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 tests/opendream_shell/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/shell-compat"
          python3 tests/opendream_shell/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/shell-tts-control" --negative-control tts
          python3 tests/opendream_shell/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/shell-dispatch-control" --negative-control dispatch

      - name: Verify explicit object processing units and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/process_time')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control units
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control legacy
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control fuel
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control damage
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control probability
          python3 tests/process_time/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control dispatch

      - name: Verify compiled sprite defaults and wrong-resource control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/sprites')
        shell: bash
        run: |
          sudo apt-get install -y python3-pil
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/sprites/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/sprites.json"
          /usr/bin/python3 tests/sprites/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/sprites-negative.json" --negative-control

      - name: Verify generated atlas assets and native bounded viewer
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting_atlas')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 scripts/build-crafting-atlas.py --output "$RUNNER_TEMP/crafting" --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --check-game-catalog UI/crafting-atlas.json
          node scripts/atlas/check.mjs "$RUNNER_TEMP/crafting"
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/crafting_atlas/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --full-catalog

      - name: Verify actual largest-map constructors under seasonal work
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/season_transition'))
        timeout-minutes: 45
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/season_transition/full_game.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/season-transition/full-game/positive"
          python3 tests/season_transition/full_game.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control --output "$RUNNER_TEMP/season-transition/full-game/population-control"
          python3 tests/season_transition/full_game.py --byond-bin "$PWD/BYOND/byond/bin" --service-negative-control --output "$RUNNER_TEMP/season-transition/full-game/service-control"
      - name: Retain actual largest-map constructor evidence
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/season_transition'))
        uses: actions/upload-artifact@v4
        with:
          name: full-season-constructor-evidence
          path: ${{ runner.temp }}/season-transition/full-game/
          if-no-files-found: error
      - name: Explain opt-in runtime coverage
        if: needs.changes.outputs.extensive != 'true'
        run: echo 'Existing regression suites are opt-in. Use Run workflow with extensive_regressions enabled; PRs introducing executable tests run only their corresponding suites.'
      - name: Verify bounded lighting startup ordering
        id: lighting_startup
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/lighting_startup')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          git fetch --no-tags --depth=1 origin 0e9b527ec492196b548d1cf92bc270c30ef30e67
          python3 tests/lighting_startup/test_runner.py
          python3 tests/lighting_startup/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/lighting-startup/positive"
          python3 tests/lighting_startup/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control --output "$RUNNER_TEMP/lighting-startup/negative"
          python3 tests/lighting_startup/run.py --byond-bin "$PWD/BYOND/byond/bin" --bulk-order-control --output "$RUNNER_TEMP/lighting-startup/bulk-order-control"
          python3 tests/lighting_startup/run.py --byond-bin "$PWD/BYOND/byond/bin" --inactive-corner-control --output "$RUNNER_TEMP/lighting-startup/inactive-corner-control"
          if [ "${{ needs.changes.outputs.extensive }}" != true ]; then
            python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/lighting-startup/pool-effects"
            python3 tests/pool_effects/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control lighting --output "$RUNNER_TEMP/lighting-startup/pool-effects-control"
          fi
      - name: Retain lighting startup evidence
        if: always() && steps.lighting_startup.outcome != 'skipped' && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/lighting_startup'))
        uses: actions/upload-artifact@v4
        with:
          name: lighting-startup-evidence
          path: ${{ runner.temp }}/lighting-startup
          if-no-files-found: error
      - name: Verify lighting queues and production state parity
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/lighting_queues') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/lighting_startup')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/lighting_queues/run.py --byond-bin "$PWD/BYOND/byond/bin" --size 500 --output "$RUNNER_TEMP/lighting-queues.json"
          python3 tests/lighting_queues/run.py --byond-bin "$PWD/BYOND/byond/bin" --size 500 --negative-control skip --output "$RUNNER_TEMP/lighting-skip.json"
          python3 tests/lighting_queues/run.py --byond-bin "$PWD/BYOND/byond/bin" --size 500 --negative-control retain --output "$RUNNER_TEMP/lighting-retain.json"
          python3 tests/lighting_queues/run_native.py --byond-bin "$PWD/BYOND/byond/bin" --baseline --output "$RUNNER_TEMP/lighting-baseline.json"
          python3 tests/lighting_queues/run_native.py --byond-bin "$PWD/BYOND/byond/bin" --compare "$RUNNER_TEMP/lighting-baseline.json" --output "$RUNNER_TEMP/lighting-current.json"
      - name: Verify native wall appearance and neighbor work
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/wall_appearance')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/wall_appearance/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/wall-appearance.json"
          python3 tests/wall_appearance/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control smoothing --output "$RUNNER_TEMP/wall-smoothing.json"
          python3 tests/wall_appearance/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control duplicate --output "$RUNNER_TEMP/wall-duplicate.json"
          python3 tests/wall_appearance/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control overlay --output "$RUNNER_TEMP/wall-overlay.json"
      - name: Retain wall appearance comparison evidence
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/wall_appearance'))
        uses: actions/upload-artifact@v4
        with:
          name: wall-appearance-comparison
          path: ${{ runner.temp }}/wall-*
          if-no-files-found: error
      - name: Verify weapon parry break boundaries
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/weapon_parry')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/weapon_parry/run.py --byond-bin "$PWD/BYOND/byond/bin"
          python3 tests/weapon_parry/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control sword
          python3 tests/weapon_parry/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control twohanded
      - name: Verify native NPC cover choices and scores
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/npc_cover')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/npc_cover/run.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/npc-cover.json"
          python3 tests/npc_cover/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control boundary --output "$RUNNER_TEMP/npc-cover-boundary.json"
          python3 tests/npc_cover/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control tie --output "$RUNNER_TEMP/npc-cover-tie.json"
      - name: Verify bounded winter survival and cold-loss negative control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/weather')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/weather/run.py --byond-bin "$PWD/BYOND/byond/bin"
          /usr/bin/python3 tests/weather/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control
      - name: Validate compiled crafting recipes
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting')
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 scripts/check-recipes.py --report recipe-checks.txt
          python3 scripts/check-recipes.py --camera-prototype-negative-control
        shell: bash

      - name: Verify direct nuclear fallout scope and controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/radiation_scope')
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/radiation_scope/run.py --byond-bin "$PWD/BYOND/byond/bin" --output-dir "$RUNNER_TEMP/radiation-scope/positive"
          python3 tests/radiation_scope/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control cross-z --output-dir "$RUNNER_TEMP/radiation-scope/cross-z"
          python3 tests/radiation_scope/run.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control normalization --output-dir "$RUNNER_TEMP/radiation-scope/normalization"
      - name: Retain nuclear fallout scope evidence
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/radiation_scope'))
        uses: actions/upload-artifact@v4
        with:
          name: radiation-scope
          path: ${{ runner.temp }}/radiation-scope/
          if-no-files-found: error
      - name: Upload recipe validation report
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/crafting'))
        uses: actions/upload-artifact@v4
        with:
          name: recipe-validation
          path: recipe-checks.txt
          if-no-files-found: warn
      - name: Offline world-save round-trip regression
        id: world_save
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save')
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          mkdir -p "$RUNNER_TEMP/world-save"
          export TMPDIR="$RUNNER_TEMP/world-save"
          bash tests/world_save/run.sh
          python3 tests/world_save/run-round-metadata.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control restore
          python3 tests/world_save/run-round-metadata.py --byond-bin "$PWD/BYOND/byond/bin" --negative-control preflight
        shell: bash
      - name: Retain ordinary world-save evidence
        if: always() && steps.world_save.outcome != 'skipped' && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save'))
        uses: actions/upload-artifact@v4
        with:
          name: world-save
          path: ${{ runner.temp }}/world-save/
          if-no-files-found: error

      - name: Verify chemical smoke source ownership and historical control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/chemical_smoke_ownership')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/chemical_smoke_ownership/test_harness.py
          /usr/bin/python3 tests/chemical_smoke_ownership/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/chemical-smoke/fixed"
          /usr/bin/python3 tests/chemical_smoke_ownership/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/chemical-smoke/historical" --negative-control
      - name: Upload chemical smoke ownership evidence
        if: always() && (needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/chemical_smoke_ownership'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chemical-smoke-ownership
          path: |
            ${{ runner.temp }}/chemical-smoke/
            !${{ runner.temp }}/chemical-smoke/**/*.dmb
            !${{ runner.temp }}/chemical-smoke/**/*.rsc
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Verify isolated chemistry reactions and negative control
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/chemistry')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe fuel
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe fuel --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe processing
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe processing --negative-control
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe biochemistry
          /usr/bin/python3 tests/chemistry/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --probe biochemistry --negative-control

      - name: Run isolated plant lifecycle regression and baseline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/plant_lifecycle')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
