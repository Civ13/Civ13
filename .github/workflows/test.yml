# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Intake every branch/base for build: requests; the selector retains ordinary CI eligibility.
  push:
    branches: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      exclusion_comparison_base:
        description: 'Full immutable base commit SHA, distinct from the selected head; required when running exclusion checks'
        type: string
        required: false
        default: ''
      extensive_regressions:
        description: 'Opt in to all existing game and offline regression suites'
        type: boolean
        default: false
      dagger_map_compile:
        description: 'Opt in to native compilation of the inactive Dagger map and missing-type control'
        type: boolean
        default: false
      rack_save_regressions:
        description: 'Opt in only to the paid rack save probe and its six mutation controls'
        type: boolean
        default: false
      persistence_integration_regressions:
        description: 'Opt in to combined persistence, lighting, building and continuous-round controls'
        type: boolean
        default: false
      restart_transaction_regressions:
        description: 'Opt in only to isolated save restart transaction checks'
        type: boolean
        default: false
      save_latency_regressions:
        description: 'Opt in to bounded save, compatibility, admission and current persistence probes'
        type: boolean
        default: false
      world_save_regressions:
        description: 'Opt in only to isolated world-save and expanded-level recovery checks'
        type: boolean
        default: false
      protected_sleep_regressions:
        description: 'Opt in only to protected sleep transfers and save compatibility checks'
        type: boolean
        default: false
      world_save_profile_regressions:
        description: 'Opt in only to serializer phase profiling and its mutation controls'
        type: boolean
        default: false
      world_save_operation_regressions:
        description: 'Opt in only to save/load admission and busy-transition controls'
        type: boolean
        default: false
      lighting_recovery_regressions:
        description: 'Opt in only to actual-constructor lighting persistence recovery and controls'
        type: boolean
        default: false
      extraction_instance_regressions:
        description: 'Opt in to standalone extraction instance assertions and four mutation controls'
        type: boolean
        default: false

permissions:
  contents: read

# Deliberate literal projection of tools/byond/version.json: top-level env cannot
# read a checkout file. The always-run offline pin test rejects manifest drift.
# This does not select or expand any native fixture coverage.
env:
  BYOND_MAJOR: "516"
  BYOND_MINOR: "1688"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      build_prefix: true
      extensive: ${{ github.event_name == 'workflow_dispatch' && inputs.extensive_regressions }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  baseline:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Reused by a re-run of failed jobs, a job keeps its original attempt and
    # artifact names; consumers download by these outputs, not their own attempt.
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ needs.changes.outputs.attempt }}
          path: .ci/selection
      - name: Run required bounded offline baseline
        env:
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          SELECTION_ATTEMPT: ${{ needs.changes.outputs.attempt }}
        run: python3 -B scripts/ci_baseline.py run --selection .ci/selection/selection.json --head "$CI_HEAD" --base "$CI_BASE" --selection-attempt "$SELECTION_ATTEMPT" --output .ci/baseline
      - name: Retain offline commands, counts, logs and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-baseline-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci/baseline/
          retention-days: 7
          if-no-files-found: error
  evidence-checker:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test representative save executor contracts without native effects
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/save_latency') || inputs.save_latency_regressions == true
        run: python3 -B -m unittest discover -s tests/save_latency/representative -v
      - name: Check Art of the Deal map regressions offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/aotd_map')
        run: python3 -B -m unittest discover -s tests/aotd_map -p 'test_*.py' -v
      - name: Check disabled Backrooms gateway contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/backrooms_gateway')
        run: python3 -B -m unittest discover -s tests/backrooms_gateway -p 'test_*.py' -v
      - name: Test synthetic static-source export core offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/save_to_map')
        run: python3 -I -B -m unittest discover -s tests/save_to_map -p 'test_*.py' -v
      - name: Test optional geographic elevation offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/elevation')
        run: python3 -B -m unittest discover -s tests/elevation -v
      - name: Check zone and spawn persistence contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/zone_persistence')
        run: python3 -B -m unittest discover -s tests/zone_persistence -v
      - name: Prepare roof-area recovery fixture offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/roof_area_recovery') || (github.event_name == 'pull_request' && github.event.action != 'edited' && needs.changes.outputs.game == 'true' && contains(github.event.pull_request.labels.*.name, format('roof-ci:{0}', github.event.pull_request.head.sha)))
        run: python3 -B -m unittest discover -s tests/roof_area_recovery -p 'test_*.py' -v
      - name: Test digging tool and research admission offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_digging_tools.py')
        run: python3 -B -m unittest discover -s tests -p test_digging_tools.py -v
      - name: Test wolf cave ownership source contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/wolf_cave_ownership')
        run: python3 -B -m unittest discover -s tests/wolf_cave_ownership -p 'test_*.py' -v
      - name: Test footwear water mask composition and refresh contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/footwear_water_mask')
        run: python3 -B -m unittest discover -s tests/footwear_water_mask -v
      - name: Test research scheduler resume source traces offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/research_scheduler')
        run: python3 -B -m unittest discover -s tests/research_scheduler -v
      - name: Test cleanables scheduler resume source traces offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/cleanables_scheduler')
        run: python3 -B -m unittest discover -s tests/cleanables_scheduler -v
      - name: Test tree planting scheduler and save contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/tree_planting')
        run: python3 -B -m unittest discover -s tests/tree_planting -v
      - name: Test character discoveries and berry smell contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/character_discoveries')
        run: python3 -I -B -m unittest discover -s tests/character_discoveries -p 'test_*.py' -v
      - name: Test winter crops and attributed sprite contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/winter_crops')
        run: python3 -I -S -B -m unittest discover -s tests/winter_crops -p 'test_*.py' -v
      - name: Test persistence minimum date offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/persistence_year')
        run: python3 -B -m unittest discover -s tests/persistence_year -v
      - name: Test opt-in seasonal construction offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/seasonal_construction')
        run: python3 -B -m unittest discover -s tests/seasonal_construction -v
      - name: Test configurable shared season duration offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/season_duration')
        run: python3 -B -m unittest discover -s tests/season_duration -v
      - name: Test optional per-map weather policy offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/weather_policy')
        run: |
          python3 -B -m unittest discover -s tests/weather_policy -v
          python3 -B -m unittest discover -s tests/season_duration -v
      - name: Test configurable base season flow offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/season_flow')
        run: |
          python3 -B -m unittest discover -s tests/season_flow -v
          python3 -B -m unittest discover -s tests/season_duration -v
          python3 -B tests/abandoned_items/run.py --check-season-wiring
      - name: Test snowfall ground cover offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/snowfall_ground')
        run: |
          python3 -B -m unittest discover -s tests/snowfall_ground -v
          python3 -B -m unittest discover -s tests -p test_digging_tools.py -v
          python3 -B -m unittest discover -s tests/season_flow -v
          python3 -B -m unittest discover -s tests/season_duration -v
          python3 -B -m unittest discover -s tests/weather_policy -v
          python3 -B tests/abandoned_items/run.py --check-season-wiring
      - name: Test ping scheduler resume source traces offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/ping_scheduler')
        run: python3 -B -m unittest discover -s tests/ping_scheduler -v
      - name: Test local discovery source parity offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/local_discovery')
        run: python3 -B -m unittest discover -s tests/local_discovery -v
      - name: Verify immutable irrigation baseline and offline contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/irrigation_persistence')
        run: |
          if ! git cat-file -e 067478b82c7ad9f1b83759a221e6f22080ba865a^{commit}; then
            git fetch --no-tags --depth=1 origin 067478b82c7ad9f1b83759a221e6f22080ba865a
          fi
          python3 -B -m unittest discover -s tests/irrigation_persistence -p 'test_*.py' -v
      - name: Test optional roof upper-floor source contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/roof_construction')
        run: python3 -B -m unittest discover -s tests/roof_construction -v
      - name: Test protected sleep source and fixture contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save') || inputs.protected_sleep_regressions == true || inputs.save_latency_regressions == true
        run: |
          python3 -B tests/world_save/test_sleep_transfer_sources.py -v
          python3 -B tests/world_save/test_cross_level_sources.py -v
          python3 -B -m unittest discover -s tests/world_save/partial_save_inspector -p test_inspector.py -v
          python3 -B -m unittest discover -s tests/world_save -p test_round_metadata_toolchain.py -v
          python3 -B -m unittest discover -s tests/world_save -p test_selected_toolchains.py -v
          python3 -B -m unittest discover -s tests/world_save -p test_graph_fixture_dependencies.py -v
          python3 -B -m unittest discover -s tests/world_save -p test_wound_compatibility.py -v
      - name: Test continuous persistence round contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/persistence_round') || inputs.persistence_integration_regressions == true
        run: python3 -B -m unittest discover -s tests/persistence_round -v
      - name: Test save movement and physical sleep guards offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/save_movement')
        run: python3 -B -m unittest discover -s tests/save_movement -v
      - name: Test floor decal tracking source and offline native evidence contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/floor_decal_tracking')
        run: python3 -B -m unittest discover -s tests/floor_decal_tracking -p 'test_*.py' -v
      - name: Test disabled gameplay bridge contracts without native processes
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/gameplay_bridge')
        run: python3 -B -m unittest discover -s tests/gameplay_bridge -v
      - name: Test inactive reserved lighting clearance and executor guards offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/reserved_lighting')
        run: python3 -B -m unittest discover -s tests/reserved_lighting -p 'test_*.py' -v
      - name: Test offline evidence checker
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_game_evidence.py')
        run: python3 -m unittest discover -s tests -p test_game_evidence.py -v
      - name: Test passive hang watchdog without native game or host effects
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/hang_watchdog')
        run: python3 -B -m unittest discover -s tests/hang_watchdog -v
      - name: Test attack history writer ownership and source preparation
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/attack_history')
        run: python3 -m unittest discover -s tests/attack_history -p test_sources.py -v
      - name: Test admin history source preparation
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/admin_history')
        run: python3 -m unittest discover -s tests/admin_history -p test_sources.py -v
      - name: Test fixed bot service control without host effects
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/bot_service')
        run: python3 -m unittest discover -s tests/bot_service -v
      - name: Test isolated OpenDream process and control adapter
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_control.py') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_receipts.py')
        run: python3 -m unittest discover -s tests -p 'test_opendream*.py' -v
      - name: Test injected bounded-build guard and Windows adapter
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'scripts/opendream/bounded_build')
        run: python3 -m unittest discover -s scripts/opendream/bounded_build -p 'test_*.py' -v
      - name: Test local WSL staging and owned-process failure paths without WSL
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_local_wsl.py')
        run: python3 -m unittest discover -s tests -p test_local_wsl.py -v
      - name: Test current-source atlas generation and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_crafting_atlas.py')
        run: python3 -m unittest discover -s tests -p test_crafting_atlas.py -v
      - name: Test source-backed atlas entrypoints eras and processor controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_atlas_navigation.py')
        run: |
          python3 -m unittest discover -s tests -p test_atlas_navigation.py -v
          node tests/crafting_atlas/navigation.test.mjs
      - name: Test atlas variant equivalence and selector navigation offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_atlas_variants.py')
        run: |
          python3 scripts/build-crafting-atlas.py --catalog-only --check-game-catalog UI/crafting-atlas.json
          python3 -m unittest discover -s tests -p test_atlas_variants.py -v
          node tests/crafting_atlas/variants.test.mjs
      - name: Test and inventory placed outdoor bootstrap resources
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_outdoor_bootstrap.py')
        run: |
          python3 -m unittest discover -s tests -p test_outdoor_bootstrap.py -v
          python3 scripts/check-outdoor-bootstrap.py

  extraction-instances:
    # Historical native fixture contract; not 516.1688 runtime acceptance.
    env:
      BYOND_MAJOR: "516"
      BYOND_MINOR: "1681"
    needs: changes
    if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/extraction') || (github.event_name == 'workflow_dispatch' && inputs.extraction_instance_regressions)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned standalone BYOND without compiling the game
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo timeout 120 apt-get update
          sudo timeout 120 apt-get install -y --no-install-recommends libstdc++6:i386 libgcc-s1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6:i386 unzip make
          mkdir BYOND
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 0 --output BYOND/pinned.zip "https://civ13.com/downloads/${BYOND_MAJOR}.${BYOND_MINOR}_byond_linux.zip"
          unzip -q BYOND/pinned.zip -d BYOND
          (cd BYOND/byond && make here)
      - name: Verify standalone extraction instances and named mutation assertions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/extraction') || (github.event_name == 'workflow_dispatch' && inputs.extraction_instance_regressions)
        timeout-minutes: 6
        shell: bash
        env:
          INSTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -m unittest discover -s tests/extraction/instances -p 'test_*.py' -v
          # Vendor setup may append to optional, initially unset environment variables.
          set +u
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          set -u
          /usr/bin/python3 -B tests/extraction/instances/run_ci.py --head "$INSTANCE_HEAD" --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/extraction-instances"
      - name: Retain standalone extraction instance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extraction-instances-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/extraction-instances
          retention-days: 7
          if-no-files-found: warn

  # Existing game compilation gate.
  build:
    name: ${{ needs.changes.result == 'success' && needs.changes.outputs.gating && needs.changes.outputs.gating == '0' && 'CI informational build' || 'build' }}
    needs: changes
    if: always() && !cancelled()
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    outputs:
      attempt: ${{ github.run_attempt }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Require successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GAME_SELECTION: ${{ needs.changes.outputs.game }}
          EXTENSIVE_SELECTION: ${{ needs.changes.outputs.extensive }}
          GATING_SELECTION: ${{ needs.changes.outputs.gating }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$GAME_SELECTION" in true|false) ;; *) exit 1 ;; esac
          case "$EXTENSIVE_SELECTION" in true|false) ;; *) exit 1 ;; esac
          case "$GATING_SELECTION" in 0|1) ;; *) exit 1 ;; esac
      - name: Explain compilation skip
        if: needs.changes.outputs.game != 'true'
        run: echo 'Game compilation skipped by change and build-prefix selection.'
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs a single command using the runners shell
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ needs.changes.outputs.attempt }}
          path: .ci/selection
      - name: Read reviewed BYOND archive cache identity
        id: byond_archive
        if: needs.changes.outputs.game == 'true'
        run: echo "key=$(python3 -B scripts/byond_toolchain.py field linux-cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore exact BYOND archive only
        id: byond_cache
        if: needs.changes.outputs.game == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/civ13-byond-archives
          key: ${{ steps.byond_archive.outputs.key }}
          # No restore prefixes or shared installed-tree cache.
      - name: Compile selected exact-head game
        id: compile
        if: needs.changes.outputs.game == 'true'
        timeout-minutes: 15
        env:
          BYOND_ARCHIVE_SOURCE: repository-release
          BYOND_ARCHIVE_CACHE: ${{ runner.temp }}/civ13-byond-archives
        run: |
          mkdir -p .ci/compile
          bash ./scripts/travis_pre_byond.sh 2>&1 | tee .ci/compile/bootstrap.log
        shell: bash

      - name: Compile Art of the Deal with current game declarations
        id: aotd_compile
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/aotd_map')
        timeout-minutes: 5
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 -B tests/aotd_map/compile_map.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/aotd-compile"
      - name: Retain Art of the Deal compiler evidence
        if: always() && steps.aotd_compile.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aotd-compile-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aotd-compile/
          retention-days: 7
          if-no-files-found: error
      - name: Save verified BYOND archive after successful compilation
        if: needs.changes.outputs.game == 'true' && steps.compile.outcome == 'success' && steps.byond_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/civ13-byond-archives
          key: ${{ steps.byond_archive.outputs.key }}

      - name: Record compilation outcome and source receipts
        if: always()
        env:
