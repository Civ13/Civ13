# One-off build-only branch. Do not merge this replacement workflow into master.
name: Pinned Gaia deployment build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gaia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed build tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout immutable game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5bf351248de6050876fe5b53f91209a970cc5668
          path: game-source
          persist-credentials: false
      - name: Offline build contract tests
        run: python3 -B tooling/scripts/ci/test_build_gaia_bundle.py -v
      - name: Install the existing pinned BYOND toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y unzip make libstdc++6:i386 libgcc1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6 libncurses6:i386
          mkdir "$RUNNER_TEMP/gaia-byond"
          curl --fail --location --retry 3 https://civ13.com/downloads/516.1681_byond_linux.zip -o "$RUNNER_TEMP/gaia-byond/toolchain.zip"
          unzip -q "$RUNNER_TEMP/gaia-byond/toolchain.zip" -d "$RUNNER_TEMP/gaia-byond"
          cd "$RUNNER_TEMP/gaia-byond/byond"
          make here
      - name: Compile exactly Gaia and stage the runtime-only bundle
        shell: bash
        run: |
          set -eo pipefail
          source "$RUNNER_TEMP/gaia-byond/byond/bin/byondsetup"
          python3 -B tooling/scripts/ci/build_gaia_bundle.py --source "$GITHUB_WORKSPACE/game-source" --byond-bin "$RUNNER_TEMP/gaia-byond/byond/bin" --output "$RUNNER_TEMP/gaia-bundle"
      - name: Upload deployment-compatible artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Gaia-5bf351248de6-BYOND-516.1681
          path: ${{ runner.temp }}/gaia-bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
