# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Intake every branch/base for build: requests; the selector retains ordinary CI eligibility.
  push:
    branches: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      extensive_regressions:
        description: 'Opt in to all existing game and offline regression suites'
        type: boolean
        default: false
      dagger_map_compile:
        description: 'Opt in to native compilation of the inactive Dagger map and missing-type control'
        type: boolean
        default: false
      rack_save_regressions:
        description: 'Opt in only to the paid rack save probe and its six mutation controls'
        type: boolean
        default: false
      persistence_integration_regressions:
        description: 'Opt in to combined persistence, lighting, building and continuous-round controls'
        type: boolean
        default: false
      restart_transaction_regressions:
        description: 'Opt in only to isolated save restart transaction checks'
        type: boolean
        default: false
      world_save_regressions:
        description: 'Opt in only to isolated world-save and expanded-level recovery checks'
        type: boolean
        default: false
      protected_sleep_regressions:
        description: 'Opt in only to protected sleep transfers and save compatibility checks'
        type: boolean
        default: false
      world_save_profile_regressions:
        description: 'Opt in only to serializer phase profiling and its mutation controls'
        type: boolean
        default: false
      world_save_operation_regressions:
        description: 'Opt in only to save/load admission and busy-transition controls'
        type: boolean
        default: false
      lighting_recovery_regressions:
        description: 'Opt in only to actual-constructor lighting persistence recovery and controls'
        type: boolean
        default: false
      extraction_instance_regressions:
        description: 'Opt in to standalone extraction instance assertions and four mutation controls'
        type: boolean
        default: false

permissions:
  contents: read

env:
  BYOND_MAJOR: "516"
  BYOND_MINOR: "1681"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      build_prefix: true
      extensive: ${{ github.event_name == 'workflow_dispatch' && inputs.extensive_regressions }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  evidence-checker:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify noninteractive BYOND bootstrap commands offline
        run: python3 -B -m unittest discover -s tests -p test_byond_bootstrap.py -v
      - name: Test serializer profiling source contracts
        run: python3 -B tests/world_save/test_progress_sources.py -v
      - name: Test digging tool and research admission offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_digging_tools.py')
        run: python3 -B -m unittest discover -s tests -p test_digging_tools.py -v
      - name: Test research scheduler resume source traces offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/research_scheduler')
        run: python3 -B -m unittest discover -s tests/research_scheduler -v
      - name: Test ping scheduler resume source traces offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/ping_scheduler')
        run: python3 -B -m unittest discover -s tests/ping_scheduler -v
      - name: Test local discovery source parity offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/local_discovery')
        run: python3 -B -m unittest discover -s tests/local_discovery -v
      - name: Test optional roof upper-floor source contracts offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/roof_construction')
        run: python3 -B -m unittest discover -s tests/roof_construction -v
      - name: Test protected sleep source and fixture contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save') || inputs.protected_sleep_regressions == true
        run: |
          python3 -B tests/world_save/test_sleep_transfer_sources.py -v
          python3 -B tests/world_save/test_cross_level_sources.py -v
          python3 -B -m unittest discover -s tests/world_save/partial_save_inspector -p test_inspector.py -v
      - name: Test save movement and physical sleep guards offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/save_movement')
        run: python3 -B -m unittest discover -s tests/save_movement -v
      - name: Test floor decal tracking source and offline native evidence contracts
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/floor_decal_tracking')
        run: python3 -B -m unittest discover -s tests/floor_decal_tracking -p 'test_*.py' -v
      - name: Test disabled gameplay bridge contracts without native processes
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/gameplay_bridge')
        run: python3 -B -m unittest discover -s tests/gameplay_bridge -v
      - name: Test inactive reserved lighting clearance and executor guards offline
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/reserved_lighting')
        run: python3 -B -m unittest discover -s tests/reserved_lighting -p 'test_*.py' -v
      - name: Test offline evidence checker
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_game_evidence.py')
        run: python3 -m unittest discover -s tests -p test_game_evidence.py -v
      - name: Test passive hang watchdog without native game or host effects
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/hang_watchdog')
        run: python3 -B -m unittest discover -s tests/hang_watchdog -v
      - name: Test attack history writer ownership and source preparation
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/attack_history')
        run: python3 -m unittest discover -s tests/attack_history -p test_sources.py -v
      - name: Test admin history source preparation
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/admin_history')
        run: python3 -m unittest discover -s tests/admin_history -p test_sources.py -v
      - name: Test fixed bot service control without host effects
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/bot_service')
        run: python3 -m unittest discover -s tests/bot_service -v
      - name: Test isolated OpenDream process and control adapter
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_control.py') || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_opendream_receipts.py')
        run: python3 -m unittest discover -s tests -p 'test_opendream*.py' -v
      - name: Test injected bounded-build guard and Windows adapter
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'scripts/opendream/bounded_build')
        run: python3 -m unittest discover -s scripts/opendream/bounded_build -p 'test_*.py' -v
      - name: Test local WSL staging and owned-process failure paths without WSL
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_local_wsl.py')
        run: python3 -m unittest discover -s tests -p test_local_wsl.py -v
      - name: Test current-source atlas generation and negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_crafting_atlas.py')
        run: python3 -m unittest discover -s tests -p test_crafting_atlas.py -v
      - name: Test source-backed atlas entrypoints eras and processor controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_atlas_navigation.py')
        run: |
          python3 -m unittest discover -s tests -p test_atlas_navigation.py -v
          node tests/crafting_atlas/navigation.test.mjs
      - name: Test and inventory placed outdoor bootstrap resources
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/test_outdoor_bootstrap.py')
        run: |
          python3 -m unittest discover -s tests -p test_outdoor_bootstrap.py -v
          python3 scripts/check-outdoor-bootstrap.py

  extraction-instances:
    needs: changes
    if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/extraction') || (github.event_name == 'workflow_dispatch' && inputs.extraction_instance_regressions)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned standalone BYOND without compiling the game
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo timeout 120 apt-get update
          sudo timeout 120 apt-get install -y --no-install-recommends libstdc++6:i386 libgcc-s1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6:i386 unzip make
          mkdir BYOND
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 0 --output BYOND/pinned.zip "https://civ13.com/downloads/${BYOND_MAJOR}.${BYOND_MINOR}_byond_linux.zip"
          unzip -q BYOND/pinned.zip -d BYOND
          (cd BYOND/byond && make here)
      - name: Verify standalone extraction instances and named mutation assertions
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/extraction') || (github.event_name == 'workflow_dispatch' && inputs.extraction_instance_regressions)
        timeout-minutes: 6
        shell: bash
        env:
          INSTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -m unittest discover -s tests/extraction/instances -p 'test_*.py' -v
          # Vendor setup may append to optional, initially unset environment variables.
          set +u
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          set -u
          /usr/bin/python3 -B tests/extraction/instances/run_ci.py --head "$INSTANCE_HEAD" --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --output "$RUNNER_TEMP/extraction-instances"
      - name: Retain standalone extraction instance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extraction-instances-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/extraction-instances
          retention-days: 7
          if-no-files-found: warn

  # Existing game compilation gate.
  build:
    needs: changes
    if: always() && !cancelled()
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Require successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GAME_SELECTION: ${{ needs.changes.outputs.game }}
          EXTENSIVE_SELECTION: ${{ needs.changes.outputs.extensive }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$GAME_SELECTION" in true|false) ;; *) exit 1 ;; esac
          case "$EXTENSIVE_SELECTION" in true|false) ;; *) exit 1 ;; esac
      - name: Explain compilation skip
        if: needs.changes.outputs.game != 'true'
        run: echo 'Game compilation skipped by change and build-prefix selection.'
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.game == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs a single command using the runners shell
      - name: Run a one-line script
        if: needs.changes.outputs.game == 'true'
        run: sudo bash ./scripts/travis_pre_byond.sh
        shell: bash

      - name: Run native HUD appearance and preservation fixture
        id: hud_visual
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/hud_visual')
        timeout-minutes: 5
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 -B -m unittest discover -s tests/hud_visual -p 'test_*.py' -v
          python3 -B tests/hud_visual/ci.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/hud-visual"
      - name: Upload native HUD evidence
        if: always() && steps.hud_visual.outputs.started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hud-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hud-visual
          if-no-files-found: error

      - name: Check core-boot runner offline and compile generated variants
        id: core_boot_compile
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/core_boot')
        timeout-minutes: 32
        shell: bash
        env:
          CORE_BOOT_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/core-boot-compile"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/core-boot-compile/checkout-commit-tree.txt"
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 -B -m unittest discover -s tests/core_boot -p test_runner.py -v 2>&1 | tee "$RUNNER_TEMP/core-boot-compile/offline-tests.log"
          /usr/bin/python3 -B tests/core_boot/run.py --byond-bin "$PWD/BYOND/byond/bin" --compile-only --output "$RUNNER_TEMP/core-boot-compile/default"
          /usr/bin/python3 -B tests/core_boot/run.py --byond-bin "$PWD/BYOND/byond/bin" --compile-only --negative-control runtime --output "$RUNNER_TEMP/core-boot-compile/runtime"
          /usr/bin/python3 -B tests/core_boot/run.py --byond-bin "$PWD/BYOND/byond/bin" --compile-only --lighting-load --output "$RUNNER_TEMP/core-boot-compile/lighting-load"

      - name: Retain core-boot compile-only evidence
        if: always() && steps.core_boot_compile.outputs.started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-boot-compile-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/core-boot-compile/checkout-commit-tree.txt
            ${{ runner.temp }}/core-boot-compile/offline-tests.log
            ${{ runner.temp }}/core-boot-compile/*/metadata.json
            ${{ runner.temp }}/core-boot-compile/*/compile-inputs.json
            ${{ runner.temp }}/core-boot-compile/*/compile.log
            ${{ runner.temp }}/core-boot-compile/*/compile-status.json
            ${{ runner.temp }}/core-boot-compile/*/compile-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Compile inactive Dagger map and missing-type control
        id: dagger_compile
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/dagger_map') || inputs.dagger_map_compile == true
        timeout-minutes: 25
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 tests/dagger_map/compile_map.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/dagger-compile"
      - name: Retain Dagger native compile evidence
        if: always() && steps.dagger_compile.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dagger-compile-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dagger-compile/
          if-no-files-found: error
          retention-days: 7

      - name: Verify paid rack save and six mutation controls
        if: github.event_name == 'workflow_dispatch' && inputs.rack_save_regressions
        timeout-minutes: 20
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/rack-save"
          mkdir -p "$evidence"
          failed=0
          for control in baseline coverage runtime storage stale-wait duplicate conversion; do
            args=(--probe rack-save --byond-bin "$PWD/BYOND/byond/bin" --output "$evidence/$control")
            if [[ "$control" != baseline ]]; then
              args+=(--rack-control "$control")
            fi
            if /usr/bin/python3 tests/food_progression/preservation_run.py "${args[@]}" > "$evidence/$control.log" 2>&1; then
              printf '%s\tpassed\n' "$control" >> "$evidence/results.tsv"
            else
              printf '%s\tfailed\n' "$control" >> "$evidence/results.tsv"
              failed=1
            fi
            cat "$evidence/$control.log"
          done
          cat "$evidence/results.tsv"
          exit "$failed"
      - name: Upload paid rack save evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.rack_save_regressions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rack-save-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rack-save/
            !${{ runner.temp }}/rack-save/**/*.dmb
            !${{ runner.temp }}/rack-save/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify restored faction UI assets and registration omission control
        id: faction_ui_assets
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/faction_ui_assets')
        shell: bash
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 -B -m unittest discover -s tests/faction_ui_assets -v
          node tests/faction_ui_assets/check_templates.mjs
          /usr/bin/python3 -B tests/faction_ui_assets/run.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/faction-ui-assets-positive"
          /usr/bin/python3 -B tests/faction_ui_assets/run.py --byond-bin "$PWD/BYOND/byond/bin" --omit-registration --evidence-dir "$RUNNER_TEMP/faction-ui-assets-omission"
      - name: Upload focused faction UI asset evidence
        if: always() && steps.faction_ui_assets.outputs.started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faction-ui-assets-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/faction-ui-assets-positive/metadata.json
            ${{ runner.temp }}/faction-ui-assets-positive/result.json
            ${{ runner.temp }}/faction-ui-assets-positive/draft.json
            ${{ runner.temp }}/faction-ui-assets-positive/browser/**
            ${{ runner.temp }}/faction-ui-assets-positive/compile.log
            ${{ runner.temp }}/faction-ui-assets-positive/runtime.log
            ${{ runner.temp }}/faction-ui-assets-positive/daemon.log
            ${{ runner.temp }}/faction-ui-assets-omission/metadata.json
            ${{ runner.temp }}/faction-ui-assets-omission/result.json
            ${{ runner.temp }}/faction-ui-assets-omission/draft.json
            ${{ runner.temp }}/faction-ui-assets-omission/browser/**
            ${{ runner.temp }}/faction-ui-assets-omission/compile.log
            ${{ runner.temp }}/faction-ui-assets-omission/runtime.log
            ${{ runner.temp }}/faction-ui-assets-omission/daemon.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify wildlife registry production hooks and native controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/wildlife_registry')
        timeout-minutes: 10
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 -B -m unittest discover -s tests/wildlife_registry -v
          python3 tests/wildlife_registry/run_native.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/wildlife_registry-native" --all-controls
      - name: Verify farm registry production hooks and native controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/animal_registry')
        timeout-minutes: 10
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          python3 -B -m unittest discover -s tests/animal_registry -v
          python3 tests/animal_registry/run_native.py --byond-bin "$PWD/BYOND/byond/bin" --output "$RUNNER_TEMP/animal_registry-native" --all-controls

      - name: Verify accessory removal actor and native controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/accessory_removal')
        shell: bash
        run: |
          source "$PWD/BYOND/byond/bin/byondsetup"
          /usr/bin/python3 -B -m unittest discover -s tests/accessory_removal -v
          /usr/bin/python3 tests/accessory_removal/run.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/accessory-removal-positive"
          control_status=0
          for control in original-usr fork-guard; do
            /usr/bin/python3 tests/accessory_removal/run.py --byond-bin "$PWD/BYOND/byond/bin" --evidence-dir "$RUNNER_TEMP/accessory-removal-$control" --negative-control "$control" || control_status=1
          done
          test "$control_status" = 0

      - name: Verify optional player help bridge and native negative controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/player_help')
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 -m unittest discover -s tests/player_help -v
          python3 tests/player_help/run-bridge-control.py
          python3 tests/player_help/run-spool-controls.py
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control escaping
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control heartbeat
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control identity
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control rate-limit
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control prompt-first
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control disconnect
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control conversation-generation
          python3 tests/player_help/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin" --negative-control conversation-action
      - name: Verify native lobby Join controls
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/lobby_join')
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
          python3 -m unittest discover -s tests/lobby_join -p 'test_*.py'
          python3 tests/lobby_join/run.py --byond-bin "$GITHUB_WORKSPACE/BYOND/byond/bin"

      - name: Compile stock disabled and gather-enabled bridge closures without running them
        if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/gameplay_bridge')
        timeout-minutes: 22
        shell: bash
        env:
          CIV13_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source "$GITHUB_WORKSPACE/BYOND/byond/bin/byondsetup"
