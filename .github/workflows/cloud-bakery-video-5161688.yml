name: HELD native bakery to carriage
on:
  push:
    branches: [ci/cloud-city-route-preflight-5161688-20261030-r1]
    paths:
      - .github/workflows/cloud-bakery-video-5161688.yml
      - tools/cloud-bakery-video-5161688/**
permissions:
  contents: read
jobs:
  bakery:
    if: >-
      true && github.repository == 'Civ13/Civ13' && github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: bounded no-capture city route preflight r1'
    env:
      EVENT_BEFORE: ${{ github.event.before }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only initial reviewed source publication
        shell: powershell
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $base = 'ff67d89241336d55f456967ec596d5cd10358df6'
          $parents = (git rev-list --parents -n 1 HEAD).Trim().Split(' ')
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 2 -or $parents[0] -ne $env:GITHUB_SHA -or $parents[1] -ne $base) { throw 'Wrong source ancestry.' }
          if ($env:EVENT_BEFORE -ne $base -and $env:EVENT_BEFORE -ne ('0' * 40)) { throw 'Not initial branch publication.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 58404f5bd16e3fed80f1d9844c5db3edd144942c
          path: source-checkout
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize exact committed tooling bytes without Git conversions
        timeout-minutes: 1
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-bakery-video-5161688/materialize.py --repository "$env:GITHUB_WORKSPACE" --revision "$env:GITHUB_SHA" --destination "$env:RUNNER_TEMP/bakery-tooling"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline acquisition, capture and source controls
        working-directory: ${{ runner.temp }}/bakery-tooling
        timeout-minutes: 1
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B -m unittest discover -s tools/cloud-bakery-video-5161688 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" -B -m unittest discover -s tools/cloud-bakery-video-5161688/tests -p 'test_capture.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" -B tools/cloud-bakery-video-5161688/activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage only exact committed Civ13 source and authored assets
        working-directory: ${{ runner.temp }}/bakery-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-bakery-video-5161688/stage.py --repository "$env:GITHUB_WORKSPACE/source-checkout" --destination "$env:RUNNER_TEMP/bakery-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract verified package data without running an installer
        working-directory: ${{ runner.temp }}/bakery-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'bakery-engine'
          if (Test-Path -LiteralPath $engine) { throw 'Fresh engine directory required.' }
          New-Item -ItemType Directory -Path $engine -ErrorAction Stop | Out-Null
          & "$env:pythonLocation/python.exe" -B tools/cloud-bakery-video-5161688/acquire.py --root "$engine"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check existing pinned DirectX components without installing
        working-directory: ${{ runner.temp }}/bakery-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-bakery-video-5161688/installed_directx.py --output "$env:RUNNER_TEMP/bakery-engine/installed-directx-receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run one no-capture city route preflight
        working-directory: ${{ runner.temp }}/bakery-tooling
        timeout-minutes: 5
        shell: pwsh
        run: |
          & './tools/cloud-bakery-video-5161688/firewall_supervisor.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory an existing encoder without executing it
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'encoder-inventory.json'
          if (Test-Path -LiteralPath $out) { throw 'Encoder inventory already exists.' }
          $result = @{ status = 'not_found'; executed = $false; provenance_verified = $false }
          try {
            $cmd = Get-Command -Name 'ffmpeg.exe' -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) {
              $file = Get-Item -LiteralPath $cmd.Source -Force -ErrorAction Stop
              if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 268435456) { throw 'Unsafe encoder candidate' }
              $result = @{ status='candidate_only'; executed=$false; provenance_verified=$false; path=$file.FullName; bytes=$file.Length; sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant(); file_version=$file.VersionInfo.FileVersion }
            }
          } catch { $result = @{ status='inventory_error'; executed=$false; provenance_verified=$false; error=$_.Exception.GetType().Name } }
          $result | ConvertTo-Json -Compress | Set-Content -LiteralPath $out -Encoding utf8NoBOM -ErrorAction Stop
      - name: Admit bounded diagnostic artifacts only
        id: evidence
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bakery-evidence'
          $allowed = @('receipt.json','cleanup-receipt.json','witness-receipt.json','source-receipt.json','intro-take.json','intro-checks.txt','intro-stop.txt','intro-cadence-admission.json','intro-cadence-start.json','intro-cadence-end.json','intro-action-start.json','intro-state-before.json','intro-state-after.json','cadence-recording.json','compiler.stdout.log','compiler.stderr.log','server.stdout.log','server.stderr.log','client.stdout.log','client.stderr.log')
          $allowed += @('city-route-receipt.json','city-route-steps.txt','city-bakery-receipt.json','city-train-before.json','city-train-after.json','city-preflight-complete.txt')
          $files = @()
          if (Test-Path -LiteralPath $root) { $files = @(Get-ChildItem -LiteralPath $root -Force) }
          # The private environment directory is not an artifact and is never uploaded.
          $files = @($files | Where-Object { $_.Name -ne 'environment' })
          $engine = Join-Path $env:RUNNER_TEMP 'bakery-engine'
          foreach ($name in @('acquisition-receipt.json','dependency-receipt.json','acquisition-failure.json','installed-directx-receipt.json')) {
            $path = Join-Path $engine $name
            if (Test-Path -LiteralPath $path) { $files += Get-Item -LiteralPath $path }
          }
          $allowed += @('acquisition-receipt.json','dependency-receipt.json','acquisition-failure.json','installed-directx-receipt.json')
          $inventory = Join-Path $env:RUNNER_TEMP 'encoder-inventory.json'
          if (Test-Path -LiteralPath $inventory) { $files += Get-Item -LiteralPath $inventory }
          $allowed += @('encoder-inventory.json')
          $fwRoot = Join-Path $env:RUNNER_TEMP 'firewall-evidence'
          if (Test-Path -LiteralPath $fwRoot) {
            $fwFiles = @(Get-ChildItem -LiteralPath $fwRoot -Force)
            if ($fwFiles.Count -gt 9) { throw 'Firewall evidence count exceeded.' }
            foreach ($fwFile in $fwFiles) {
              if ($fwFile.Name -notin @('planned.json','active.json','cleanup.json') -and
                  $fwFile.Name -notmatch ('^civ13-preflight-' + $env:GITHUB_RUN_ID + '-1-[0-9a-f]{32}-(dm-exe|dd-exe|dreamseeker-exe)-(v4|v6)\.created\.json$')) { throw 'Unexpected firewall evidence name.' }
              $allowed += $fwFile.Name
              $files += $fwFile
            }
          }
          $setup = Join-Path $engine 'directx-evidence'
          if (Test-Path -LiteralPath $setup) {
            $setupFiles = @(Get-ChildItem -LiteralPath $setup -Force | Where-Object { $_.Name -ne 'environment' })
            $files += $setupFiles
          }
          $allowed += @('directx-setup-receipt.json','directx.stdout.log','directx.stderr.log')
          if ($files.Count -eq 0) { exit 0 }
          $total = 0
          foreach ($file in $files) {
            if ($file.PSIsContainer -or $file.Name -notin $allowed -or $file.Length -gt 1048576 -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected artifact data.' }
            $total += $file.Length
          }
          if ($files.Count -gt 40 -or $total -gt 16777216) { throw 'Artifact size/count bound.' }
          $out = Join-Path $env:RUNNER_TEMP 'bakery-artifact'
          if (Test-Path -LiteralPath $out) { throw 'Artifact staging already exists.' }
          New-Item -ItemType Directory -Path $out | Out-Null
          foreach ($file in $files) { Copy-Item -LiteralPath $file.FullName -Destination $out }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'ready=true' -Encoding utf8
      - name: Retain native scene evidence
        if: ${{ always() && steps.evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bakery-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bakery-artifact/
          retention-days: 7
          if-no-files-found: error
