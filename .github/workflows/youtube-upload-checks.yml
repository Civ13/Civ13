name: YouTube uploader contracts
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      base: ${{ github.event.pull_request.base.sha || '' }}
  contracts:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/youtube_upload')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          php-version: '8.4'
          tools: composer:2.9.8
          coverage: none
      - run: composer install --working-dir=tools/youtube --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress
      - name: YoutubePHP mocked requests and no-retry guard
        run: php -d display_errors=0 tests/youtube_upload/framework.php
      - name: Mocked upload, no-live dry run, provenance and failure contracts
        run: /usr/bin/python3 -B -m unittest discover -s tests/youtube_upload -v
      - name: Real MP4 parser smoke check without channel access or capture
        run: /usr/bin/python3 -B tools/youtube/prepare_import.py probe-smoke
      - name: Parse existing PR3081 MP4 without channel access or capture
        env:
          MANIFEST_ID: pr3081-attachments-public
        run: /usr/bin/python3 -B tools/youtube/prepare_import.py probe-smoke
      - name: Parse unchanged original PR3032 train MP4 without channel access or capture
        env:
          MANIFEST_ID: pr3032-trains-public
        run: /usr/bin/python3 -B tools/youtube/prepare_import.py probe-smoke
      - name: Validate existing train source and all scoped GitHub tree proofs
        env:
          MANIFEST_ID: pr3032-trains-public
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B tools/youtube/prepare_import.py source-smoke
