name: Inactive immutable capture experiment
on:
  pull_request:
    branches: [master, nomads-round-metadata]
    paths:
      - code/modules/persistence/immutable_capture.dm
      - tests/world_save/immutable_capture.dm
      - tests/world_save/immutable_capture.dme
      - tests/world_save/run-immutable-capture.py
      - tests/world_save/test_immutable_capture_runner.py
      - .github/workflows/immutable-capture.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      base: ${{ github.event.pull_request.base.sha || '' }}
  capture:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/world_save')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test omission-control source preparation without an engine
        run: python3 -m unittest discover -s tests/world_save -p 'test_immutable_capture_runner.py'
      # The canonical compiler pin (tools/byond/version.json), from the repository mirror.
      - name: Install isolated pinned BYOND
        shell: bash
        env:
          BYOND_HOME: ${{ runner.temp }}/capture-byond
        run: bash scripts/cloud_byond_setup.sh
      - name: Compile and run positive and four exact controls
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source "$RUNNER_TEMP/capture-byond/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/immutable-capture"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > "$evidence/head.txt"
          git ls-tree -r HEAD -- code/modules/persistence/immutable_capture.dm tests/world_save > "$evidence/source-blobs.txt"
          printf 'case\tstatus\n' > "$evidence/results.tsv"
          failed=0
          for control in positive callback runtime-callback admission hook; do
            mkdir -p "$evidence/$control"
            export TMPDIR="$evidence/$control"
            args=(--byond-bin "$RUNNER_TEMP/capture-byond/byond/bin")
            if [ "$control" != positive ]; then
              args+=(--negative-control "$control")
            fi
            if /usr/bin/python3 tests/world_save/run-immutable-capture.py "${args[@]}" > "$evidence/$control.log" 2>&1; then
              printf '%s\tpassed\n' "$control" >> "$evidence/results.tsv"
            else
              printf '%s\tfailed\n' "$control" >> "$evidence/results.tsv"
              failed=1
            fi
            cat "$evidence/$control.log"
          done
          cat "$evidence/results.tsv"
          exit "$failed"
      - name: Retain exact-head experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-capture-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/immutable-capture/
            !${{ runner.temp }}/immutable-capture/**/*.dmb
            !${{ runner.temp }}/immutable-capture/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
