name: Environment sweep regressions
on:
  pull_request:
    branches: [master]
    paths:
      - code/_helpers/game.dm
      - code/processes/time_of_day_change.dm
      - code/modules/lighting/**
      - code/modules/1713/weather.dm
      - tests/environment_sweeps/**
      - .github/workflows/environment-sweeps.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      base: ${{ github.event.pull_request.base.sha || '' }}
  environment-sweeps:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/environment_sweeps')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned BYOND
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1 libcurl4:i386 unzip make
          wget -q -O "$RUNNER_TEMP/byond.zip" https://civ13.com/downloads/516.1681_byond_linux.zip
          unzip -q "$RUNNER_TEMP/byond.zip" -d "$RUNNER_TEMP/environment-byond"
          cd "$RUNNER_TEMP/environment-byond/byond"
          make here
      - name: Compare original and bounded production sweep behavior
        run: |
          source "$RUNNER_TEMP/environment-byond/byond/bin/byondsetup"
          python3 tests/environment_sweeps/run.py --byond-bin "$RUNNER_TEMP/environment-byond/byond/bin" --baseline --size 128 --areas 256 --output-metadata "$RUNNER_TEMP/environment-baseline.json"
          python3 tests/environment_sweeps/run.py --byond-bin "$RUNNER_TEMP/environment-byond/byond/bin" --size 128 --areas 256 --compare-metadata "$RUNNER_TEMP/environment-baseline.json"
          python3 tests/environment_sweeps/run.py --byond-bin "$RUNNER_TEMP/environment-byond/byond/bin" --size 128 --areas 256 --negative-control yield
          python3 tests/environment_sweeps/run.py --byond-bin "$RUNNER_TEMP/environment-byond/byond/bin" --size 128 --areas 256 --negative-control overlap
      - name: Retain isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-sweeps-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/civ13-environment-*/*.log
            /tmp/civ13-environment-*/*.json
            /tmp/civ13-environment-*/*.jsonl
            /tmp/civ13-environment-*/result.txt
            /tmp/civ13-environment-*/tested.patch
          if-no-files-found: warn
          retention-days: 7
