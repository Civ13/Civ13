name: Transfer storage
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of shipping with forced restarts in the two-region pilot
        type: number
        default: 90
  pull_request:
    branches: [master]
    paths:
      - tools/transfer_storage/**
      - tests/transfer_storage/**
      - code/modules/persistence/transfer_bridge.dm
      - code/modules/persistence/transfer_trade_post.dm
      - code/modules/persistence/saving.dm
      - code/modules/persistence/loading.dm
      - code/modules/persistence/functions.dm
      - .github/workflows/transfer-storage.yml
  push:
    branches: [master]
    paths:
      - tools/transfer_storage/**
      - tests/transfer_storage/**
      - code/modules/persistence/transfer_bridge.dm
      - code/modules/persistence/transfer_trade_post.dm
      - code/modules/persistence/saving.dm
      - code/modules/persistence/loading.dm
      - code/modules/persistence/functions.dm
      - .github/workflows/transfer-storage.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Store crash and retry tests
        run: python -I -B tests/transfer_storage/run.py
  pilot:
    # Two DreamDaemon regions with forced restarts. Manual only: it installs
    # BYOND and takes a few minutes of runner time.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the pinned BYOND
        run: bash scripts/cloud_byond_setup.sh
      - name: Fetch rust-g 3.0.0 (the pilot checks its SHA-256)
        run: curl -sSLf --retry 3 -o "$RUNNER_TEMP/librust_g.so" https://github.com/tgstation/rust-g/releases/download/3.0.0/librust_g.so
      - name: Two-region pilot
        env:
          PILOT_SECONDS: ${{ inputs.seconds }}
        run: |
          python3 -B tests/transfer_storage/pilot/run.py --byond-bin "$HOME/byond-516.1688/byond/bin" \
            --rust-g "$RUNNER_TEMP/librust_g.so" --seconds "$PILOT_SECONDS" --seed "$GITHUB_RUN_ID" --keep-logs
