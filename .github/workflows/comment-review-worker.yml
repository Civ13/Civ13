name: Codex comment review worker
on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      key:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
# Serializes the complete review + publish lifecycle per comment.
# Bursts of edits coalesce to the current API body. Different comments are retained.
concurrency:
  group: codex-comment-${{ inputs.key }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  review:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      message: ${{ steps.codex.outputs.final-message }}
      marker: ${{ steps.prepare.outputs.marker }}
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require configured API key
        env:
          KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: test "$KEY_PRESENT" = true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and deduplicate current information
        id: prepare
        run: node tools/comment-review/review.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CANDIDATE: ${{ inputs.candidate }}
      # Last step. The review job has no write token or production credentials.
      - uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        id: codex
        if: steps.prepare.outputs.ready == 'true'
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: comment-review-prompt.txt
          codex-version: 0.162.1
          model: ${{ vars.CODEX_COMMENT_REVIEW_MODEL }}
          effort: medium
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          # Public comments are intentionally eligible. Author identity never grants
          # write/merge/deploy permissions to Codex.
          allow-users: '*'
          allow-bot-users: ${{ endsWith(github.actor, '[bot]') && github.actor || '' }}
  publish:
    needs: review
    if: needs.review.outputs.ready == 'true' && needs.review.outputs.message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Revalidate revision and post bounded review
        run: node tools/comment-review/review.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CANDIDATE: ${{ inputs.candidate }}
          REVIEW_MARKER: ${{ needs.review.outputs.marker }}
          REVIEW_MESSAGE: ${{ needs.review.outputs.message }}
