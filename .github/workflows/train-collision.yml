name: Train collision regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BYOND_ARCHIVE_SOURCE: repository-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile full game with pinned BYOND
        run: bash scripts/travis_pre_byond.sh
      - name: Run bounded train regressions
        shell: bash
        run: |
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" MANPATH="${MANPATH:-}"
          source BYOND/byond/bin/byondsetup
          bash tests/train_collision/run.sh "$PWD/BYOND/byond/bin" "$PWD/BYOND/pinned.zip" "$RUNNER_TEMP/train-collision"
      - name: Retain manual fixture identity and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: train-collision-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/compile/
            ${{ runner.temp }}/train-collision/
            !${{ runner.temp }}/train-collision/**/*.dmb
            !${{ runner.temp }}/train-collision/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
