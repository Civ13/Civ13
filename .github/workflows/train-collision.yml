name: Train collision regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BYOND_MAJOR: '516'
      BYOND_MINOR: '1681'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile full game with pinned BYOND
        # This held legacy fixture is intentionally independent of the active pin.
        run: sudo bash scripts/travis_pre_byond.sh --legacy-fixture-5161681
      - name: Run bounded train regressions
        shell: bash
        run: |
          source BYOND/byond/bin/byondsetup
          bash tests/train_collision/run.sh
