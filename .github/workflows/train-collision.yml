name: Train collision regression
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  train-collision:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BYOND_MAJOR: '516'
      BYOND_MINOR: '1681'
    steps:
      - name: Require successful change selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          GAME_SELECTION: ${{ needs.changes.outputs.game }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$GAME_SELECTION" in true|false) ;; *) exit 1 ;; esac
      - name: Explain documentation-only skip
        if: needs.changes.outputs.game != 'true'
        run: echo 'Game compilation and regressions skipped because only documentation changed.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.game == 'true'
        with:
          persist-credentials: false
      - name: Compile full game with pinned BYOND
        if: needs.changes.outputs.game == 'true'
        run: sudo bash scripts/travis_pre_byond.sh
      - name: Run bounded train regressions
        if: needs.changes.outputs.game == 'true'
        shell: bash
        run: |
          source BYOND/byond/bin/byondsetup
          bash tests/train_collision/run.sh
