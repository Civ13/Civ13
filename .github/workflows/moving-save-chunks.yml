name: Bounded moving-save correctness and memory
on:
  pull_request:
    paths:
      - 'tests/movement_save_chunks/**'
      - 'code/modules/persistence/saving.dm'
      - 'code/modules/persistence/functions.dm'
      - 'code/modules/persistence/loading.dm'
      - 'code/modules/persistence/player_reclaim.dm'
      - 'code/modules/multiz/world_z_budget.dm'
      - 'code/predefines.dm'
      - 'tests/world_save/stubs.dm'
      - 'scripts/byond_runtime.py'
      - 'scripts/byond_toolchain.py'
      - 'scripts/travis_pre_byond.sh'
      - 'tools/byond/version.json'
      - '.github/workflows/moving-save-chunks.yml'
  workflow_dispatch:
    inputs:
      human_spatial_only:
        description: 'Run the separately reviewed human spatial fixture only'
        type: boolean
        default: false
      human_scale_only:
        description: 'Run the separately reviewed synthetic human scale comparison only'
        type: boolean
        default: false
      lighting_interleave_only:
        description: 'Run the separately reviewed synthetic lighting interleaving fixture only'
        type: boolean
        default: false
      reviewed_head:
        description: 'Full independently reviewed commit SHA (required for human fixture)'
        type: string
        default: ''
      reviewed_scope_sha256:
        description: 'Independently reviewed overlay and driver SHA-256 (required for human fixture)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  isolated-native:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.human_spatial_only != true && inputs.human_scale_only != true && inputs.lighting_interleave_only != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline source and resource-policy controls
        run: python3 -B -m unittest discover -s tests/movement_save_chunks -v
      - name: Install verified 516.1688 and compile exact game source
        timeout-minutes: 15
        env:
          BYOND_MAJOR: '516'
          BYOND_MINOR: '1688'
          BYOND_ARCHIVE_SOURCE: repository-release
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          bash scripts/travis_pre_byond.sh
      - name: Isolated native correctness and bounded memory matrix
        timeout-minutes: 21
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # The vendor setup appends optional environment variables; nounset stays enabled.
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          export MANPATH="${MANPATH:-}"
          source "$PWD/BYOND/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/moving-save-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source-identity.txt"
          python3 -B tests/movement_save_chunks/correctness.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/correctness" --job-seconds 240
          python3 -B tests/movement_save_chunks/benchmark.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/memory" --job-seconds 900
      - name: Retain all exact-head evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moving-save-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/moving-save-evidence/
            .ci/compile/
            !${{ runner.temp }}/moving-save-evidence/**/*.dmb
            !${{ runner.temp }}/moving-save-evidence/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  lighting-interleave:
    # Conflicting manual-only selectors fail before provisioning or native work.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lighting_interleave_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed fixture and offline controls
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
          EVENT_HEAD: ${{ github.sha }}
          SPATIAL_ONLY: ${{ inputs.human_spatial_only }}
          SCALE_ONLY: ${{ inputs.human_scale_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lighting-interleave-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/lighting-interleave-meta/preflight.json"' EXIT
          test "$SPATIAL_ONLY" != true
          test "$SCALE_ONLY" != true
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SCOPE" =~ ^[0-9a-f]{64}$ ]]
          test "$REVIEWED_HEAD" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet
          python3 -B -c 'import os,sys; sys.path.insert(0,"tests/world_save"); import lighting_interleave_run as r; r.verify(os.environ["REVIEWED_HEAD"],os.environ["REVIEWED_SCOPE"]); r.scale.free_space(os.environ["RUNNER_TEMP"], r.scale.MIN_FREE_START)'
          python3 -B -m unittest discover -s tests/world_save -p 'test_lighting_interleave_*.py' -v
          python3 -B -m unittest discover -s tests/world_save -p 'test_restore_integration_sources.py' -v
      - name: Provision pinned runtime without compiling the game
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/lighting-interleave-meta/bootstrap.json"' EXIT
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          sudo timeout -k 5 30 dpkg --add-architecture i386
          apt_acquire=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 120 apt-get "${apt_acquire[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 180 apt-get "${apt_acquire[@]}" install -y --no-install-recommends python3 wget git unzip make sudo libstdc++6:i386 libgcc-s1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6 libncurses6:i386
          mkdir BYOND
          timeout -k 5 65 python3 -B scripts/byond_toolchain.py download --platform linux --output BYOND/pinned.zip --source repository-release > "$RUNNER_TEMP/lighting-interleave-meta/byond-download.json"
          timeout -k 5 30 unzip -q BYOND/pinned.zip -d BYOND
          test -x BYOND/byond/bin/DreamMaker
          test -x BYOND/byond/bin/DreamDaemon
          python3 -B scripts/byond_runtime.py --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" > "$RUNNER_TEMP/lighting-interleave-meta/byond-runtime.json"
      - name: Run one bounded synthetic lighting fixture
        timeout-minutes: 8
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/lighting-interleave-meta/fixture.json"' EXIT
          python3 -B tests/world_save/lighting_interleave_run.py --run-native \
            --expected-head "$REVIEWED_HEAD" --expected-scope-sha256 "$REVIEWED_SCOPE" \
            --output "$RUNNER_TEMP/lighting-interleave-evidence"
      - name: Retain synthetic receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighting-interleave-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lighting-interleave-meta/*.json
            ${{ runner.temp }}/lighting-interleave-evidence/*.json
            ${{ runner.temp }}/lighting-interleave-evidence/stage/compile-*.log
            ${{ runner.temp }}/lighting-interleave-evidence/stage/compile-supervision.json
            ${{ runner.temp }}/lighting-interleave-evidence/writer/*.json
            ${{ runner.temp }}/lighting-interleave-evidence/writer/*.log
            ${{ runner.temp }}/lighting-interleave-evidence/reader/*.json
            ${{ runner.temp }}/lighting-interleave-evidence/reader/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  human-spatial:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.human_spatial_only == true && inputs.human_scale_only != true && inputs.lighting_interleave_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify approved immutable head and offline source contracts
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
          EVENT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SCOPE" =~ ^[0-9a-f]{64}$ ]]
          test "$REVIEWED_HEAD" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet
          python3 -B -c 'import os,sys; sys.path.insert(0,"tests/movement_save_chunks"); import human_spatial_stage as s; s.review_scope()["sha256"] == os.environ["REVIEWED_SCOPE"] or sys.exit("review scope mismatch")'
          python3 -B -m unittest discover -s tests/movement_save_chunks -p 'test_human*.py' -v
      - name: Provision pinned runtime without compiling the game
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/human-spatial-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/human-spatial-meta/bootstrap.json"' EXIT
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          sudo timeout -k 5 30 dpkg --add-architecture i386
          apt_acquire=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 120 apt-get "${apt_acquire[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 180 apt-get "${apt_acquire[@]}" install -y --no-install-recommends python3 wget git unzip make sudo libstdc++6:i386 libgcc-s1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6 libncurses6:i386
          mkdir BYOND
          timeout -k 5 65 python3 -B scripts/byond_toolchain.py download --platform linux --output BYOND/pinned.zip --source repository-release > "$RUNNER_TEMP/human-spatial-meta/byond-download.json"
          timeout -k 5 30 unzip -q BYOND/pinned.zip -d BYOND
          test -x BYOND/byond/bin/DreamMaker
          test -x BYOND/byond/bin/DreamDaemon
          python3 -B scripts/byond_runtime.py --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" > "$RUNNER_TEMP/human-spatial-meta/byond-runtime.json"
      - name: Run approved synthetic writer, reader and rejection controls
        timeout-minutes: 15
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet
          mkdir -p "$RUNNER_TEMP/human-spatial-evidence"
          python3 -B tests/movement_save_chunks/human_spatial_run.py --run-native \
            --expected-head "$REVIEWED_HEAD" --expected-scope-sha256 "$REVIEWED_SCOPE" \
            --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" \
            --output "$RUNNER_TEMP/human-spatial-evidence/run"
      - name: Retain synthetic evidence and bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-spatial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/compile/
            ${{ runner.temp }}/human-spatial-meta/*.json
            ${{ runner.temp }}/human-spatial-evidence/run/*.json
            ${{ runner.temp }}/human-spatial-evidence/run/stage/compile-*.log
            ${{ runner.temp }}/human-spatial-evidence/run/stage/compile-supervision.json
            ${{ runner.temp }}/human-spatial-evidence/run/writer-*/**
            ${{ runner.temp }}/human-spatial-evidence/run/reader-*/**
            ${{ runner.temp }}/human-spatial-evidence/run/negative-*/**
            ${{ runner.temp }}/human-spatial-evidence/run/drag/**
            !${{ runner.temp }}/human-spatial-evidence/run/**/*.dmb
            !${{ runner.temp }}/human-spatial-evidence/run/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  human-scale:
    # If both exclusive inputs are true this job fails explicitly before staging.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.human_scale_only == true && inputs.lighting_interleave_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed source, scope, disk and offline controls
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
          EVENT_HEAD: ${{ github.sha }}
          SPATIAL_ONLY: ${{ inputs.human_spatial_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/human-scale-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/human-scale-meta/preflight.json"' EXIT
          test "$SPATIAL_ONLY" != true
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SCOPE" =~ ^[0-9a-f]{64}$ ]]
          test "$REVIEWED_HEAD" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git diff --quiet HEAD --
          git diff --cached --quiet
          python3 -B -c 'import os,shutil,sys; sys.path.insert(0,"tests/movement_save_chunks"); import human_scale_run as r; r.verify_review(os.environ["REVIEWED_HEAD"],os.environ["REVIEWED_SCOPE"]); shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 16*1024**3 or sys.exit("insufficient available disk")'
          python3 -B -m unittest discover -s tests/movement_save_chunks -p 'test_human_scale*.py' -v
      - name: Install pinned toolchain and compile the full game
        timeout-minutes: 18
        env:
          BYOND_MAJOR: '516'
          BYOND_MINOR: '1688'
          BYOND_ARCHIVE_SOURCE: repository-release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/human-scale-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/human-scale-meta/bootstrap.json"' EXIT
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          bash scripts/travis_pre_byond.sh
      - name: Run separately approved synthetic scale comparison
        timeout-minutes: 68
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/human-scale-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/human-scale-meta/fixture.json"' EXIT
          python3 -B tests/movement_save_chunks/human_scale_run.py --run-native \
            --expected-head "$REVIEWED_HEAD" --expected-scope-sha256 "$REVIEWED_SCOPE" \
            --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" \
            --output "$RUNNER_TEMP/human-scale-evidence"
      - name: Retain bounded scale receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-scale-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/human-scale-meta/*.json
            .ci/compile/
            ${{ runner.temp }}/human-scale-evidence/*.json
            ${{ runner.temp }}/human-scale-evidence/source/*.json
            ${{ runner.temp }}/human-scale-evidence/source/stage/compile-*.log
            ${{ runner.temp }}/human-scale-evidence/source/stage/compile-*-supervision.json
            ${{ runner.temp }}/human-scale-evidence/*-writer/*.json
            ${{ runner.temp }}/human-scale-evidence/*-writer/*.log
            ${{ runner.temp }}/human-scale-evidence/*-reader/*.json
            ${{ runner.temp }}/human-scale-evidence/*-reader/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
