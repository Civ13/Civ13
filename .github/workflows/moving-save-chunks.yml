name: Bounded moving-save correctness and memory
on:
  pull_request:
    paths:
      - 'tests/movement_save_chunks/**'
      - 'code/modules/persistence/saving.dm'
      - 'code/modules/persistence/functions.dm'
      - 'code/modules/persistence/loading.dm'
      - 'code/modules/persistence/player_reclaim.dm'
      - 'code/modules/multiz/world_z_budget.dm'
      - 'code/predefines.dm'
      - 'tests/world_save/stubs.dm'
      - 'scripts/byond_runtime.py'
      - 'scripts/byond_toolchain.py'
      - 'scripts/travis_pre_byond.sh'
      - 'tools/byond/version.json'
      - '.github/workflows/moving-save-chunks.yml'
  workflow_dispatch:
    inputs:
      wildlife_smoke:
        description: 'Run only the reviewed bounded wildlife smoke'
        type: boolean
        required: true
        default: false
      wildlife_extended:
        description: 'Run only the reviewed extended wildlife observation fixtures'
        type: boolean
        required: true
        default: false
      wildlife_production_compile:
        description: 'Run only the bounded full production DME compile'
        type: boolean
        required: true
        default: false
      expected_wildlife_head:
        description: 'Exact 40-character reviewed wildlife commit'
        type: string
        required: false
permissions:
  contents: read
jobs:
  isolated-native:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.wildlife_smoke != true && inputs.wildlife_extended != true && inputs.wildlife_production_compile != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline source and resource-policy controls
        run: python3 -B -m unittest discover -s tests/movement_save_chunks -v
      - name: Install verified 516.1688 and compile exact game source
        timeout-minutes: 15
        env:
          BYOND_MAJOR: '516'
          BYOND_MINOR: '1688'
          BYOND_ARCHIVE_SOURCE: repository-release
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          bash scripts/travis_pre_byond.sh
      - name: Isolated native correctness and bounded memory matrix
        timeout-minutes: 21
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # The vendor setup appends optional environment variables; nounset stays enabled.
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          export MANPATH="${MANPATH:-}"
          source "$PWD/BYOND/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/moving-save-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source-identity.txt"
          python3 -B tests/movement_save_chunks/correctness.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/correctness" --job-seconds 240
          python3 -B tests/movement_save_chunks/benchmark.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/memory" --job-seconds 900
      - name: Retain all exact-head evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moving-save-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/moving-save-evidence/
            .ci/compile/
            !${{ runner.temp }}/moving-save-evidence/**/*.dmb
            !${{ runner.temp }}/moving-save-evidence/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  wildlife-cloud-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.wildlife_smoke == true && inputs.wildlife_extended != true && inputs.wildlife_production_compile != true) || (inputs.wildlife_extended == true && inputs.wildlife_smoke != true && inputs.wildlife_production_compile != true) || (inputs.wildlife_production_compile == true && inputs.wildlife_smoke != true && inputs.wildlife_extended != true)) && github.repository == 'Civ13/Civ13' && github.repository_id == '141349998' && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify public hosted runner and exact manual revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_wildlife_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(gh api repos/Civ13/Civ13 --jq '[.id,.visibility] | @tsv')" = $'141349998\tpublic'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline cloud admission contracts
        run: |
          python3 -I -B -m unittest discover -s tests/human_subtile -p 'test_cloud_npc*.py'
          python3 -I -B -m unittest discover -s tests/human_subtile -p 'test_wildlife_extended.py'
          python3 -I -B -m unittest discover -s tests/human_subtile -p 'test_cloud_production_compile.py'
      - name: Run exact-head bounded fixture smoke
        env:
          EXPECTED_HEAD: ${{ inputs.expected_wildlife_head }}
          CIV13_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          WILDLIFE_SUITE: ${{ inputs.wildlife_production_compile == true && 'production_compile' || inputs.wildlife_extended == true && 'extended' || 'smoke' }}
        run: |
          set -euo pipefail
          python3 -I -B tests/human_subtile/cloud_npc_job.py --execute --head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/wildlife-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-setup" \
            --controller-output "$RUNNER_TEMP/wildlife-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-controller" --suite "$WILDLIFE_SUITE"
