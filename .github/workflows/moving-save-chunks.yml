name: Bounded moving-save correctness and memory
on:
  pull_request:
    paths:
      - 'tests/movement_save_chunks/**'
      - 'code/modules/persistence/saving.dm'
      - 'code/modules/persistence/functions.dm'
      - 'code/modules/persistence/loading.dm'
      - 'code/modules/persistence/player_reclaim.dm'
      - 'code/modules/multiz/world_z_budget.dm'
      - 'code/predefines.dm'
      - 'tests/world_save/stubs.dm'
      - 'scripts/byond_runtime.py'
      - 'scripts/byond_toolchain.py'
      - 'scripts/travis_pre_byond.sh'
      - 'tools/byond/version.json'
      - '.github/workflows/moving-save-chunks.yml'
  workflow_dispatch:
    inputs:
      debug_lossy_only:
        description: 'Run the reviewed synthetic debug-lossy writer/reader only'
        type: boolean
        default: false
      reviewed_head:
        description: 'Full independently reviewed commit SHA'
        type: string
        default: ''
      reviewed_scope_sha256:
        description: 'Independently reviewed fixture scope SHA-256'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  isolated-native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.debug_lossy_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline source and resource-policy controls
        run: python3 -B -m unittest discover -s tests/movement_save_chunks -v
      - name: Install verified 516.1688 and compile exact game source
        timeout-minutes: 15
        env:
          BYOND_MAJOR: '516'
          BYOND_MINOR: '1688'
          BYOND_ARCHIVE_SOURCE: repository-release
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          bash scripts/travis_pre_byond.sh
      - name: Isolated native correctness and bounded memory matrix
        timeout-minutes: 21
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # The vendor setup appends optional environment variables; nounset stays enabled.
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          export MANPATH="${MANPATH:-}"
          source "$PWD/BYOND/byond/bin/byondsetup"
          evidence="$RUNNER_TEMP/moving-save-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source-identity.txt"
          python3 -B tests/movement_save_chunks/correctness.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/correctness" --job-seconds 240
          python3 -B tests/movement_save_chunks/benchmark.py --run-native --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" --output "$evidence/memory" --job-seconds 900
      - name: Retain all exact-head evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moving-save-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/moving-save-evidence/
            .ci/compile/
            !${{ runner.temp }}/moving-save-evidence/**/*.dmb
            !${{ runner.temp }}/moving-save-evidence/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  debug-lossy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_lossy_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed fixture and offline controls
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
          EVENT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debug-lossy-meta"
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/debug-lossy-meta/preflight.json"' EXIT
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_SCOPE" =~ ^[0-9a-f]{64}$ ]]
          test "$REVIEWED_HEAD" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B -c 'import os,sys; sys.path.insert(0,"tests/save_debug_fixture"); import stage; stage.scope()["sha256"] == os.environ["REVIEWED_SCOPE"] or sys.exit("review scope mismatch")'
          python3 -B -m unittest discover -s tests/save_debug_fixture -p 'test*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_byond_runtime.py' -v
      - name: Provision pinned runtime without compiling the game
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/debug-lossy-meta/bootstrap.json"' EXIT
          test "$(python3 scripts/byond_toolchain.py field version)" = 516.1688
          sudo timeout -k 5 30 dpkg --add-architecture i386
          apt_acquire=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 120 apt-get "${apt_acquire[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout -k 5 180 apt-get "${apt_acquire[@]}" install -y --no-install-recommends python3 wget git unzip make sudo libstdc++6:i386 libgcc-s1:i386 libc6-i386 libcurl4:i386 lib32z1 libncurses6 libncurses6:i386
          mkdir BYOND
          timeout -k 5 65 python3 -B scripts/byond_toolchain.py download --platform linux --output BYOND/pinned.zip --source repository-release > "$RUNNER_TEMP/debug-lossy-meta/byond-download.json"
          timeout -k 5 30 unzip -q BYOND/pinned.zip -d BYOND
          test -x BYOND/byond/bin/DreamMaker
          test -x BYOND/byond/bin/DreamDaemon
          python3 -B scripts/byond_runtime.py --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" > "$RUNNER_TEMP/debug-lossy-meta/byond-runtime.json"
      - name: Run bounded synthetic debug-lossy writer and fresh reader
        timeout-minutes: 12
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          REVIEWED_SCOPE: ${{ inputs.reviewed_scope_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'code=$?; printf "{\"exit_code\":%s}\n" "$code" > "$RUNNER_TEMP/debug-lossy-meta/fixture.json"' EXIT
          python3 -B tests/save_debug_fixture/controller.py --run-native \
            --head "$REVIEWED_HEAD" --scope "$REVIEWED_SCOPE" \
            --byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip" \
            --output "$RUNNER_TEMP/debug-lossy-evidence"
      - name: Retain synthetic receipts, save bytes and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-lossy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/debug-lossy-meta/*.json
            ${{ runner.temp }}/debug-lossy-evidence/*.json
            ${{ runner.temp }}/debug-lossy-evidence/*.log
            ${{ runner.temp }}/debug-lossy-evidence/runtime/
            !${{ runner.temp }}/debug-lossy-evidence/runtime/*.dmb
            !${{ runner.temp }}/debug-lossy-evidence/runtime/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
