name: Codex comment review
on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Comment review intake]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  identify:
    if: vars.CODEX_COMMENT_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.identify.outputs.candidate }}
      key: ${{ steps.identify.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: identify
        with:
          script: |
            const { candidate, fromRun, apiClient } =
              await import(process.env.GITHUB_WORKSPACE + '/tools/comment-review/review.mjs');
            const repo = context.repo.owner + '/' + context.repo.repo;
            const api = apiClient(repo, process.env.GITHUB_TOKEN);
            let value;
            if (context.eventName === 'issue_comment') {
              value = candidate(context.eventName, context.payload);
            } else {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return;
              value = await fromRun(api, run, repo, async id => {
                const { data } = await github.rest.actions.downloadArtifact({
                  ...context.repo, artifact_id: id, archive_format: 'zip'
                });
                if (data.byteLength > 8192) throw new Error('Artifact too large');
                const { writeFileSync } = await import('node:fs');
                const { execFileSync } = await import('node:child_process');
                const path = process.env.RUNNER_TEMP + '/comment-event.zip';
                writeFileSync(path, Buffer.from(data));
                return JSON.parse(execFileSync('unzip', ['-p', path, 'event.json'],
                  { maxBuffer: 8192, encoding: 'utf8' }));
              });
            }
            core.setOutput('candidate', JSON.stringify(value));
            core.setOutput('key', value.event + '-' + value.id);
        env:
          GITHUB_TOKEN: ${{ github.token }}
  review:
    needs: identify
    if: needs.identify.outputs.candidate != ''
    uses: ./.github/workflows/comment-review-worker.yml
    with:
      candidate: ${{ needs.identify.outputs.candidate }}
      key: ${{ needs.identify.outputs.key }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
