name: Dagger map static checks
on:
  pull_request:
    branches: [master]
    paths:
      - tests/dagger_map/**
      - maps/WIP/dagger_train_home.*
      - .github/workflows/dagger-map.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
    with:
      extensive: ${{ github.event_name == 'workflow_dispatch' }}
      base: ${{ github.event.pull_request.base.sha || '' }}
  static-layout:
    needs: changes
    if: needs.changes.outputs.extensive == 'true' || contains(fromJSON(needs.changes.outputs.new_tests), 'tests/dagger_map')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check generated layout and mutation controls
        run: |
          python3 tests/dagger_map/build_map.py --check
          python3 tests/dagger_map/validate_map.py
          python3 -m unittest discover -s tests/dagger_map -p 'test_*.py' -v
