name: HELD native harvest
on:
  push:
    branches: [ci/cloud-trailer-test-5161688-20261104-r1]
    paths:
      - .github/workflows/cloud-harvest-video-5161688.yml
      - tools/cloud-harvest-video-5161688/**
permissions:
  contents: read
jobs:
  harvest:
    if: >-
      github.repository == 'Civ13/Civ13' && github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: trailer test native harvest r1'
    env:
      EVENT_BEFORE: ${{ github.event.before }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only initial reviewed source publication
        shell: powershell
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $base = 'ff67d89241336d55f456967ec596d5cd10358df6'
          $parents = (git rev-list --parents -n 1 HEAD).Trim().Split(' ')
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 2 -or $parents[0] -ne $env:GITHUB_SHA -or $parents[1] -ne $base) { throw 'Wrong source ancestry.' }
          if ($env:EVENT_BEFORE -ne $base -and $env:EVENT_BEFORE -ne ('0' * 40)) { throw 'Not initial branch publication.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 58404f5bd16e3fed80f1d9844c5db3edd144942c
          path: source-checkout
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize exact committed tooling bytes without Git conversions
        timeout-minutes: 1
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/materialize.py --repository "$env:GITHUB_WORKSPACE" --revision "$env:GITHUB_SHA" --destination "$env:RUNNER_TEMP/harvest-tooling"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline acquisition, capture and source controls
        working-directory: ${{ runner.temp }}/harvest-tooling
        timeout-minutes: 1
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B -m unittest discover -s tools/cloud-harvest-video-5161688 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" -B -m unittest discover -s tools/cloud-harvest-video-5161688/tests -p 'test_capture.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage only exact committed Civ13 source and authored assets
        working-directory: ${{ runner.temp }}/harvest-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/stage.py --repository "$env:GITHUB_WORKSPACE/source-checkout" --destination "$env:RUNNER_TEMP/harvest-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract verified package data without running an installer
        working-directory: ${{ runner.temp }}/harvest-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'harvest-engine'
          if (Test-Path -LiteralPath $engine) { throw 'Fresh engine directory required.' }
          New-Item -ItemType Directory -Path $engine -ErrorAction Stop | Out-Null
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/acquire.py --root "$engine"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact bundled Microsoft DirectX runtime after explicit terms approval
        working-directory: ${{ runner.temp }}/harvest-tooling
        timeout-minutes: 2
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/directx_setup.py --root "$env:RUNNER_TEMP/harvest-engine" --output "$env:RUNNER_TEMP/harvest-engine/directx-evidence" --accept-bundled-microsoft-directx-terms
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and record one eight-second harvest take
        working-directory: ${{ runner.temp }}/harvest-tooling
        timeout-minutes: 4
        shell: powershell
        run: |
          & "$env:pythonLocation/python.exe" -B tools/cloud-harvest-video-5161688/run_scene.py --binary "$env:RUNNER_TEMP/harvest-engine/byond/bin" --source "$env:RUNNER_TEMP/harvest-source" --output "$env:RUNNER_TEMP/harvest-evidence" --execute-reviewed-scene
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Admit bounded diagnostic artifacts only
        id: evidence
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'harvest-evidence'
          $allowed = @('receipt.json','cleanup-receipt.json','witness-receipt.json','source-receipt.json','intro-take.json','intro-checks.txt','intro-stop.txt','intro-cadence-admission.json','intro-cadence-start.json','intro-cadence-end.json','intro-action-start.json','intro-state-before.json','intro-state-after.json','cadence-recording.json','compiler.stdout.log','compiler.stderr.log','server.stdout.log','server.stderr.log','client.stdout.log','client.stderr.log')
          0..159 | ForEach-Object { $allowed += ('cadence-{0:000}.png' -f $_) }
          $files = @()
          if (Test-Path -LiteralPath $root) { $files = @(Get-ChildItem -LiteralPath $root -Force) }
          # The private environment directory is not an artifact and is never uploaded.
          $files = @($files | Where-Object { $_.Name -ne 'environment' })
          $engine = Join-Path $env:RUNNER_TEMP 'harvest-engine'
          foreach ($name in @('acquisition-receipt.json','dependency-receipt.json','acquisition-failure.json')) {
            $path = Join-Path $engine $name
            if (Test-Path -LiteralPath $path) { $files += Get-Item -LiteralPath $path }
          }
          $allowed += @('acquisition-receipt.json','dependency-receipt.json','acquisition-failure.json')
          $setup = Join-Path $engine 'directx-evidence'
          if (Test-Path -LiteralPath $setup) {
            $setupFiles = @(Get-ChildItem -LiteralPath $setup -Force | Where-Object { $_.Name -ne 'environment' })
            $files += $setupFiles
          }
          $allowed += @('directx-setup-receipt.json','directx.stdout.log','directx.stderr.log')
          if ($files.Count -eq 0) { exit 0 }
          $total = 0
          foreach ($file in $files) {
            if ($file.PSIsContainer -or $file.Name -notin $allowed -or $file.Length -gt 1048576 -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected artifact data.' }
            $total += $file.Length
          }
          if ($files.Count -gt 192 -or $total -gt 201326592) { throw 'Artifact size/count bound.' }
          $out = Join-Path $env:RUNNER_TEMP 'harvest-artifact'
          if (Test-Path -LiteralPath $out) { throw 'Artifact staging already exists.' }
          New-Item -ItemType Directory -Path $out | Out-Null
          foreach ($file in $files) { Copy-Item -LiteralPath $file.FullName -Destination $out }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'ready=true' -Encoding utf8
      - name: Retain native scene evidence
        if: ${{ always() && steps.evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-harvest-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harvest-artifact/
          retention-days: 7
          if-no-files-found: error
  encode:
    # Trailer feasibility: stitch the retained frames into an MP4 and publish the
    # media to a separate orphan branch that cloud sessions can fetch with git.
    # Runs no BYOND or artifact code; only ffmpeg on the PNG frames.
    needs: harvest
    if: ${{ always() && github.repository == 'Civ13/Civ13' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the retained frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          name="native-harvest-harvest-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/frames"
          ls -la "$RUNNER_TEMP/frames"
      - name: Encode MP4 and GIF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          cd "$RUNNER_TEMP/frames"
          count=$(ls cadence-*.png 2>/dev/null | wc -l)
          echo "frames=$count"
          mkdir -p "$RUNNER_TEMP/media"
          cp -- *.json *.txt *.log "$RUNNER_TEMP/media/" 2>/dev/null || true
          if [ "$count" -gt 0 ]; then
            mkdir -p "$RUNNER_TEMP/media/frames"
            cp cadence-*.png "$RUNNER_TEMP/media/frames/"
            ffmpeg -hide_banner -loglevel error -framerate 20 -i cadence-%03d.png -vf "scale=iw*2:ih*2:flags=neighbor,format=yuv420p" -c:v libx264 -crf 16 -movflags +faststart "$RUNNER_TEMP/media/take.mp4"
            ffmpeg -hide_banner -loglevel error -framerate 20 -i cadence-%03d.png -vf "split[a][b];[a]palettegen[p];[b][p]paletteuse" "$RUNNER_TEMP/media/take.gif"
          fi
      - name: Publish media to an orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/media"
          git init -q -b media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Trailer test media from run ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "media:refs/heads/media/trailer-test-20261104-r1"
