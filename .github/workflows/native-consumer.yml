name: Native supervisor consumer contracts
on:
  push:
    paths:
      - scripts/nomads-lifecycle/**
      - tests/nomads_lifecycle/**
      - .github/workflows/native-consumer.yml
  pull_request:
    paths:
      - scripts/nomads-lifecycle/**
      - tests/nomads_lifecycle/**
      - .github/workflows/native-consumer.yml
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify consumer source identity
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_HEAD) { throw 'Consumer head differs from requested commit' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl
          coverage: none
      - name: Check out the reviewed disabled v2 bot adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Valgorithms/Civilizationbot
          ref: 6e6e92fa41cb28fabae3581f788ea0c119660fa0
          path: bot-protocol
          persist-credentials: false
      - name: Verify producer source identity
        shell: pwsh
        working-directory: bot-protocol
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne '6e6e92fa41cb28fabae3581f788ea0c119660fa0') { throw 'Producer head differs from reviewed pin' }
      - name: Resolve isolated bot test dependencies without scripts/plugins
        working-directory: bot-protocol
        run: composer install --no-interaction --no-plugins --no-scripts --no-dev
      - name: Verify pure supervisor contracts and actual PHP/Python spool interoperability
        shell: pwsh
        run: |
          $env:CIV13_BOT_ADAPTER_ROOT = Join-Path $env:GITHUB_WORKSPACE 'bot-protocol'
          $env:CIV13_BOT_VENDOR = Join-Path $env:CIV13_BOT_ADAPTER_ROOT 'vendor/autoload.php'
          $env:CIV13_PHP = (Get-Command php).Source
          $env:CIV13_BOT_CANONICAL_ADAPTER = '1'
          if (-not (Test-Path -LiteralPath $env:CIV13_BOT_VENDOR -PathType Leaf)) { throw 'Required producer dependencies unavailable' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:CIV13_BOT_ADAPTER_ROOT 'src/Civ13/NativeLifecycle.php') -PathType Leaf)) { throw 'Required producer adapter unavailable' }
          if (-not $env:CIV13_PHP -or -not (Test-Path -LiteralPath $env:CIV13_PHP -PathType Leaf)) { throw 'Required PHP unavailable' }
          $pythonExe = if ($IsWindows) { Join-Path $env:pythonLocation 'python.exe' } else { Join-Path $env:pythonLocation 'bin/python' }
          & $pythonExe -B -m unittest discover -s tests/nomads_lifecycle -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
