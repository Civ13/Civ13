name: Deploy Windows launcher installer
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: native-launcher-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact release tag and deployment plan
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & $python tools/opendream-client/native/release.py plan --event $env:GITHUB_EVENT_PATH --output release-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release failure and idempotence controls
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & $python -m unittest discover -s tools/opendream-client/native/tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact-tag single-file installer and verify startup
        shell: pwsh
        run: |
          $plan = Get-Content release-output/plan.json -Raw | ConvertFrom-Json
          ./tools/opendream-client/native/Build.ps1 -Dotnet (Get-Command dotnet).Source -Version $plan.version
      - name: Verify updater and actual executable replacement
        shell: pwsh
        run: |
          $plan = Get-Content release-output/plan.json -Raw | ConvertFrom-Json
          dotnet run --project tools/opendream-client/native/tests/Launcher.Tests.csproj -- tools/opendream-client/native/publish/Civ13.exe $plan.version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload immutable installer, read back assets, then activate stable feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $python = (Get-Command python).Source
          & $python tools/opendream-client/native/release.py publish --event $env:GITHUB_EVENT_PATH --output release-output --executable tools/opendream-client/native/publish/Civ13.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
