name: Prepare approved historical gameplay attachment
on:
  workflow_dispatch:
    inputs:
      attachment_url:
        description: Public GitHub attachment containing the exact approved masked PR3031 MP4
        type: string
        required: true
permissions: {}
concurrency:
  group: youtube-pr3031-import
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Civ13/Civ13' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/youtube
      - name: Validate existing approved bytes without channel credentials
        env:
          REVIEWED_MEDIA_URL: ${{ inputs.attachment_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B tools/youtube/prepare_import.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gameplay-video-pr3031-power-public
          path: ${{ runner.temp }}/youtube-import-bundle/*
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
