name: Offline native social companion
on:
  pull_request:
    branches: [master, codex/civ13-discord-presence-adapter, codex/civ13-social-native-core]
    paths:
      - tools/opendream-client/native/companion/**
      - tools/opendream-client/native/Social/**
      - tools/opendream-client/native/tests/SocialContracts/**
      - .github/workflows/social-companion.yml
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-latest
    timeout-minutes: 4
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile inactive Windows provider and run injected contracts
        shell: pwsh
        working-directory: tools/opendream-client/native/tests/SocialContracts
        run: |
          $env:DOTNET_CLI_HOME = Join-Path $env:RUNNER_TEMP 'civ13-provider-cli'
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          & $dotnet restore SocialContracts.csproj --configfile NuGet.Config -p:NuGetAudit=false --disable-parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dotnet build SocialContracts.csproj --no-restore --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dotnet ./bin/Debug/net8.0/Civ13.Launcher.SocialContracts.dll
          exit $LASTEXITCODE
  contracts:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile and run original native peer with fake backend
        shell: pwsh
        run: ./tools/opendream-client/native/companion/Build-Offline.ps1
      - name: Retain bounded offline logs without executables or vendor SDK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-companion-offline-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/opendream-client/native/companion/build/*.log
          retention-days: 7
          if-no-files-found: error
