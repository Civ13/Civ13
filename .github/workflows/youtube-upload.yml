name: Approved gameplay video upload
run-name: ${{ inputs.deferred_token && format('YouTube deferred {0}', inputs.deferred_token) || (inputs.review_hours == '8' && 'YouTube eight-hour review' || 'Reviewed YouTube upload') }}
on:
  workflow_dispatch:
    inputs:
      review_hours:
        description: Eight-hour protected review with gates OFF, followed by short attended execution arm
        type: choice
        options: ['0', '8']
        default: '0'
      manifest_id:
        description: Reviewed default-branch manifest ID in tools/youtube/approved
        type: string
        required: true
      execute_upload:
        description: Execute approved action after environment approval (false inspects only)
        type: boolean
        default: false
      verify_only:
        description: Verify a known receipt video ID only, without source media or insertion
        type: boolean
        default: false
      import_run_id:
        description: Successful current-commit historical importer run ID (otherwise empty)
        type: string
        default: ''
      approval_comment_id:
        description: Owner's exact per-clip approval comment ID (required for new historical imports)
        type: string
        default: ''
      deferred_id:
        description: Durable queue identity (scheduler only)
        type: string
        default: ''
      deferred_token:
        description: Durable single-dispatch ownership token (scheduler only)
        type: string
        default: ''
permissions: {}
jobs:
  approved-upload:
    if: github.repository == 'Civ13/Civ13' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/youtube-upload-worker.yml
    # Named forwarding is required even for secrets stored only in the
    # worker's protected environment. Do not inherit unrelated secrets.
    secrets:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CONTROL_APP_PRIVATE_KEY: ${{ secrets.YOUTUBE_CONTROL_APP_PRIVATE_KEY }}
    with:
      review_hours: ${{ inputs.review_hours || '0' }}
      manifest_id: ${{ inputs.manifest_id }}
      execute_upload: ${{ inputs.execute_upload }}
      verify_only: ${{ inputs.verify_only }}
      import_run_id: ${{ inputs.import_run_id }}
      approval_comment_id: ${{ inputs.approval_comment_id }}
      deferred_id: ${{ inputs.deferred_id }}
      deferred_token: ${{ inputs.deferred_token }}
