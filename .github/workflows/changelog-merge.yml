name: Discord PR changelog
# Runs on the push a PR merge makes to master. pull_request_target is blocked
# by default on public repositories from 2026-12-02 and is not needed here.
on:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: discord-changelog
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.repository == 'Civ13/Civ13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: discord-changelog
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Master's own pushed commit; never a PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Publish explicit PR changelog line
        run: node tools/changelog/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_CHANGELOG_ENABLED: ${{ vars.DISCORD_MERGE_CHANGELOG_ENABLED }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
