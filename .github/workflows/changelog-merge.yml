name: Discord PR changelog
on:
  pull_request_target:
    types: [closed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: discord-changelog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Civ13/Civ13' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: discord-changelog
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Never check out or execute the PR head with this token/webhook.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Publish explicit PR changelog line
        run: node tools/changelog/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_CHANGELOG_ENABLED: ${{ vars.DISCORD_MERGE_CHANGELOG_ENABLED }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
