name: Trusted approved gameplay uploader
on:
  workflow_call:
    secrets:
      YOUTUBE_CLIENT_ID:
        required: true
      YOUTUBE_CLIENT_SECRET:
        required: true
      YOUTUBE_REFRESH_TOKEN:
        required: true
      YOUTUBE_CONTROL_APP_PRIVATE_KEY:
        required: false
    inputs:
      review_hours:
        type: string
        default: '0'
      manifest_id:
        required: true
        type: string
      execute_upload:
        type: boolean
        default: false
      verify_only:
        type: boolean
        default: false
      import_run_id:
        type: string
        default: ''
      approval_comment_id:
        type: string
        default: ''
      deferred_id:
        type: string
        default: ''
      deferred_token:
        type: string
        default: ''
permissions: {}
# One destination-wide lock, including different manifests and reruns.
concurrency:
  group: youtube-unlisted-valzartech8995
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'Civ13/Civ13' &&
      github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'Civ13/Civ13/.github/workflows/youtube-upload.yml@refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/youtube
      - name: Inspect approved provenance and media without channel secrets
        env:
          REVIEW_HOURS: ${{ inputs.review_hours }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          DEFERRED_ID: ${{ inputs.deferred_id }}
          DEFERRED_TOKEN: ${{ inputs.deferred_token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B tools/youtube/upload.py inspect
  upload:
    needs: inspect
    if: >-
      inputs.execute_upload && (inputs.review_hours == '8' ||
      (vars.YOUTUBE_UPLOAD_ENABLED == 'true' && vars.YOUTUBE_UPLOAD_STOP_USE == 'false' &&
      vars.YOUTUBE_ZERO_COST_CONFIRMED == 'true'))
    environment: youtube-unlisted
    runs-on: ubuntu-24.04
    # Review handoff120 seconds + three240-second adapter calls + setup margin.
    # The short execution arm remains <=900s; legacy budget stays unchanged.
    timeout-minutes: ${{ inputs.review_hours == '8' && 18 || 8 }}
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/youtube
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          php-version: '8.4'
          tools: composer:2.9.8
          coverage: none
      - name: Install trusted locked YoutubePHP dependencies without scripts or plugins
        run: composer install --working-dir=tools/youtube --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress
      # This job starts only after the existing human environment approval.
      # The key is bound only to this pinned action, never to Python or PHP.
      # No permission-* inputs: v3.3.0 lacks permission-variables (upstream #231).
      - name: Mint short-lived control-read token after environment review
        id: control-token
        if: inputs.review_hours == '8' || vars.YOUTUBE_DEFERRED_ENABLED == 'true' || inputs.deferred_id != '' || inputs.deferred_token != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0, node24
        with:
          app-id: ${{ vars.YOUTUBE_CONTROL_APP_ID }}
          private-key: ${{ secrets.YOUTUBE_CONTROL_APP_PRIVATE_KEY }}
          owner: Civ13
          repositories: Civ13
          skip-token-revoke: false
      - name: Admit reviewed request with controls closed
        id: review-admit
        if: inputs.review_hours == '8'
        env:
          REVIEW_OPERATION: admit
          REVIEW_HOURS: ${{ inputs.review_hours }}
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_CONTROL_TOKEN: ${{ steps.control-token.outputs.token }}
        run: /usr/bin/python3 -B tools/youtube/review_wait.py
      - name: Await a fresh short operator arm after successful admission
        id: review-arm
        if: inputs.review_hours == '8'
        env:
          REVIEW_HOURS: ${{ inputs.review_hours }}
          REVIEW_STARTED_AT: ${{ steps.review-admit.outputs.review_started_at }}
          REVIEW_DEADLINE: ${{ steps.review-admit.outputs.review_deadline }}
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_CONTROL_TOKEN: ${{ steps.control-token.outputs.token }}
        run: /usr/bin/python3 -B tools/youtube/review_wait.py
      # No PR checkout/scripts, decoder or input interpolation. The sole action
      # cleanup after upload is revocation of the short-lived control-read token.
      # Setup/install steps above have NO YouTube credentials in their environment.
      - name: Reserve, upload public, and verify destination and processing
        env:
          REVIEW_HOURS: ${{ inputs.review_hours }}
          REVIEW_STARTED_AT: ${{ steps.review-arm.outputs.review_started_at }}
          REVIEW_DEADLINE: ${{ steps.review-arm.outputs.review_deadline }}
          REVIEW_EXECUTION_UNTIL: ${{ steps.review-arm.outputs.execution_until }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          DEFERRED_ID: ${{ inputs.deferred_id }}
          DEFERRED_TOKEN: ${{ inputs.deferred_token }}
          YOUTUBE_DEFERRED_ENABLED: ${{ vars.YOUTUBE_DEFERRED_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_CONTROL_TOKEN: ${{ steps.control-token.outputs.token }}
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_UPLOAD_STOP_USE: ${{ vars.YOUTUBE_UPLOAD_STOP_USE }}
          YOUTUBE_ZERO_COST_CONFIRMED: ${{ vars.YOUTUBE_ZERO_COST_CONFIRMED }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: /usr/bin/python3 -B tools/youtube/upload.py upload
