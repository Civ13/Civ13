name: CI change selection
on:
  workflow_call:
    inputs:
      extensive:
        type: boolean
        default: false
      base:
        type: string
        default: ''
      build_prefix:
        description: Preserve CI subscriptions while allowing build-colon requests on other branches
        type: boolean
        default: false
    outputs:
      extensive:
        value: ${{ jobs.changes.outputs.extensive }}
      new_tests:
        value: ${{ jobs.changes.outputs.new_tests }}
      game:
        value: ${{ jobs.changes.outputs.game }}
      gating:
        value: ${{ jobs.changes.outputs.gating }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extensive: ${{ steps.select.outputs.extensive }}
      game: ${{ steps.select.outputs.game }}
      new_tests: ${{ steps.select.outputs.new_tests }}
      gating: ${{ steps.select.outputs.gating }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Selection regression tests on every invocation
        run: python3 -B scripts/ci_baseline.py unit --suite policy --output .ci/selection/policy.json
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXTENSIVE: ${{ inputs.extensive }}
          BUILD_PREFIX: ${{ inputs.build_prefix }}
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/select-ci.py --base "$BASE_REF" --head "$HEAD_REF" --output "$GITHUB_OUTPUT" --event "$EVENT_NAME" --extensive "$EXTENSIVE" --build-prefix "$BUILD_PREFIX" --receipt .ci/selection/selection.json
      - name: Validate all workflow syntax
        run: |
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 0 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # Released actionlint 1.7.12 predates GitHub's concurrency.queue option.
          # Validate that exact setting separately; retain every other lint rule.
          node tools/changelog/check-queues.mjs
          "$RUNNER_TEMP/actionlint" -shellcheck= -ignore 'unexpected key "queue" for "concurrency" section' .github/workflows/*.yml
      - name: Retain selection and policy receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-selection-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci/selection/
          retention-days: 7
          if-no-files-found: error
