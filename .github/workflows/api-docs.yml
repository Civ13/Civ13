name: API documentation
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure source-link metadata
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git switch -C api-docs-build
          git config branch.api-docs-build.remote origin
          git config branch.api-docs-build.merge refs/heads/master
      - name: Generate and validate
        run: python scripts/build-api-docs.py
      - name: Upload reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: civ13-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: dmdoc/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-docs-diagnostics
          path: .cache/api-docs/generation.log
          if-no-files-found: ignore
