name: Native Windows launcher
on:
  pull_request:
    branches: [master]
    paths:
      - tools/opendream-client/native/**
      - tools/byond/version.json
      - tools/opendream-client/channel.json
      - .github/workflows/native-launcher.yml
      - .github/workflows/native-launcher-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Simulated release metadata, failure and idempotence controls
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & $python -m unittest discover -s tools/opendream-client/native/tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained executable and check startup
        shell: pwsh
        run: ./tools/opendream-client/native/Build.ps1 -Dotnet (Get-Command dotnet).Source -Python (Get-Command python).Source
      - name: Isolated updater contracts and actual executable replacement
        shell: pwsh
        run: |
          $version = (Get-Content tools/opendream-client/native/version.json -Raw | ConvertFrom-Json).version
          dotnet run --project tools/opendream-client/native/tests/Launcher.Tests.csproj -- tools/opendream-client/native/publish/Civ13.exe $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Civ13-Windows-launcher-${{ github.event.pull_request.head.sha || github.sha }}
          path: tools/opendream-client/native/publish/Civ13.exe
          if-no-files-found: error
      - name: Run offline social contracts with isolated SDK state
        id: social_contracts
        timeout-minutes: 4
        working-directory: tools/opendream-client/native/tests/SocialContracts
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOCIAL_EVIDENCE: ${{ runner.temp }}/civ13-social-contracts
          DOTNET_CLI_HOME: ${{ runner.temp }}/civ13-social-cli
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $output = $env:SOCIAL_EVIDENCE
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $receiptPath = Join-Path $output 'receipt.json'
          $receipt = [ordered]@{
            schema = 1; kind = 'offline_social_contracts'; status = 'running'
            expected_head = $env:EXPECTED_HEAD; head = $null
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            assertions = 0; tracked_clean_before = $false; tracked_clean_after = $false
            restore_exit = $null; build_exit = $null; fixture_exit = $null
            scope = 'Injected social/discovery/clock/command contracts; no live SDK, DNS, Topic, BYOND or launcher Main'
            log_sha256 = @{}; error = $null
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $receiptPath
          'started=true' >> $env:GITHUB_OUTPUT
          try {
            $receipt.head = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $receipt.head -cne $env:EXPECTED_HEAD) { throw 'Social contracts source HEAD mismatch' }
            & git diff --quiet HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Social contracts require clean tracked source' }
            $receipt.tracked_clean_before = $true
            $dotnetExe = (Get-Command dotnet -ErrorAction Stop).Source
            & $dotnetExe restore SocialContracts.csproj --configfile NuGet.Config -p:NuGetAudit=false --disable-parallel 2>&1 | Tee-Object (Join-Path $output 'restore.log')
            $receipt.restore_exit = $LASTEXITCODE
            if ($receipt.restore_exit -ne 0) { throw 'Offline social restore failed' }
            & $dotnetExe build SocialContracts.csproj --no-restore --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false 2>&1 | Tee-Object (Join-Path $output 'build.log')
            $receipt.build_exit = $LASTEXITCODE
            if ($receipt.build_exit -ne 0) { throw 'Offline social build failed' }
            & $dotnetExe ./bin/Debug/net8.0/Civ13.Launcher.SocialContracts.dll 2>&1 | Tee-Object (Join-Path $output 'fixture.log')
            $receipt.fixture_exit = $LASTEXITCODE
            if ($receipt.fixture_exit -ne 0) { throw 'Offline social contracts failed' }
            $summaries = @(Get-Content (Join-Path $output 'fixture.log') | Where-Object { $_ -cmatch '^PASS ([1-9][0-9]*) offline assertions; no processes, sockets or SDK calls[.]$' })
            if ($summaries.Count -ne 1) { throw 'Missing, duplicate or empty social assertion count' }
            $receipt.assertions = [int]([regex]::Match($summaries[0], '^PASS ([1-9][0-9]*) ').Groups[1].Value)
            & git diff --quiet HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Social contracts changed tracked source' }
            $receipt.tracked_clean_after = $true
            $receipt.status = 'passed'
          } catch {
            $receipt.status = 'failed'
            $receipt.error = $_.Exception.Message
            throw
          } finally {
            foreach ($name in @('restore.log', 'build.log', 'fixture.log')) {
              $path = Join-Path $output $name
              if (Test-Path -LiteralPath $path) { $receipt.log_sha256[$name] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $receiptPath
          }
      - name: Retain offline social contract counts and logs
        if: always() && steps.social_contracts.outputs.started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-contracts-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/civ13-social-contracts/
          retention-days: 7
          if-no-files-found: error
