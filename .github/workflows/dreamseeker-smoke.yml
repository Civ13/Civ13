name: Isolated DreamSeeker feasibility
on:
  workflow_dispatch:
    inputs:
      run_native:
        description: Separately authorized hosted native attempt only; not execution authority
        type: boolean
        default: false
      selected_sha:
        description: Exact reviewed dispatch SHA; must equal github.sha, not execution authority
        type: string
        default: ''
  pull_request:
    paths:
      - tests/dreamseeker_smoke/**
      - .github/workflows/dreamseeker-smoke.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pixel inspection dependency
        run: python -m pip install Pillow==11.3.0
      - name: Offline containment, pixel and full-PR selection controls
        run: python -m unittest discover -s tests/dreamseeker_smoke -p "test_*.py" -v
  guest-renderer:
    # This selector is not authorization. Historical vendor failures stay failed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native == true && inputs.selected_sha == github.sha }}
    needs: offline-contracts
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pixel inspection dependency
        run: python -m pip install Pillow==11.3.0
      - name: Offline containment and pixel controls
        run: python -m unittest discover -s tests/dreamseeker_smoke -p "test_*.py" -v
      - name: Official guest client on bounded loopback fixture
        shell: pwsh
        run: |
          python tests/dreamseeker_smoke/run.py --output "$env:RUNNER_TEMP/dreamseeker-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dreamseeker-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/dreamseeker-evidence/
          if-no-files-found: warn
          retention-days: 7
