name: Isolated DreamSeeker feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/dreamseeker_smoke/**
      - .github/workflows/dreamseeker-smoke.yml
permissions:
  contents: read
jobs:
  guest-renderer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pixel inspection dependency
        run: python -m pip install Pillow==11.3.0
      - name: Offline containment and pixel controls
        run: python -m unittest discover -s tests/dreamseeker_smoke -p "test_*.py" -v
      - name: Official guest client on bounded loopback fixture
        shell: pwsh
        run: |
          python tests/dreamseeker_smoke/run.py --output "$env:RUNNER_TEMP/dreamseeker-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dreamseeker-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/dreamseeker-evidence/
          if-no-files-found: warn
          retention-days: 7
