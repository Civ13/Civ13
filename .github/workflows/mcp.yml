name: MCP protocol checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mcp: ${{ steps.select.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare comparison
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -B scripts/ci_checkout_refs.py --head "$HEAD_REF" --base "$BASE_REF" --event "$EVENT_NAME"
      - id: select
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -B scripts/select-ci.py --mcp-only --base "$BASE_REF" --head "$HEAD_REF" --event "$EVENT_NAME" --output "$GITHUB_OUTPUT"
  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "if (require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== process.env.HEAD_REF) process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix tools/mcp
      - run: npm test --prefix tools/mcp
      - name: Offline runtime reader and phase contracts
        run: node -e "const p=require('node:path'); const c=require('node:child_process'); const e=process.platform==='win32'?p.join(process.env.pythonLocation,'python.exe'):p.join(process.env.pythonLocation,'bin','python3'); for(const f of ['test_agent_debug.py','test_mcp_runtime_bridge.py','test_recovery_phases.py']) c.execFileSync(e,['-B','-m','unittest','discover','-s','tests/nomads_lifecycle','-p',f],{stdio:'inherit'});"
