name: Sprite review
on:
  pull_request:
    branches: [master]
    paths:
      - '**.dmi'
      - 'scripts/sprite_review.py'
      - '.github/workflows/sprite-review.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Revision to compare with (default origin/master)'
        required: false
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Pinned byond-devtools (icon-diff); bump the ref to take a newer renderer.
      - uses: actions/checkout@v4
        with:
          repository: Civ13/byond-devtools
          ref: 8feda512c6a07f35123a0bd89acc13f0c9e9bc3d
          path: .byond-devtools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare changed sprites state by state
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/master' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/sprite_review.py --base "$BASE_REF" --head "$HEAD_REF" --devtools .byond-devtools --out sprite-review --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-review
          path: sprite-review
          if-no-files-found: ignore
          retention-days: 14
