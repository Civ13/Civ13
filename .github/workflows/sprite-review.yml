name: Sprite review
on:
  pull_request:
    branches: [master]
    paths:
      - '**.dmi'
      - 'scripts/sprite_review.py'
      - 'tests/map_review/**'
      - '.github/workflows/sprite-review.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Revision to compare with (default origin/master)'
        required: false
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Pinned byond-devtools (icon-diff); bump the ref to take a newer renderer.
      - uses: actions/checkout@v4
        with:
          repository: Civ13/byond-devtools
          ref: 0ed557447129495150cd50c8003da718598f4c70
          path: .byond-devtools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Map pictures and lint skip here (no BYOND_BIN); the map-review workflow runs them.
      - name: Review fixture tests
        run: BYOND_DEVTOOLS="$PWD/.byond-devtools" python3 -B -m unittest tests/map_review/devtools_review.py -v
      - name: Compare changed sprites state by state
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/master' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/sprite_review.py --base "$BASE_REF" --head "$HEAD_REF" --devtools .byond-devtools --out sprite-review --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-review
          path: sprite-review
          if-no-files-found: ignore
          retention-days: 14
