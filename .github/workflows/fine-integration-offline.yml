name: Temporary fine-offset integration offline evidence
on:
  workflow_call:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fine-offset source contracts only
        timeout-minutes: 2
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          mkdir -p .ci/fine-integration
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD 'HEAD^{tree}' > .ci/fine-integration/commit-tree.txt
          git diff --binary HEAD > .ci/fine-integration/source-before.patch
          python3 -B tests/human_subtile/test_fine_offset.py 2>&1 | tee .ci/fine-integration/offline.log
          git diff --binary HEAD > .ci/fine-integration/source-after.patch
          test ! -s .ci/fine-integration/source-after.patch
          printf '%s\n' 'Native runtime, real-client Alt/repeat/focus, combined save/load and FPS: NOT RUN' > .ci/fine-integration/limits.txt
      - name: Retain focused integration evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fine-integration-${{ inputs.expected_head }}-${{ github.run_id }}
          path: .ci/fine-integration/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
