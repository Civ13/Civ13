name: Component tool regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BYOND_ARCHIVE_SOURCE: repository-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile full game with pinned BYOND
        run: bash scripts/travis_pre_byond.sh
      - name: Run bounded component tool regressions
        shell: bash
        run: |
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" MANPATH="${MANPATH:-}"
          source BYOND/byond/bin/byondsetup
          args=(--byond-bin "$PWD/BYOND/byond/bin" --byond-archive "$PWD/BYOND/pinned.zip")
          /usr/bin/python3 scripts/check-component-tools.py "${args[@]}" --output "$RUNNER_TEMP/component-tools/positive"
          /usr/bin/python3 scripts/check-component-tools.py "${args[@]}" --output "$RUNNER_TEMP/component-tools/consumption" --negative-control consumption
          /usr/bin/python3 scripts/check-component-tools.py "${args[@]}" --output "$RUNNER_TEMP/component-tools/runtime-save" --negative-control runtime-save
      - name: Retain manual fixture identity and failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-tools-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/compile/
            ${{ runner.temp }}/component-tools/
            !${{ runner.temp }}/component-tools/**/*.dmb
            !${{ runner.temp }}/component-tools/**/*.rsc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
