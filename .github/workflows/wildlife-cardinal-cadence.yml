name: Inactive cardinal wildlife cadence registration
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full reviewed fixture commit SHA
        required: true
        type: string
permissions: {}
jobs:
  inactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse default-branch execution
        run: |
          echo 'Inactive registration only. Select the separately reviewed experimental ref for an authorized fixture run.'
          exit 1
