<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        /* Civilization 13 Modern Chat Styling */
        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-BoldItalic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        @font-face {
            font-family: 'Wizard';
            src: url('Wizard.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .wizard {
            font-family: "Wizard", "Civ13Custom", serif;
        }

        body {
            background-color: #392611;
            color: #e1e1d7;
            font-family: 'Civ13Custom', "Book Antiqua", "Bookman Old Style", serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 14px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }

        #chat-container {
            height: calc(100% - 22px);
            padding: 8px;
            box-sizing: border-box;
            overflow-y: scroll;
            scrollbar-face-color: #a68b7d;
            scrollbar-shadow-color: #271a0c;
            scrollbar-highlight-color: #e1e1d7;
            scrollbar-3dlight-color: #a68b7d;
            scrollbar-darkshadow-color: #000000;
            scrollbar-track-color: #392611;
            scrollbar-arrow-color: #271a0c;
        }

        /* Modern scrollbar for Chromium-based BYOND */
        #chat-container::-webkit-scrollbar {
            width: 12px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: #392611;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: #a68b7d;
            border: 2px solid #392611;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #bda294;
        }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-wrap: break-word;
        }

        .message {
            line-height: 1.3;
            opacity: 0;
            animation: fadeIn 0.2s forwards ease-out;
            white-space: pre-wrap;
        }

        .message.html-content {
            white-space: normal;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Standard SS13 styles fallback */

        .admin {
            color: #9b59b6;
            font-weight: bold;
        }

        .ooc {
            color: #3498db;
            font-weight: bold;
        }

        a {
            color: #a68b7d;
            text-decoration: underline;
        }

        a:hover {
            color: #e1e1d7;
        }

        .prefix {
            font-weight: bold;
        }

        .log_message {
            color: #A9B6E7;
            font-weight: bold;
        }

        .small_message {
            color: #E1E1FF;
            font-weight: bold;
            font-size: 0.66em;
        }

        a,
        a:link,
        a:visited,
        a:active,
        a:hover {
            color: #CD4C6C;
        }

        /* OOC */
        .ooc {
            font-weight: bold;
        }

        .ooc img.text_tag {
            width: 32px;
            height: 10px;
        }

        .ooc .everyone {
            color: #1E8CBE;
        }

        .ooc .looc {
            color: #75B5B5;
        }

        .ooc .elevated {
            color: #2e78d9;
        }

        .ooc .mentor {
            color: #2e78d9;
        }

        .ooc .moderator {
            color: #2ed9ab;
        }

        .ooc .developer {
            color: #a649bf;
        }

        .ooc .admin {
            color: #39ac41;
        }

        .ooc .highstaff {
            color: #b82e00;
        }

        /* Admin: Private Messages */
        .pm .howto {
            color: #ff0000;
            font-weight: bold;
            font-size: 200%;
        }

        .pm .in {
            color: #ff0000;
        }

        .pm .out {
            color: #ff0000;
        }

        .pm .other {
            color: #1E8CBE;
        }

        /* Admin: Channels */
        .mod_channel {
            color: #735638;
            font-weight: bold;
        }

        .mod_channel .admin {
            color: #b82e00;
            font-weight: bold;
        }

        .admin_channel {
            color: #9611D4;
            font-weight: bold;
        }

        /* Radio: Misc */
        .deadsay {
            color: #8657C5;
        }

        .radio {
            color: #4CA64C;
        }

        /* Radio Channels */
        .blueradio {
            color: #6A80A9;
        }

        .SSradio {
            color: #466194;
        }

        .redradio {
            color: #B53232;
        }

        .brownradio {
            color: #7E6A46;
        }

        /* Miscellaneous */
        .name {
            font-weight: bold;
        }

        .alert {
            color: #ff0000;
        }

        h1.alert,
        h2.alert {
            color: #ff0000;
        }

        .ghostalert {
            color: #5c00e6;
            font-style: italic;
            font-weight: bold;
        }

        .emote {
            font-style: italic;
        }

        /* Game Messages */

        .attack {
            color: #ff0000;
        }

        .moderate {
            color: #CC0000;
        }

        .disarm {
            color: #990000;
        }

        .passive {
            color: #660000;
        }

        .red {
            color: #ff3737
        }

        .green {
            color: #289120
        }

        .green_bold {
            color: #289120;
            font-weight: bold;
        }

        @keyframes danger-blink {

            0%,
            100% {
                color: #b30000;
            }

            50% {
                color: #ff3737;
            }
        }

        .danger {
            font-weight: bold;
            animation: danger-blink 1s infinite;
        }

        .userdanger {
            font-weight: bold;
            font-size: 2.0em;
            animation: danger-blink 1s infinite;
        }

        .userdanger_yellow {
            color: #ffff00;
            font-weight: bold;
            font-size: 2.5em;
        }

        .hugedanger {
            font-weight: bold;
            font-size: 3.0em;
            animation: danger-blink 1s infinite;
        }

        .warning {
            color: #ff3737;
            font-style: italic;
        }

        .rose {
            color: #ff5050;
        }

        .notice {
            color: #89a2d8;
        }

        .ping {
            color: #E1E1FF;
            font-weight: bold;
        }

        .reflex_shoot {
            color: #000099;
            font-style: italic;
        }

        /* Languages */

        .rough {
            font-family: "Trebuchet MS", cursive, sans-serif;
        }

        .say_quote {
            font-family: Georgia, Verdana, sans-serif;
        }

        .interface {
            color: #704C70;
        }

        .good {
            color: #839E69;
            font-weight: bold;
        }

        .bad {
            color: #ff3737;
            font-weight: bold;
        }

        /* Chat Tags */
        .text_tag {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 4px;
            vertical-align: middle;
            font-family: Arial, sans-serif;
            line-height: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tag-ooc {
            background-color: #1a56f0;
            color: white;
            border-color: #0d41bc;
        }

        .tag-looc {
            background-color: #36b6a6;
            color: white;
            border-color: #2a8d81;
        }

        .tag-dead,
        .tag-lobby {
            background-color: #6326c0;
            color: white;
            border-color: #4a1d8f;
        }

        .tag-asay,
        .tag-admin,
        .tag-a-discord {
            background-color: #a123f0;
            color: white;
            border-color: #7b1ab8;
        }

        .tag-mentor {
            background-color: #3986f0;
            color: white;
            border-color: #2b65b6;
        }

        .tag-pm_in {
            background-color: #f01a1a;
            color: white;
            border-color: #b81414;
        }

        .tag-pm_out_alt {
            background-color: #b04343;
            color: white;
            border-color: #8a3434;
        }

        .tag-pm_other {
            background-color: #5092c0;
            color: white;
            border-color: #3d6f92;
        }

        .tag-help {
            background-color: #ff0000;
            color: white;
            border-color: #cc0000;
        }

        .tag-discord,
        .tag-discord2 {
            background-color: #00b0f0;
            color: white;
            border-color: #0089bc;
        }

        .tag-ping {
            background-color: #f1c40f;
            color: #2c3e50;
            border-color: #f39c12;
            font-size: 9px;
        }

        .motd {
            color: #E1E1FF;
            font-family: "Civ13Custom", "Book Antiqua", Verdana, sans-serif;
        }

        .motd h1,
        .motd h2,
        .motd h3,
        .motd h4,
        .motd h5,
        .motd h6 {
            margin-top: 0.2em;
            margin-bottom: 0.2em;
            color: #E1E1FF;
        }

        .motd a,
        .motd a:link,
        .motd a:visited,
        .motd a:active,
        .motd a:hover {
            color: #CD4C6C;
        }

        /* Chat filter tabs */
        #chat-tabs {
            display: flex;
            align-items: stretch;
            height: 22px;
            box-sizing: border-box;
            background-color: #271a0c;
            border-bottom: 1px solid #a68b7d;
            font-family: Arial, sans-serif;
            font-size: 11px;
            user-select: none;
        }

        #chat-tab-list {
            display: flex;
            flex: 1 1 auto;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        #chat-tab-list::-webkit-scrollbar {
            display: none;
        }

        .chat-tab,
        #chat-tab-settings {
            flex: 0 0 auto;
            padding: 0 8px;
            border: 0;
            border-right: 1px solid #392611;
            background: transparent;
            color: #a68b7d;
            font: inherit;
            line-height: 21px;
            cursor: pointer;
            white-space: nowrap;
        }

        .chat-tab:hover,
        #chat-tab-settings:hover {
            color: #e1e1d7;
        }

        .chat-tab.active {
            background-color: #392611;
            color: #e1e1d7;
            font-weight: bold;
        }

        .chat-tab .unread {
            display: inline-block;
            margin-left: 4px;
            padding: 0 4px;
            border-radius: 6px;
            background-color: #CD4C6C;
            color: #ffffff;
            font-size: 9px;
            line-height: 12px;
        }

        #chat-tab-settings {
            border-left: 1px solid #392611;
            border-right: 0;
        }

        .message.filtered {
            display: none;
        }

        /* Connection notices show on every tab. */
        .message.connection-notice.filtered {
            display: block;
        }

        /* Lines restored from the last connection; their game links point
           at the old world, so they are plain text. */
        .message.restored {
            opacity: 0.85;
        }

        .stale-link {
            text-decoration: none;
            cursor: default;
        }

        /* x2, x3 counter on a line that repeated (see receiveMessage). */
        .chat-repeat {
            display: inline-block;
            margin-left: 5px;
            padding: 0 5px;
            border-radius: 7px;
            background-color: #CD4C6C;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            font-style: normal;
            line-height: 14px;
            vertical-align: 1px;
        }

        .chat-repeat.bump {
            animation: chat-repeat-bump 0.25s ease-out;
        }

        @keyframes chat-repeat-bump {
            from { transform: scale(1.35); }
            to { transform: scale(1); }
        }

        .chat-history-divider {
            border-bottom: 1px solid #392611;
            font-style: italic;
            margin-bottom: 2px;
        }

        .connection-lost {
            color: #ff3737;
            font-weight: bold;
        }

        .connection-restored {
            color: #5fd35f;
            font-weight: bold;
        }

        #chat-settings {
            display: none;
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            overflow-y: auto;
            padding: 8px;
            box-sizing: border-box;
            background-color: #271a0c;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        #chat-settings.open {
            display: block;
        }

        #chat-settings h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
        }

        #chat-settings .hint {
            margin: 0 0 8px 0;
            color: #a68b7d;
        }

        .tab-config {
            margin-bottom: 8px;
            padding: 6px;
            border: 1px solid #392611;
            background-color: #392611;
        }

        .tab-config input[type="text"] {
            width: 140px;
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
        }

        .tab-config label {
            display: inline-block;
            margin: 4px 10px 0 0;
            white-space: nowrap;
        }

        .chat-translation {
            display: block;
            margin: 1px 0 2px 12px;
            padding-left: 6px;
            border-left: 2px solid #7fb48f;
            color: #b9dcc3;
        }

        .chat-translation .chat-translation-label {
            color: #7fb48f;
            font-size: 0.85em;
            margin-right: 4px;
        }

        .chat-translate-setup {
            display: block;
            margin: 1px 0 2px 12px;
            color: #a68b7d;
            font-size: 0.9em;
        }

        .chat-translate-setup button {
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
            padding: 0 6px;
            cursor: pointer;
        }

        .translate-config {
            margin-bottom: 8px;
            padding: 6px;
            border: 1px solid #392611;
            background-color: #392611;
        }

        .translate-config label {
            display: block;
            margin: 2px 0;
        }

        .translate-config select {
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
        }

        #chat-settings button {
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
            padding: 1px 8px;
            margin: 0 4px 0 0;
            cursor: pointer;
        }
    </style>
    <title>Civilization 13 Chat</title>
</head>

<body style="background-color: #392611; color: #e1e1d7;">
    <div id="chat-tabs">
        <div id="chat-tab-list"></div>
        <button id="chat-tab-settings" type="button" title="Choose which kinds of chat each tab shows, and turn chat translation on or off">Tabs...</button>
    </div>
    <div id="chat-settings">
        <h3>Chat tabs</h3>
        <p class="hint">Pick the kinds of chat each tab shows. Changes save on this computer.</p>
        <div id="chat-settings-list"></div>
        <button id="chat-tab-add" type="button">Add tab</button>
        <button id="chat-tab-reset" type="button">Reset to default</button>
        <h3>Translation</h3>
        <div class="translate-config">
            <label><input id="chat-translate-on" type="checkbox"> Translate chat into my language</label>
            <label>My language <select id="chat-translate-lang"></select></label>
            <p class="hint" id="chat-translate-status"></p>
            <button id="chat-translate-setup" type="button" hidden>Set up language detection</button>
        </div>
        <button id="chat-settings-close" type="button">Done</button>
    </div>
    <div id="chat-container">
        <div id="messages"></div>
    </div>
    <script src="purify.min.js"></script>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const messagesContainer = document.getElementById('messages');

        // Follow new output only while the reader is at the end. Keep this
        // state across layout changes, which can increase scrollHeight before
        // a resize or image-load callback has a chance to restore the tail.
        let followingTail = true;
        let programmaticScrollTop = null;

        function scrollToTail() {
            if (!followingTail) return;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            programmaticScrollTop = chatContainer.scrollTop;
        }

        chatContainer.addEventListener('scroll', function () {
            if (programmaticScrollTop !== null &&
                Math.abs(chatContainer.scrollTop - programmaticScrollTop) < 1) {
                programmaticScrollTop = null;
                return;
            }
            programmaticScrollTop = null;
            followingTail = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop <= 2;
        });

        // Record upward wheel intent before a pending layout callback can run.
        chatContainer.addEventListener('wheel', function (event) {
            if (event.deltaY < 0 && chatContainer.scrollTop > 0) {
                followingTail = false;
                programmaticScrollTop = null;
            }
        });

        // ResizeObserver sees wrapping, late images and font metric changes.
        // Event fallbacks also cover browsers without ResizeObserver.
        if (typeof ResizeObserver !== 'undefined') {
            const tailResizeObserver = new ResizeObserver(scrollToTail);
            tailResizeObserver.observe(messagesContainer);
            tailResizeObserver.observe(chatContainer);
        }
        messagesContainer.addEventListener('load', scrollToTail, true);
        messagesContainer.addEventListener('animationend', scrollToTail, true);
        window.addEventListener('resize', scrollToTail);
        if (document.fonts) {
            if (document.fonts.addEventListener) {
                document.fonts.addEventListener('loadingdone', scrollToTail);
            }
            if (document.fonts.ready && document.fonts.ready.then) {
                document.fonts.ready.then(scrollToTail);
            }
        }


        // Chat filter tabs. Each message gets one type: the first
        // chattype-<kind> class the server added, else a type read from the
        // classes on its leading elements, else "other". Tabs show a set of
        // types and are saved in BYOND hub storage (516+) or localStorage.
        const CHAT_TYPES = [
            ['ic', 'IC speech and emotes'],
            ['radio', 'Radio, phones and voicepipes'],
            ['ooc', 'OOC, LOOC and lobby'],
            ['dead', 'Dead chat'],
            ['pm', 'Admin PMs'],
            ['admin', 'Admin messages and logs'],
            ['prayer', 'Prayers and answers from the gods'],
            ['warning', 'Warnings and combat'],
            ['other', 'Other game messages']
        ];
        const KNOWN_TYPES = CHAT_TYPES.map(function (t) { return t[0]; });
        const TYPE_RULES = [
            ['pm', '.pm, .tag-pm_in, .tag-pm_out_alt, .tag-pm_other'],
            ['admin', '.log_message, .admin_channel, .mod_channel, .tag-asay, .tag-admin, .tag-a-discord, .tag-help, .tag-mentor'],
            ['ooc', '.ooc, .looc, .tag-ooc, .tag-looc, .tag-lobby, .tag-discord, .tag-discord2'],
            ['dead', '.deadsay, .tag-dead, .ghostalert'],
            ['radio', '.radio, .blueradio, .SSradio, .redradio, .brownradio'],
            ['ic', '.say, .game_say, .emote'],
            ['warning', '.danger, .userdanger, .userdanger_yellow, .hugedanger, .warning, .alert, .attack, .bad']
        ];
        const DEFAULT_TABS = [
            { name: 'All', types: KNOWN_TYPES.slice() },
            { name: 'IC', types: ['ic', 'radio'] },
            { name: 'Radio', types: ['radio'] },
            { name: 'OOC', types: ['ooc', 'pm'] },
            { name: 'Dead', types: ['dead'] },
            { name: 'Admin', types: ['admin', 'pm'], auto: 'admin' },
            { name: 'Prayer', types: ['prayer'], auto: 'prayer' }
        ];
        const TAB_STORAGE_KEY = 'civ13-chat-tabs-v1';
        // Types added after players had saved their own tabs. Each is offered
        // once to saved settings: the tab that already showed every older type
        // (normally All) gains it, and its default tab is appended, so the
        // new messages never vanish and a removed tab stays removed.
        const ADDED_TYPES = ['prayer'];
        const ADDED_TYPES_KEY = 'civ13-chat-tabs-added-v1';
        const MAX_MESSAGES_PER_TYPE = 250;

        function chatStorage() {
            try {
                if (window.hubStorage && typeof window.hubStorage.getItem === 'function') return window.hubStorage;
            } catch (e) { }
            try {
                if (window.localStorage) return window.localStorage;
            } catch (e) { }
            return null;
        }

        // A tab with auto set to a type stays hidden until that type arrives,
        // so players do not see an empty Admin tab.
        function autoType(value) {
            return KNOWN_TYPES.indexOf(value) !== -1 ? value : '';
        }

        function cloneTabs(list) {
            return list.map(function (tab) {
                return { name: tab.name, types: tab.types.slice(), auto: autoType(tab.auto) };
            });
        }

        function loadTabs() {
            try {
                const store = chatStorage();
                const raw = store && store.getItem(TAB_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length) {
                        const clean = [];
                        parsed.forEach(function (tab) {
                            if (!tab || typeof tab.name !== 'string' || !Array.isArray(tab.types)) return;
                            clean.push({
                                name: tab.name.substring(0, 24) || 'Tab',
                                types: tab.types.filter(function (t) { return KNOWN_TYPES.indexOf(t) !== -1; }),
                                auto: autoType(tab.auto)
                            });
                        });
                        if (clean.length) return offerAddedTypes(clean, store);
                    }
                }
            } catch (e) {
                console.warn('Chat: could not load tab settings', e);
            }
            return cloneTabs(DEFAULT_TABS);
        }

        function offerAddedTypes(tabs, store) {
            let offered = [];
            try {
                const raw = store.getItem(ADDED_TYPES_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                if (Array.isArray(parsed)) offered = parsed;
            } catch (e) { }
            const older = KNOWN_TYPES.filter(function (t) { return ADDED_TYPES.indexOf(t) === -1; });
            let changed = false;
            ADDED_TYPES.forEach(function (type) {
                if (offered.indexOf(type) !== -1) return;
                offered.push(type);
                changed = true;
                tabs.forEach(function (tab) {
                    const all = older.every(function (t) { return tab.types.indexOf(t) !== -1; });
                    if (all && tab.types.indexOf(type) === -1) tab.types.push(type);
                });
                const shown = tabs.some(function (tab) { return tab.types.indexOf(type) !== -1 && tab.types.length === 1; });
                DEFAULT_TABS.forEach(function (tab) {
                    if (!shown && tab.types.length === 1 && tab.types[0] === type) tabs.push(cloneTabs([tab])[0]);
                });
            });
            if (changed) {
                try {
                    store.setItem(ADDED_TYPES_KEY, JSON.stringify(offered));
                    store.setItem(TAB_STORAGE_KEY, JSON.stringify(tabs));
                } catch (e) { }
            }
            return tabs;
        }

        function saveTabs() {
            try {
                const store = chatStorage();
                if (store) store.setItem(TAB_STORAGE_KEY, JSON.stringify(chatTabs));
            } catch (e) {
                console.warn('Chat: could not save tab settings', e);
            }
        }

        let chatTabs = loadTabs();
        let activeTab = 0;
        let unread = [];
        const typeCounts = {};
        const seenTypes = {};

        function leadingElements(root) {
            const found = [];
            let node = root;
            for (let depth = 0; depth < 4 && node; depth++) {
                let child = node.firstChild;
                while (child && child.nodeType === 3 && !child.nodeValue.trim()) child = child.nextSibling;
                if (!child || child.nodeType !== 1) break;
                found.push(child);
                node = child;
            }
            return found;
        }

        function classifyMessage(div) {
            const tagged = div.querySelector('[class*="chattype-"]');
            if (tagged) {
                const match = /(?:^|\s)chattype-([a-z]+)/.exec(tagged.className);
                if (match && KNOWN_TYPES.indexOf(match[1]) !== -1) return match[1];
            }
            const lead = leadingElements(div);
            for (let r = 0; r < TYPE_RULES.length; r++) {
                for (let i = 0; i < lead.length; i++) {
                    if (lead[i].matches && lead[i].matches(TYPE_RULES[r][1])) return TYPE_RULES[r][0];
                }
            }
            return 'other';
        }

        function tabShows(index, type) {
            const tab = chatTabs[index];
            return !!tab && tab.types.indexOf(type) !== -1;
        }

        function tabVisible(index) {
            const tab = chatTabs[index];
            if (!tab.auto || index === activeTab) return true;
            return !!seenTypes[tab.auto];
        }

        const tabList = document.getElementById('chat-tab-list');
        function renderTabs() {
            tabList.innerHTML = '';
            chatTabs.forEach(function (tab, index) {
                if (!tabVisible(index)) return;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'chat-tab' + (index === activeTab ? ' active' : '');
                button.textContent = tab.name;
                if (unread[index] && index !== activeTab) {
                    const badge = document.createElement('span');
                    badge.className = 'unread';
                    badge.textContent = unread[index] > 99 ? '99+' : String(unread[index]);
                    button.appendChild(badge);
                }
                button.addEventListener('click', function () { selectTab(index); });
                tabList.appendChild(button);
            });
        }

        function applyFilter() {
            const children = messagesContainer.children;
            for (let i = 0; i < children.length; i++) {
                const child = children[i];
                child.classList.toggle('filtered', !tabShows(activeTab, child.getAttribute('data-chat-type')));
            }
        }

        function selectTab(index) {
            if (index < 0 || index >= chatTabs.length) index = 0;
            activeTab = index;
            unread[index] = 0;
            applyFilter();
            renderTabs();
            followingTail = true;
            scrollToTail();
        }

        function noteMessageType(div, type) {
            div.setAttribute('data-chat-type', type);
            typeCounts[type] = (typeCounts[type] || 0) + 1;
            const newlySeen = !seenTypes[type];
            seenTypes[type] = true;
            if (!tabShows(activeTab, type)) div.classList.add('filtered');
            noteUnread(type, newlySeen);
        }

        function noteUnread(type, badgeChanged) {
            for (let i = 0; i < chatTabs.length; i++) {
                if (i !== activeTab && tabShows(i, type)) {
                    unread[i] = (unread[i] || 0) + 1;
                    badgeChanged = true;
                }
            }
            if (badgeChanged) renderTabs();
        }

        // Settings panel.
        const settingsPanel = document.getElementById('chat-settings');
        const settingsList = document.getElementById('chat-settings-list');
        function renderSettings() {
            settingsList.innerHTML = '';
            chatTabs.forEach(function (tab, index) {
                const box = document.createElement('div');
                box.className = 'tab-config';
                const name = document.createElement('input');
                name.type = 'text';
                name.maxLength = 24;
                name.value = tab.name;
                name.setAttribute('aria-label', 'Tab name');
                name.addEventListener('input', function () {
                    tab.name = name.value.substring(0, 24) || 'Tab';
                    saveTabs();
                    renderTabs();
                });
                box.appendChild(name);
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove';
                remove.disabled = chatTabs.length <= 1;
                remove.addEventListener('click', function () {
                    chatTabs.splice(index, 1);
                    unread.splice(index, 1);
                    if (activeTab >= chatTabs.length) activeTab = chatTabs.length - 1;
                    else if (activeTab > index) activeTab--;
                    saveTabs();
                    renderSettings();
                    selectTab(activeTab);
                });
                box.appendChild(document.createTextNode(' '));
                box.appendChild(remove);
                box.appendChild(document.createElement('br'));
                CHAT_TYPES.forEach(function (entry) {
                    const label = document.createElement('label');
                    const check = document.createElement('input');
                    check.type = 'checkbox';
                    check.checked = tab.types.indexOf(entry[0]) !== -1;
                    check.addEventListener('change', function () {
                        const at = tab.types.indexOf(entry[0]);
                        if (check.checked && at === -1) tab.types.push(entry[0]);
                        if (!check.checked && at !== -1) tab.types.splice(at, 1);
                        tab.auto = '';
                        saveTabs();
                        if (index === activeTab) applyFilter();
                        renderTabs();
                    });
                    label.appendChild(check);
                    label.appendChild(document.createTextNode(' ' + entry[1]));
                    box.appendChild(label);
                });
                settingsList.appendChild(box);
            });
        }

        document.getElementById('chat-tab-settings').addEventListener('click', function () {
            if (settingsPanel.classList.toggle('open')) renderSettings();
        });
        document.getElementById('chat-settings-close').addEventListener('click', function () {
            settingsPanel.classList.remove('open');
        });
        document.getElementById('chat-tab-add').addEventListener('click', function () {
            chatTabs.push({ name: 'New tab', types: ['ic'], auto: '' });
            saveTabs();
            renderSettings();
            renderTabs();
        });
        document.getElementById('chat-tab-reset').addEventListener('click', function () {
            chatTabs = cloneTabs(DEFAULT_TABS);
            unread = [];
            saveTabs();
            renderSettings();
            selectTab(0);
        });

        // Remove the oldest message of an over-full type. Busy channels then
        // cannot push quiet ones, such as dead chat, out of the history.
        function trimType(type) {
            if ((typeCounts[type] || 0) <= MAX_MESSAGES_PER_TYPE) return;
            const victim = messagesContainer.querySelector('.message[data-chat-type="' + type + '"]');
            if (!victim) return;
            let anchor = null;
            let anchorTop = 0;
            if (!followingTail) {
                const viewportTop = chatContainer.getBoundingClientRect().top;
                const children = messagesContainer.children;
                for (let i = 0; i < children.length; i++) {
                    const child = children[i];
                    if (child === victim || child.classList.contains('filtered')) continue;
                    const rect = child.getBoundingClientRect();
                    if (rect.bottom > viewportTop) {
                        anchor = child;
                        anchorTop = rect.top;
                        break;
                    }
                }
            }
            messagesContainer.removeChild(victim);
            typeCounts[type]--;
            if (anchor && anchor.parentNode === messagesContainer) {
                const shift = anchor.getBoundingClientRect().top - anchorTop;
                if (shift) {
                    chatContainer.scrollTop += shift;
                    programmaticScrollTop = chatContainer.scrollTop;
                }
            }
        }

        // Chat history that survives a reconnect. Moving between regions
        // connects the client to a different world, which loads a fresh copy
        // of this page; the last lines are kept in the same storage as the
        // tab settings (BYOND hub storage on 516+, shared by every region)
        // under the player's ckey and put back above the new output. The
        // server names the ckey with setChatIdentity() before any message.
        // Restored lines are sanitized again and their game links are
        // disabled, because a link points at an object on the old world.
        const HISTORY_KEY_PREFIX = 'civ13-chat-history-v1:';
        const HISTORY_MAX_LINES = 400;
        const HISTORY_MAX_PER_TYPE = 120;
        const HISTORY_MAX_CHARS = 400000;
        const HISTORY_MAX_AGE_MS = 24 * 60 * 60 * 1000;
        const HISTORY_SAVE_DELAY_MS = 750;
        let historyKey = '';
        let historySaveTimer = null;

        function historyEntries() {
            const children = messagesContainer.children;
            const perType = {};
            const kept = [];
            let chars = 0;
            for (let i = children.length - 1; i >= 0 && kept.length < HISTORY_MAX_LINES; i--) {
                const child = children[i];
                if (!child.classList.contains('message') || child.classList.contains('connection-notice')) continue;
                const type = child.getAttribute('data-chat-type') || 'other';
                if ((perType[type] || 0) >= HISTORY_MAX_PER_TYPE) continue;
                const html = untranslatedHtml(child);
                if (chars + html.length > HISTORY_MAX_CHARS) break;
                chars += html.length;
                perType[type] = (perType[type] || 0) + 1;
                kept.push({ t: type, h: html });
            }
            return kept.reverse();
        }

        function saveHistory() {
            if (historySaveTimer) {
                clearTimeout(historySaveTimer);
                historySaveTimer = null;
            }
            if (!historyKey) return;
            try {
                const store = chatStorage();
                if (store) store.setItem(historyKey, JSON.stringify({ savedAt: Date.now(), lines: historyEntries() }));
            } catch (e) {
                console.warn('Chat: could not save chat history', e);
            }
        }

        function scheduleHistorySave() {
            if (!historyKey || historySaveTimer) return;
            historySaveTimer = setTimeout(saveHistory, HISTORY_SAVE_DELAY_MS);
        }

        function restoredLine(entry) {
            if (!entry || typeof entry.h !== 'string') return null;
            const type = KNOWN_TYPES.indexOf(entry.t) !== -1 ? entry.t : 'other';
            const div = document.createElement('div');
            div.className = 'message restored';
            if (typeof DOMPurify === 'undefined') {
                div.textContent = entry.h.replace(/<[^>]*>/g, '');
            } else {
                div.innerHTML = DOMPurify.sanitize(entry.h, {
                    USE_PROFILES: { html: true },
                    FORBID_TAGS: ['form', 'input', 'button', 'textarea', 'select'],
                    ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^&:/?#]*(?:[/?#]|$))/i
                });
            }
            const links = div.querySelectorAll('a');
            for (let i = 0; i < links.length; i++) {
                const href = links[i].getAttribute('href') || '';
                if (!/^(?:https?|mailto):/i.test(href)) {
                    links[i].removeAttribute('href');
                    links[i].classList.add('stale-link');
                }
            }
            div.setAttribute('data-chat-type', type);
            return div;
        }

        function restoreHistory() {
            let saved = null;
            try {
                const store = chatStorage();
                const raw = store && store.getItem(historyKey);
                if (raw) saved = JSON.parse(raw);
            } catch (e) {
                console.warn('Chat: could not load chat history', e);
            }
            if (!saved || !Array.isArray(saved.lines) || !saved.lines.length) return;
            if (!(Number(saved.savedAt) > Date.now() - HISTORY_MAX_AGE_MS)) return;
            const fragment = document.createDocumentFragment();
            const lines = saved.lines.slice(-HISTORY_MAX_LINES);
            let restored = 0;
            for (let i = 0; i < lines.length; i++) {
                const div = restoredLine(lines[i]);
                if (!div) continue;
                const type = div.getAttribute('data-chat-type');
                typeCounts[type] = (typeCounts[type] || 0) + 1;
                seenTypes[type] = true;
                if (!tabShows(activeTab, type)) div.classList.add('filtered');
                fragment.appendChild(div);
                restored++;
            }
            if (!restored) return;
            // Shown on every tab, like connection notices, and never saved.
            const divider = document.createElement('div');
            divider.className = 'message connection-notice chat-history-divider';
            const span = document.createElement('span');
            span.className = 'notice';
            span.textContent = 'Earlier chat from your last connection is above.';
            divider.appendChild(span);
            fragment.appendChild(divider);
            messagesContainer.insertBefore(fragment, messagesContainer.firstChild);
            for (const type in typeCounts) {
                while ((typeCounts[type] || 0) > MAX_MESSAGES_PER_TYPE) {
                    const before = typeCounts[type];
                    trimType(type);
                    if (typeCounts[type] === before) break;
                }
            }
            renderTabs();
            followingTail = true;
            scrollToTail();
        }

        function setChatIdentity(ckey) {
            const name = String(ckey || '').toLowerCase();
            if (historyKey || !/^[a-z0-9]{1,64}$/.test(name)) return;
            historyKey = HISTORY_KEY_PREFIX + name;
            restoreHistory();
            scheduleHistorySave();
        }

        window.addEventListener('pagehide', saveHistory);
        window.addEventListener('beforeunload', saveHistory);

        renderTabs();

        /**
         * Receives a message from BYOND.
         * @param {string|object} data - The message text or a JSON object.
         */
        let lastMessage = '';
        let lastMessageTime = 0;

        // Repeated lines. A message identical to the line just before it adds
        // an x2, x3 counter to that line instead of a new one, until any other
        // line (a different message, a connection notice or Clear Chat) comes
        // between. Same idea as the combined messages in tgstation's tgui chat
        // panel (https://github.com/tgstation/tgstation, AGPL-3.0); this is
        // Civ13's own code. Compared on the HTML the server sent, before the
        // counter was added to the line.
        let lastLine = null;
        let lastLineHtml = '';

        function bumpRepeat(div) {
            const count = (Number(div.getAttribute('data-repeat')) || 1) + 1;
            div.setAttribute('data-repeat', String(count));
            let badge = div.lastElementChild;
            if (!badge || !badge.classList.contains('chat-repeat')) {
                badge = document.createElement('span');
                badge.className = 'chat-repeat';
                div.appendChild(badge);
            }
            badge.textContent = 'x' + count;
            badge.classList.remove('bump');
            void badge.offsetWidth; // restart the bump animation
            badge.classList.add('bump');
            noteUnread(div.getAttribute('data-chat-type'), false);
        }

        function receiveMessage(data, skip_purify = false) {
            try {
                if (!data) return;
                heardFromServer();

                // Handle the skip_purify flag if it was passed as part of a string (e.g., "message;1")
                // but also respect the second argument if BYOND passed it correctly.
                if (typeof data === 'string' && data.endsWith(';1')) {
                    skip_purify = true;
                    data = data.substring(0, data.length - 2);
                }

                let decodedData = data;
                try {
                    decodedData = decodeURIComponent(data);
                } catch (e) {
                    console.warn("Chat: Failed to decode message", e);
                }

                let messageHtml = '';
                if (typeof decodedData === 'string' && decodedData.charAt(0) === '{') {
                    try {
                        const parsed = JSON.parse(decodedData);
                        messageHtml = parsed.message || decodedData;
                    } catch (e) {
                        messageHtml = decodedData;
                    }
                } else {
                    messageHtml = decodedData;
                }

                if (!messageHtml) return;

                // Deduplication for OpenDream/BYOND glitches
                if (messageHtml === lastMessage && (Date.now() - lastMessageTime) < 100) {
                    return;
                }
                lastMessage = messageHtml;
                lastMessageTime = Date.now();

                if (lastLine && lastLineHtml === messageHtml && messagesContainer.lastElementChild === lastLine) {
                    bumpRepeat(lastLine);
                    scheduleHistorySave();
                    scrollToTail();
                    return;
                }

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                // Robust sanitization with fallback
                if (skip_purify || typeof DOMPurify === 'undefined') {
                    messageDiv.innerHTML = messageHtml;
                } else {
                    try {
                        messageDiv.innerHTML = DOMPurify.sanitize(messageHtml, {
                            USE_PROFILES: { html: true },
                            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|ftp|tel|file|sms|byond):|[^&:/?#]*(?:[/?#]|$))/i
                        });
                    } catch (e) {
                        console.error("Chat: Sanitization failed", e);
                        messageDiv.innerText = messageHtml; // Fallback to plain text on failure
                    }
                }

                const chatType = classifyMessage(messageDiv);
                noteMessageType(messageDiv, chatType);
                messagesContainer.appendChild(messageDiv);
                queueTranslation(messageDiv, chatType);
                lastLine = messageDiv;
                lastLineHtml = messageHtml;

                // Keep memory usage in check by trimming old messages per
                // type. When reading above the tail, keep a surviving visible
                // message at the same screen position.
                trimType(chatType);
                scheduleHistorySave();

                scrollToTail();
            } catch (err) {
                console.error("Chat Fatal Error:", err);
            }
        }

        // Chat translation (docs/chat-translation.md). On at first only for
        // desktops not in English (Val, 2026-11-22); anyone can turn it on or
        // off. When on, words players typed (speech,
        // emotes, OOC and LOOC, marked chat-tr by the server) in another
        // language are translated into the reader's language (English unless
        // they pick another); game messages are never translated. When the game server offers translation
        // (setTranslateServer), the line's text goes back to that server, which
        // already sent it; otherwise the browser's built-in Translator and
        // LanguageDetector are used and nothing leaves this computer. The
        // original stays on screen and restored history is never translated.
        // v1 saved "on" whenever the language was changed, so only its
        // language choice is kept; v2 is saved only when the player changes it.
        const TRANSLATE_KEY = 'civ13-chat-translate-v2';
        const TRANSLATE_OLD_KEY = 'civ13-chat-translate-v1';
        const TRANSLATE_LANGS = [
            ['en', 'English'], ['es', 'Spanish'], ['pt', 'Portuguese'], ['fr', 'French'], ['de', 'German'],
            ['it', 'Italian'], ['nl', 'Dutch'], ['pl', 'Polish'], ['ru', 'Russian'], ['uk', 'Ukrainian'],
            ['tr', 'Turkish'], ['sv', 'Swedish'], ['fi', 'Finnish'], ['cs', 'Czech'], ['ro', 'Romanian'],
            ['el', 'Greek'], ['ar', 'Arabic'], ['hi', 'Hindi'], ['id', 'Indonesian'], ['vi', 'Vietnamese'],
            ['th', 'Thai'], ['zh', 'Chinese'], ['ja', 'Japanese'], ['ko', 'Korean']
        ];
        const TRANSLATE_MAX_CHARS = 500;
        const TRANSLATE_MIN_LETTERS = 3; // shorter lines are too short to tell the language
        const TRANSLATE_MAX_QUEUE = 20;
        const TRANSLATE_TIMEOUT_MS = 8000;
        const TRANSLATE_MIN_CONFIDENCE = 0.6;
        const translateApi = typeof self !== 'undefined' && 'Translator' in self;
        const detectApi = typeof self !== 'undefined' && 'LanguageDetector' in self;
        let translatePrefs = loadTranslatePrefs();
        let translateGeneration = 0;
        let translateBusy = false;
        let languageDetector = null;
        let detectorState = '';
        const translateQueue = [];
        const translators = {};
        const pairStates = {};
        const pairPrompted = {};
        let unsupportedPair = '';
        const SERVER_TRANSLATE_TIMEOUT_MS = 20000;
        let serverTranslate = false;
        let serverTranslateSeq = 0;
        const serverTranslatePending = {};

        function offeredLang(code) {
            const base = String(code || '').toLowerCase().split(/[-_]/)[0];
            return TRANSLATE_LANGS.some(function (l) { return l[0] === base; }) ? base : '';
        }

        // The first offered language in this computer's language list
        // (the Windows display language in Dream Seeker's WebView2), or ''.
        function desktopLang() {
            try {
                const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
                for (let i = 0; i < list.length; i++) {
                    const lang = offeredLang(list[i]);
                    if (lang) return lang;
                }
            } catch (e) { /* none */ }
            return '';
        }

        // A saved choice always wins. Without one (Val, 2026-11-22), a player
        // whose desktop is not in English starts with translation on, into
        // their desktop language; English desktops start with it off.
        function loadTranslatePrefs() {
            const prefs = { enabled: false, lang: 'en' };
            try {
                const store = chatStorage();
                const raw = store && store.getItem(TRANSLATE_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    if (saved && typeof saved.enabled === 'boolean') prefs.enabled = saved.enabled;
                    if (saved && offeredLang(saved.lang) === saved.lang) prefs.lang = saved.lang;
                    return prefs;
                }
                const old = store && store.getItem(TRANSLATE_OLD_KEY);
                const saved = old ? JSON.parse(old) : null;
                const oldLang = saved && offeredLang(saved.lang) === saved.lang ? saved.lang : '';
                prefs.lang = (oldLang && oldLang !== 'en') ? oldLang : (desktopLang() || 'en');
            } catch (e) {
                prefs.lang = desktopLang() || 'en';
            }
            prefs.enabled = prefs.lang !== 'en';
            return prefs;
        }

        function saveTranslatePrefs() {
            try {
                const store = chatStorage();
                if (store) store.setItem(TRANSLATE_KEY, JSON.stringify(translatePrefs));
            } catch (e) { /* this computer only; nothing else to do */ }
        }

        function langName(code) {
            const base = String(code || '').split('-')[0];
            for (let i = 0; i < TRANSLATE_LANGS.length; i++) if (TRANSLATE_LANGS[i][0] === base) return TRANSLATE_LANGS[i][1];
            return base || 'another language';
        }

        // Saved history keeps the original lines only.
        function untranslatedHtml(div) {
            if (!div.querySelector('.chat-translation, .chat-translate-setup')) return div.innerHTML;
            const copy = div.cloneNode(true);
            copy.querySelectorAll('.chat-translation, .chat-translate-setup').forEach(function (el) { el.remove(); });
            return copy.innerHTML;
        }

        // The server marks the words a player typed that this reader
        // understood (chat-tr) and speech they did not understand (chat-notr,
        // never translated). Only marked words are translated; unmarked lines
        // are game messages, such as "Ada makes a trench.", and stay as they are.
        function translationSource(div, type) {
            if (div.querySelector('.chat-notr')) return '';
            const parts = [];
            div.querySelectorAll('.chat-tr').forEach(function (el) { parts.push(el.textContent); });
            return parts.join(' ').trim();
        }

        function withTimeout(promise, ms) {
            return Promise.race([promise, new Promise(function (_, reject) { setTimeout(function () { reject(new Error('timeout')); }, ms); })]);
        }

        function queueTranslation(div, type) {
            if (!translatePrefs.enabled || !(translateApi || serverTranslate)) return;
            const text = translationSource(div, type);
            if (!text || text.length > TRANSLATE_MAX_CHARS) return;
            // Letters outside the Latin script carry more each (你好 is a whole greeting).
            const letters = (text.match(/[A-Za-zÀ-￿]/g) || []).length + (text.match(/[Ͱ-￿]/g) || []).length;
            if (letters < TRANSLATE_MIN_LETTERS) return;
            // Under a burst, drop the oldest waiting line rather than fall behind.
            if (translateQueue.length >= TRANSLATE_MAX_QUEUE) translateQueue.shift();
            translateQueue.push({ div: div, text: text, gen: translateGeneration });
            pumpTranslations();
        }

        async function getDetector(userAsked) {
            if (languageDetector) return languageDetector;
            if (!detectApi) return null;
            try {
                if (!detectorState) detectorState = await LanguageDetector.availability();
                if (detectorState === 'available' || (userAsked && (detectorState === 'downloadable' || detectorState === 'downloading'))) {
                    languageDetector = await LanguageDetector.create();
                    detectorState = 'available';
                }
            } catch (e) {
                detectorState = 'unavailable';
            }
            updateTranslateStatus();
            return languageDetector;
        }

        async function detectLanguage(text) {
            const detector = await getDetector(false);
            if (!detector) return '';
            const results = await withTimeout(detector.detect(text), TRANSLATE_TIMEOUT_MS);
            const best = results && results[0];
            if (!best || best.detectedLanguage === 'und' || best.confidence < TRANSLATE_MIN_CONFIDENCE) return '';
            return String(best.detectedLanguage).split('-')[0];
        }

        async function pairAvailability(source, target) {
            const key = source + '>' + target;
            if (pairStates[key] !== 'available') {
                try {
                    pairStates[key] = await Translator.availability({ sourceLanguage: source, targetLanguage: target });
                } catch (e) {
                    pairStates[key] = 'unavailable';
                }
            }
            return pairStates[key];
        }

        async function getTranslator(source, target, monitor) {
            const key = source + '>' + target;
            if (!translators[key]) {
                const options = { sourceLanguage: source, targetLanguage: target };
                if (monitor) options.monitor = monitor;
                translators[key] = Translator.create(options).catch(function (e) { delete translators[key]; throw e; });
            }
            return translators[key];
        }

        function stillWanted(job) {
            return job.gen === translateGeneration && job.div.isConnected && translatePrefs.enabled;
        }

        function showTranslation(div, source, text) {
            const old = div.querySelector('.chat-translation, .chat-translate-setup');
            if (old) old.remove();
            const box = document.createElement('span');
            box.className = 'chat-translation';
            const label = document.createElement('span');
            label.className = 'chat-translation-label';
            label.textContent = 'Translated from ' + langName(source) + ':';
            box.appendChild(label);
            box.appendChild(document.createTextNode(text));
            const badge = div.lastElementChild;
            if (badge && badge.classList.contains('chat-repeat')) div.insertBefore(box, badge);
            else div.appendChild(box);
            if (div === messagesContainer.lastElementChild) scrollToTail();
        }

        // A language pack is downloaded only when the reader presses the button,
        // never because a message arrived. Offer each pair once per session.
        function showSetup(job, source, target) {
            const key = source + '>' + target;
            if (pairPrompted[key]) return;
            pairPrompted[key] = true;
            const box = document.createElement('span');
            box.className = 'chat-translate-setup';
            box.appendChild(document.createTextNode('This line is in ' + langName(source) + '. '));
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Download ' + langName(source) + ' to ' + langName(target) + ' translation';
            button.addEventListener('click', async function () {
                button.disabled = true;
                button.textContent = 'Downloading...';
                try {
                    const translator = await getTranslator(source, target, function (m) {
                        m.addEventListener('downloadprogress', function (e) {
                            button.textContent = 'Downloading... ' + Math.round((e.loaded || 0) * 100) + '%';
                        });
                    });
                    pairStates[key] = 'available';
                    const out = await withTimeout(translator.translate(job.text), TRANSLATE_TIMEOUT_MS);
                    if (job.div.isConnected && out && out.trim() && out.trim() !== job.text) showTranslation(job.div, source, out.trim());
                    else box.remove();
                } catch (e) {
                    button.textContent = 'Could not download this translation.';
                }
            });
            box.appendChild(button);
            job.div.appendChild(box);
        }

        // The server answers every request with receiveTranslation(id, source,
        // text); text is empty when the line needs no translation or the
        // server could not translate it, so the next line is not held up.
        function chatSendTranslate(id, lang, text) {
            window.location.href = 'byond://?chat_translate=' + id + '&lang=' + encodeURIComponent(lang) + '&text=' + encodeURIComponent(text);
        }

        function receiveTranslation(id, source, text) {
            const pending = serverTranslatePending[id];
            if (!pending) return;
            delete serverTranslatePending[id];
            pending({ source: String(source || ''), text: String(text || '').trim() });
        }

        function setTranslateServer(on) {
            serverTranslate = String(on) === '1';
            updateTranslateStatus();
        }

        async function serverTranslateJob(job) {
            const target = translatePrefs.lang;
            const id = ++serverTranslateSeq;
            const answer = new Promise(function (resolve) { serverTranslatePending[id] = resolve; });
            window.chatSendTranslate(id, target, job.text);
            let out;
            try {
                out = await withTimeout(answer, SERVER_TRANSLATE_TIMEOUT_MS);
            } finally {
                delete serverTranslatePending[id];
            }
            if (stillWanted(job) && target === translatePrefs.lang && out.text && out.source !== target && out.text !== job.text) showTranslation(job.div, out.source, out.text);
        }

        async function translateJob(job) {
            if (serverTranslate) return serverTranslateJob(job);
            const target = translatePrefs.lang;
            const source = await detectLanguage(job.text);
            if (!source || source === target || !stillWanted(job)) return;
            const state = await pairAvailability(source, target);
            if (!stillWanted(job)) return;
            if (state === 'available') {
                const translator = await getTranslator(source, target);
                const out = await withTimeout(translator.translate(job.text), TRANSLATE_TIMEOUT_MS);
                if (stillWanted(job) && out && out.trim() && out.trim() !== job.text) showTranslation(job.div, source, out.trim());
            } else if (state === 'downloadable' || state === 'downloading') {
                showSetup(job, source, target);
            } else if (!unsupportedPair) {
                // The browser has the translator but not this language pair.
                unsupportedPair = langName(source) + ' to ' + langName(target);
                updateTranslateStatus();
            }
        }

        async function pumpTranslations() {
            if (translateBusy) return;
            translateBusy = true;
            try {
                while (translateQueue.length) {
                    const job = translateQueue.shift();
                    if (!stillWanted(job)) continue;
                    try {
                        await translateJob(job);
                    } catch (e) {
                        // A slow or failed line keeps its original text.
                    }
                }
            } finally {
                translateBusy = false;
            }
        }

        function updateTranslateStatus() {
            const status = document.getElementById('chat-translate-status');
            const setup = document.getElementById('chat-translate-setup');
            if (!status) return;
            setup.hidden = true;
            if (!translatePrefs.enabled) {
                status.textContent = 'Off. Tick the box to translate what other players type in another language.';
            } else if (serverTranslate) {
                status.textContent = 'Lines in other languages appear in ' + langName(translatePrefs.lang) + ' under the original. The game server translates them.';
            } else if (!translateApi || !detectApi) {
                status.textContent = 'This game window cannot translate chat yet. Chat is shown as written.';
            } else if (detectorState === 'downloadable' || detectorState === 'downloading') {
                status.textContent = 'Language detection needs a one-time download before chat can be translated.';
                setup.hidden = false;
            } else if (detectorState === 'unavailable') {
                status.textContent = 'Language detection is not available here, so chat is shown as written.';
            } else if (unsupportedPair) {
                status.textContent = 'This game window cannot translate ' + unsupportedPair + ' yet, so those lines are shown as written. Other languages are still translated when they can be.';
            } else {
                status.textContent = 'Lines in other languages appear in ' + langName(translatePrefs.lang) + ' under the original. Translation happens on this computer only.';
            }
        }

        function setupTranslationSettings() {
            const on = document.getElementById('chat-translate-on');
            const select = document.getElementById('chat-translate-lang');
            TRANSLATE_LANGS.forEach(function (entry) {
                const option = document.createElement('option');
                option.value = entry[0];
                option.textContent = entry[1];
                select.appendChild(option);
            });
            on.checked = translatePrefs.enabled;
            select.value = translatePrefs.lang;
            function changed() {
                translatePrefs = { enabled: on.checked, lang: select.value };
                translateGeneration++;
                translateQueue.length = 0;
                saveTranslatePrefs();
                updateTranslateStatus();
            }
            on.addEventListener('change', changed);
            select.addEventListener('change', changed);
            document.getElementById('chat-translate-setup').addEventListener('click', function () {
                getDetector(true);
            });
            if (translateApi && translatePrefs.enabled) getDetector(false);
            updateTranslateStatus();
        }
        setupTranslationSettings();

        /**
         * Clears all messages from the chat.
         */
        function clearChat() {
            messagesContainer.innerHTML = '';
            for (const type in typeCounts) typeCounts[type] = 0;
            unread = [];
            renderTabs();
            followingTail = true;
            scrollToTail();
            saveHistory();
        }

        /**
         * Connection watchdog. Once the chat is ready the server starts it;
         * every tick the page pings the server, which answers with chatPong.
         * Any reply or message clears the outstanding ping. When the oldest
         * unanswered ping is older than the timeout the chat says the
         * connection was lost, and says so again once replies resume. Age is
         * measured from the ping itself, so a throttled timer in a hidden
         * window cannot raise a false alarm.
         */
        let heartbeatTimer = null;
        let heartbeatTimeoutMs = 20000;
        let pingSentAt = 0;
        let pingSeq = 0;
        let connectionLost = false;

        function chatSendPing(seq) {
            window.location.href = 'byond://?chat_ping=' + seq;
        }

        function connectionNotice(className, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message connection-notice';
            const span = document.createElement('span');
            span.className = 'warning ' + className;
            span.textContent = text;
            messageDiv.appendChild(span);
            noteMessageType(messageDiv, 'warning');
            messagesContainer.appendChild(messageDiv);
            trimType('warning');
            scrollToTail();
        }

        // Tells the server this page is ready again. After a lost connection
        // the answering world may be a new one (a handover or reboot keeps the
        // client connected but not the page's ready state), and a world that
        // never heard chat_ready holds every message in its queue.
        function chatSendReady() {
            window.location.href = 'byond://?chat_ready=1&again=1';
        }

        function heardFromServer() {
            pingSentAt = 0;
            if (!connectionLost) return;
            connectionLost = false;
            connectionNotice('connection-restored', 'Connection restored: the server is answering again.');
            try {
                window.chatSendReady();
            } catch (e) {
                console.warn('Chat: ready announce failed', e);
            }
        }

        function heartbeatTick() {
            const now = Date.now();
            if (pingSentAt && !connectionLost && now - pingSentAt >= heartbeatTimeoutMs) {
                connectionLost = true;
                connectionNotice('connection-lost', 'Connection lost: the server has not answered for '
                    + Math.round((now - pingSentAt) / 1000) + ' seconds. The server may have stopped or your'
                    + ' connection died. If this does not clear, reconnect.');
            }
            if (!pingSentAt) pingSentAt = now;
            // Re-sent every tick while unanswered, in case one was dropped.
            try {
                window.chatSendPing(++pingSeq);
            } catch (e) {
                console.warn('Chat: ping failed', e);
            }
        }

        function startHeartbeat(intervalMs, timeoutMs) {
            const interval = Number(intervalMs) > 0 ? Number(intervalMs) : 5000;
            heartbeatTimeoutMs = Number(timeoutMs) > 0 ? Number(timeoutMs) : 20000;
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            pingSentAt = 0;
            connectionLost = false;
            heartbeatTimer = setInterval(heartbeatTick, interval);
        }

        window.chatSendPing = chatSendPing;
        window.chatSendTranslate = chatSendTranslate;
        window.receiveTranslation = receiveTranslation;
        window.setTranslateServer = setTranslateServer;
        window.chatSendReady = chatSendReady;
        window.chatPong = heardFromServer;
        window.startChatHeartbeat = startHeartbeat;

        // Expose to global scope for BYOND
        window.receiveMessage = receiveMessage;
        window.clearChat = clearChat;
        window.setChatIdentity = setChatIdentity;
        window.selectChatTab = selectTab;

        // Notify BYOND that we are ready
        window.location.href = 'byond://?chat_ready=1';
    </script>
</body>

</html>
