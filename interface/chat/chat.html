<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        /* Civilization 13 Modern Chat Styling */
        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-BoldItalic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }

        @font-face {
            font-family: 'Civ13Custom';
            src: url('Alegreya-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        @font-face {
            font-family: 'Wizard';
            src: url('Wizard.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .wizard {
            font-family: "Wizard", "Civ13Custom", serif;
        }

        body {
            background-color: #392611;
            color: #e1e1d7;
            font-family: 'Civ13Custom', "Book Antiqua", "Bookman Old Style", serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 14px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }

        #chat-container {
            height: calc(100% - 22px);
            padding: 8px;
            box-sizing: border-box;
            overflow-y: scroll;
            scrollbar-face-color: #a68b7d;
            scrollbar-shadow-color: #271a0c;
            scrollbar-highlight-color: #e1e1d7;
            scrollbar-3dlight-color: #a68b7d;
            scrollbar-darkshadow-color: #000000;
            scrollbar-track-color: #392611;
            scrollbar-arrow-color: #271a0c;
        }

        /* Modern scrollbar for Chromium-based BYOND */
        #chat-container::-webkit-scrollbar {
            width: 12px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: #392611;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: #a68b7d;
            border: 2px solid #392611;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #bda294;
        }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-wrap: break-word;
        }

        .message {
            line-height: 1.3;
            opacity: 0;
            animation: fadeIn 0.2s forwards ease-out;
            white-space: pre-wrap;
        }

        .message.html-content {
            white-space: normal;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Standard SS13 styles fallback */

        .admin {
            color: #9b59b6;
            font-weight: bold;
        }

        .ooc {
            color: #3498db;
            font-weight: bold;
        }

        a {
            color: #a68b7d;
            text-decoration: underline;
        }

        a:hover {
            color: #e1e1d7;
        }

        .prefix {
            font-weight: bold;
        }

        .log_message {
            color: #A9B6E7;
            font-weight: bold;
        }

        .small_message {
            color: #E1E1FF;
            font-weight: bold;
            font-size: 0.66em;
        }

        a,
        a:link,
        a:visited,
        a:active,
        a:hover {
            color: #CD4C6C;
        }

        /* OOC */
        .ooc {
            font-weight: bold;
        }

        .ooc img.text_tag {
            width: 32px;
            height: 10px;
        }

        .ooc .everyone {
            color: #1E8CBE;
        }

        .ooc .looc {
            color: #75B5B5;
        }

        .ooc .elevated {
            color: #2e78d9;
        }

        .ooc .mentor {
            color: #2e78d9;
        }

        .ooc .moderator {
            color: #2ed9ab;
        }

        .ooc .developer {
            color: #a649bf;
        }

        .ooc .admin {
            color: #39ac41;
        }

        .ooc .highstaff {
            color: #b82e00;
        }

        /* Admin: Private Messages */
        .pm .howto {
            color: #ff0000;
            font-weight: bold;
            font-size: 200%;
        }

        .pm .in {
            color: #ff0000;
        }

        .pm .out {
            color: #ff0000;
        }

        .pm .other {
            color: #1E8CBE;
        }

        /* Admin: Channels */
        .mod_channel {
            color: #735638;
            font-weight: bold;
        }

        .mod_channel .admin {
            color: #b82e00;
            font-weight: bold;
        }

        .admin_channel {
            color: #9611D4;
            font-weight: bold;
        }

        /* Radio: Misc */
        .deadsay {
            color: #8657C5;
        }

        .radio {
            color: #4CA64C;
        }

        /* Radio Channels */
        .blueradio {
            color: #6A80A9;
        }

        .SSradio {
            color: #466194;
        }

        .redradio {
            color: #B53232;
        }

        .brownradio {
            color: #7E6A46;
        }

        /* Miscellaneous */
        .name {
            font-weight: bold;
        }

        .alert {
            color: #ff0000;
        }

        h1.alert,
        h2.alert {
            color: #ff0000;
        }

        .ghostalert {
            color: #5c00e6;
            font-style: italic;
            font-weight: bold;
        }

        .emote {
            font-style: italic;
        }

        /* Game Messages */

        .attack {
            color: #ff0000;
        }

        .moderate {
            color: #CC0000;
        }

        .disarm {
            color: #990000;
        }

        .passive {
            color: #660000;
        }

        .red {
            color: #ff3737
        }

        .green {
            color: #289120
        }

        .green_bold {
            color: #289120;
            font-weight: bold;
        }

        @keyframes danger-blink {

            0%,
            100% {
                color: #b30000;
            }

            50% {
                color: #ff3737;
            }
        }

        .danger {
            font-weight: bold;
            animation: danger-blink 1s infinite;
        }

        .userdanger {
            font-weight: bold;
            font-size: 2.0em;
            animation: danger-blink 1s infinite;
        }

        .userdanger_yellow {
            color: #ffff00;
            font-weight: bold;
            font-size: 2.5em;
        }

        .hugedanger {
            font-weight: bold;
            font-size: 3.0em;
            animation: danger-blink 1s infinite;
        }

        .warning {
            color: #ff3737;
            font-style: italic;
        }

        .rose {
            color: #ff5050;
        }

        .notice {
            color: #89a2d8;
        }

        .ping {
            color: #E1E1FF;
            font-weight: bold;
        }

        .reflex_shoot {
            color: #000099;
            font-style: italic;
        }

        /* Languages */

        .rough {
            font-family: "Trebuchet MS", cursive, sans-serif;
        }

        .say_quote {
            font-family: Georgia, Verdana, sans-serif;
        }

        .interface {
            color: #704C70;
        }

        .good {
            color: #839E69;
            font-weight: bold;
        }

        .bad {
            color: #ff3737;
            font-weight: bold;
        }

        /* Chat Tags */
        .text_tag {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 4px;
            vertical-align: middle;
            font-family: Arial, sans-serif;
            line-height: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tag-ooc {
            background-color: #1a56f0;
            color: white;
            border-color: #0d41bc;
        }

        .tag-looc {
            background-color: #36b6a6;
            color: white;
            border-color: #2a8d81;
        }

        .tag-dead,
        .tag-lobby {
            background-color: #6326c0;
            color: white;
            border-color: #4a1d8f;
        }

        .tag-asay,
        .tag-admin,
        .tag-a-discord {
            background-color: #a123f0;
            color: white;
            border-color: #7b1ab8;
        }

        .tag-mentor {
            background-color: #3986f0;
            color: white;
            border-color: #2b65b6;
        }

        .tag-pm_in {
            background-color: #f01a1a;
            color: white;
            border-color: #b81414;
        }

        .tag-pm_out_alt {
            background-color: #b04343;
            color: white;
            border-color: #8a3434;
        }

        .tag-pm_other {
            background-color: #5092c0;
            color: white;
            border-color: #3d6f92;
        }

        .tag-help {
            background-color: #ff0000;
            color: white;
            border-color: #cc0000;
        }

        .tag-discord,
        .tag-discord2 {
            background-color: #00b0f0;
            color: white;
            border-color: #0089bc;
        }

        .tag-ping {
            background-color: #f1c40f;
            color: #2c3e50;
            border-color: #f39c12;
            font-size: 9px;
        }

        .motd {
            color: #E1E1FF;
            font-family: "Civ13Custom", "Book Antiqua", Verdana, sans-serif;
        }

        .motd h1,
        .motd h2,
        .motd h3,
        .motd h4,
        .motd h5,
        .motd h6 {
            margin-top: 0.2em;
            margin-bottom: 0.2em;
            color: #E1E1FF;
        }

        .motd a,
        .motd a:link,
        .motd a:visited,
        .motd a:active,
        .motd a:hover {
            color: #CD4C6C;
        }

        /* Chat filter tabs */
        #chat-tabs {
            display: flex;
            align-items: stretch;
            height: 22px;
            box-sizing: border-box;
            background-color: #271a0c;
            border-bottom: 1px solid #a68b7d;
            font-family: Arial, sans-serif;
            font-size: 11px;
            user-select: none;
        }

        #chat-tab-list {
            display: flex;
            flex: 1 1 auto;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        #chat-tab-list::-webkit-scrollbar {
            display: none;
        }

        .chat-tab,
        #chat-tab-settings {
            flex: 0 0 auto;
            padding: 0 8px;
            border: 0;
            border-right: 1px solid #392611;
            background: transparent;
            color: #a68b7d;
            font: inherit;
            line-height: 21px;
            cursor: pointer;
            white-space: nowrap;
        }

        .chat-tab:hover,
        #chat-tab-settings:hover {
            color: #e1e1d7;
        }

        .chat-tab.active {
            background-color: #392611;
            color: #e1e1d7;
            font-weight: bold;
        }

        .chat-tab .unread {
            display: inline-block;
            margin-left: 4px;
            padding: 0 4px;
            border-radius: 6px;
            background-color: #CD4C6C;
            color: #ffffff;
            font-size: 9px;
            line-height: 12px;
        }

        #chat-tab-settings {
            border-left: 1px solid #392611;
            border-right: 0;
        }

        .message.filtered {
            display: none;
        }

        #chat-settings {
            display: none;
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            overflow-y: auto;
            padding: 8px;
            box-sizing: border-box;
            background-color: #271a0c;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        #chat-settings.open {
            display: block;
        }

        #chat-settings h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
        }

        #chat-settings .hint {
            margin: 0 0 8px 0;
            color: #a68b7d;
        }

        .tab-config {
            margin-bottom: 8px;
            padding: 6px;
            border: 1px solid #392611;
            background-color: #392611;
        }

        .tab-config input[type="text"] {
            width: 140px;
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
        }

        .tab-config label {
            display: inline-block;
            margin: 4px 10px 0 0;
            white-space: nowrap;
        }

        #chat-settings button {
            background-color: #a68b7d;
            color: #1c1c1c;
            border: 1px solid #271a0c;
            font: inherit;
            padding: 1px 8px;
            margin: 0 4px 0 0;
            cursor: pointer;
        }
    </style>
    <title>Civilization 13 Chat</title>
</head>

<body style="background-color: #392611; color: #e1e1d7;">
    <div id="chat-tabs">
        <div id="chat-tab-list"></div>
        <button id="chat-tab-settings" type="button" title="Choose which kinds of chat each tab shows">Tabs...</button>
    </div>
    <div id="chat-settings">
        <h3>Chat tabs</h3>
        <p class="hint">Pick the kinds of chat each tab shows. Changes save on this computer.</p>
        <div id="chat-settings-list"></div>
        <button id="chat-tab-add" type="button">Add tab</button>
        <button id="chat-tab-reset" type="button">Reset to default</button>
        <button id="chat-settings-close" type="button">Done</button>
    </div>
    <div id="chat-container">
        <div id="messages"></div>
    </div>
    <script src="purify.min.js"></script>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const messagesContainer = document.getElementById('messages');

        // Follow new output only while the reader is at the end. Keep this
        // state across layout changes, which can increase scrollHeight before
        // a resize or image-load callback has a chance to restore the tail.
        let followingTail = true;
        let programmaticScrollTop = null;

        function scrollToTail() {
            if (!followingTail) return;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            programmaticScrollTop = chatContainer.scrollTop;
        }

        chatContainer.addEventListener('scroll', function () {
            if (programmaticScrollTop !== null &&
                Math.abs(chatContainer.scrollTop - programmaticScrollTop) < 1) {
                programmaticScrollTop = null;
                return;
            }
            programmaticScrollTop = null;
            followingTail = chatContainer.scrollHeight - chatContainer.clientHeight - chatContainer.scrollTop <= 2;
        });

        // Record upward wheel intent before a pending layout callback can run.
        chatContainer.addEventListener('wheel', function (event) {
            if (event.deltaY < 0 && chatContainer.scrollTop > 0) {
                followingTail = false;
                programmaticScrollTop = null;
            }
        });

        // ResizeObserver sees wrapping, late images and font metric changes.
        // Event fallbacks also cover browsers without ResizeObserver.
        if (typeof ResizeObserver !== 'undefined') {
            const tailResizeObserver = new ResizeObserver(scrollToTail);
            tailResizeObserver.observe(messagesContainer);
            tailResizeObserver.observe(chatContainer);
        }
        messagesContainer.addEventListener('load', scrollToTail, true);
        messagesContainer.addEventListener('animationend', scrollToTail, true);
        window.addEventListener('resize', scrollToTail);
        if (document.fonts) {
            if (document.fonts.addEventListener) {
                document.fonts.addEventListener('loadingdone', scrollToTail);
            }
            if (document.fonts.ready && document.fonts.ready.then) {
                document.fonts.ready.then(scrollToTail);
            }
        }


        // Chat filter tabs. Each message gets one type: the first
        // chattype-<kind> class the server added, else a type read from the
        // classes on its leading elements, else "other". Tabs show a set of
        // types and are saved in BYOND hub storage (516+) or localStorage.
        const CHAT_TYPES = [
            ['ic', 'IC speech and emotes'],
            ['radio', 'Radio, phones and voicepipes'],
            ['ooc', 'OOC, LOOC and lobby'],
            ['dead', 'Dead chat'],
            ['pm', 'Admin PMs'],
            ['admin', 'Admin messages and logs'],
            ['warning', 'Warnings and combat'],
            ['other', 'Other game messages']
        ];
        const KNOWN_TYPES = CHAT_TYPES.map(function (t) { return t[0]; });
        const TYPE_RULES = [
            ['pm', '.pm, .tag-pm_in, .tag-pm_out_alt, .tag-pm_other'],
            ['admin', '.log_message, .admin_channel, .mod_channel, .tag-asay, .tag-admin, .tag-a-discord, .tag-help, .tag-mentor'],
            ['ooc', '.ooc, .looc, .tag-ooc, .tag-looc, .tag-lobby, .tag-discord, .tag-discord2'],
            ['dead', '.deadsay, .tag-dead, .ghostalert'],
            ['radio', '.radio, .blueradio, .SSradio, .redradio, .brownradio'],
            ['ic', '.say, .game_say, .emote'],
            ['warning', '.danger, .userdanger, .userdanger_yellow, .hugedanger, .warning, .alert, .attack, .bad']
        ];
        const DEFAULT_TABS = [
            { name: 'All', types: KNOWN_TYPES.slice() },
            { name: 'IC', types: ['ic', 'radio'] },
            { name: 'Radio', types: ['radio'] },
            { name: 'OOC', types: ['ooc', 'pm'] },
            { name: 'Dead', types: ['dead'] },
            { name: 'Admin', types: ['admin', 'pm'], auto: 'admin' }
        ];
        const TAB_STORAGE_KEY = 'civ13-chat-tabs-v1';
        const MAX_MESSAGES_PER_TYPE = 250;

        function chatStorage() {
            try {
                if (window.hubStorage && typeof window.hubStorage.getItem === 'function') return window.hubStorage;
            } catch (e) { }
            try {
                if (window.localStorage) return window.localStorage;
            } catch (e) { }
            return null;
        }

        // A tab with auto set to a type stays hidden until that type arrives,
        // so players do not see an empty Admin tab.
        function autoType(value) {
            return KNOWN_TYPES.indexOf(value) !== -1 ? value : '';
        }

        function cloneTabs(list) {
            return list.map(function (tab) {
                return { name: tab.name, types: tab.types.slice(), auto: autoType(tab.auto) };
            });
        }

        function loadTabs() {
            try {
                const store = chatStorage();
                const raw = store && store.getItem(TAB_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length) {
                        const clean = [];
                        parsed.forEach(function (tab) {
                            if (!tab || typeof tab.name !== 'string' || !Array.isArray(tab.types)) return;
                            clean.push({
                                name: tab.name.substring(0, 24) || 'Tab',
                                types: tab.types.filter(function (t) { return KNOWN_TYPES.indexOf(t) !== -1; }),
                                auto: autoType(tab.auto)
                            });
                        });
                        if (clean.length) return clean;
                    }
                }
            } catch (e) {
                console.warn('Chat: could not load tab settings', e);
            }
            return cloneTabs(DEFAULT_TABS);
        }

        function saveTabs() {
            try {
                const store = chatStorage();
                if (store) store.setItem(TAB_STORAGE_KEY, JSON.stringify(chatTabs));
            } catch (e) {
                console.warn('Chat: could not save tab settings', e);
            }
        }

        let chatTabs = loadTabs();
        let activeTab = 0;
        let unread = [];
        const typeCounts = {};
        const seenTypes = {};

        function leadingElements(root) {
            const found = [];
            let node = root;
            for (let depth = 0; depth < 4 && node; depth++) {
                let child = node.firstChild;
                while (child && child.nodeType === 3 && !child.nodeValue.trim()) child = child.nextSibling;
                if (!child || child.nodeType !== 1) break;
                found.push(child);
                node = child;
            }
            return found;
        }

        function classifyMessage(div) {
            const tagged = div.querySelector('[class*="chattype-"]');
            if (tagged) {
                const match = /(?:^|\s)chattype-([a-z]+)/.exec(tagged.className);
                if (match && KNOWN_TYPES.indexOf(match[1]) !== -1) return match[1];
            }
            const lead = leadingElements(div);
            for (let r = 0; r < TYPE_RULES.length; r++) {
                for (let i = 0; i < lead.length; i++) {
                    if (lead[i].matches && lead[i].matches(TYPE_RULES[r][1])) return TYPE_RULES[r][0];
                }
            }
            return 'other';
        }

        function tabShows(index, type) {
            const tab = chatTabs[index];
            return !!tab && tab.types.indexOf(type) !== -1;
        }

        function tabVisible(index) {
            const tab = chatTabs[index];
            if (!tab.auto || index === activeTab) return true;
            return !!seenTypes[tab.auto];
        }

        const tabList = document.getElementById('chat-tab-list');
        function renderTabs() {
            tabList.innerHTML = '';
            chatTabs.forEach(function (tab, index) {
                if (!tabVisible(index)) return;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'chat-tab' + (index === activeTab ? ' active' : '');
                button.textContent = tab.name;
                if (unread[index] && index !== activeTab) {
                    const badge = document.createElement('span');
                    badge.className = 'unread';
                    badge.textContent = unread[index] > 99 ? '99+' : String(unread[index]);
                    button.appendChild(badge);
                }
                button.addEventListener('click', function () { selectTab(index); });
                tabList.appendChild(button);
            });
        }

        function applyFilter() {
            const children = messagesContainer.children;
            for (let i = 0; i < children.length; i++) {
                const child = children[i];
                child.classList.toggle('filtered', !tabShows(activeTab, child.getAttribute('data-chat-type')));
            }
        }

        function selectTab(index) {
            if (index < 0 || index >= chatTabs.length) index = 0;
            activeTab = index;
            unread[index] = 0;
            applyFilter();
            renderTabs();
            followingTail = true;
            scrollToTail();
        }

        function noteMessageType(div, type) {
            div.setAttribute('data-chat-type', type);
            typeCounts[type] = (typeCounts[type] || 0) + 1;
            const newlySeen = !seenTypes[type];
            seenTypes[type] = true;
            if (!tabShows(activeTab, type)) div.classList.add('filtered');
            let badgeChanged = newlySeen;
            for (let i = 0; i < chatTabs.length; i++) {
                if (i !== activeTab && tabShows(i, type)) {
                    unread[i] = (unread[i] || 0) + 1;
                    badgeChanged = true;
                }
            }
            if (badgeChanged) renderTabs();
        }

        // Settings panel.
        const settingsPanel = document.getElementById('chat-settings');
        const settingsList = document.getElementById('chat-settings-list');
        function renderSettings() {
            settingsList.innerHTML = '';
            chatTabs.forEach(function (tab, index) {
                const box = document.createElement('div');
                box.className = 'tab-config';
                const name = document.createElement('input');
                name.type = 'text';
                name.maxLength = 24;
                name.value = tab.name;
                name.setAttribute('aria-label', 'Tab name');
                name.addEventListener('input', function () {
                    tab.name = name.value.substring(0, 24) || 'Tab';
                    saveTabs();
                    renderTabs();
                });
                box.appendChild(name);
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove';
                remove.disabled = chatTabs.length <= 1;
                remove.addEventListener('click', function () {
                    chatTabs.splice(index, 1);
                    unread.splice(index, 1);
                    if (activeTab >= chatTabs.length) activeTab = chatTabs.length - 1;
                    else if (activeTab > index) activeTab--;
                    saveTabs();
                    renderSettings();
                    selectTab(activeTab);
                });
                box.appendChild(document.createTextNode(' '));
                box.appendChild(remove);
                box.appendChild(document.createElement('br'));
                CHAT_TYPES.forEach(function (entry) {
                    const label = document.createElement('label');
                    const check = document.createElement('input');
                    check.type = 'checkbox';
                    check.checked = tab.types.indexOf(entry[0]) !== -1;
                    check.addEventListener('change', function () {
                        const at = tab.types.indexOf(entry[0]);
                        if (check.checked && at === -1) tab.types.push(entry[0]);
                        if (!check.checked && at !== -1) tab.types.splice(at, 1);
                        tab.auto = '';
                        saveTabs();
                        if (index === activeTab) applyFilter();
                        renderTabs();
                    });
                    label.appendChild(check);
                    label.appendChild(document.createTextNode(' ' + entry[1]));
                    box.appendChild(label);
                });
                settingsList.appendChild(box);
            });
        }

        document.getElementById('chat-tab-settings').addEventListener('click', function () {
            if (settingsPanel.classList.toggle('open')) renderSettings();
        });
        document.getElementById('chat-settings-close').addEventListener('click', function () {
            settingsPanel.classList.remove('open');
        });
        document.getElementById('chat-tab-add').addEventListener('click', function () {
            chatTabs.push({ name: 'New tab', types: ['ic'], auto: '' });
            saveTabs();
            renderSettings();
            renderTabs();
        });
        document.getElementById('chat-tab-reset').addEventListener('click', function () {
            chatTabs = cloneTabs(DEFAULT_TABS);
            unread = [];
            saveTabs();
            renderSettings();
            selectTab(0);
        });

        // Remove the oldest message of an over-full type. Busy channels then
        // cannot push quiet ones, such as dead chat, out of the history.
        function trimType(type) {
            if ((typeCounts[type] || 0) <= MAX_MESSAGES_PER_TYPE) return;
            const victim = messagesContainer.querySelector('.message[data-chat-type="' + type + '"]');
            if (!victim) return;
            let anchor = null;
            let anchorTop = 0;
            if (!followingTail) {
                const viewportTop = chatContainer.getBoundingClientRect().top;
                const children = messagesContainer.children;
                for (let i = 0; i < children.length; i++) {
                    const child = children[i];
                    if (child === victim || child.classList.contains('filtered')) continue;
                    const rect = child.getBoundingClientRect();
                    if (rect.bottom > viewportTop) {
                        anchor = child;
                        anchorTop = rect.top;
                        break;
                    }
                }
            }
            messagesContainer.removeChild(victim);
            typeCounts[type]--;
            if (anchor && anchor.parentNode === messagesContainer) {
                const shift = anchor.getBoundingClientRect().top - anchorTop;
                if (shift) {
                    chatContainer.scrollTop += shift;
                    programmaticScrollTop = chatContainer.scrollTop;
                }
            }
        }

        renderTabs();

        /**
         * Receives a message from BYOND.
         * @param {string|object} data - The message text or a JSON object.
         */
        let lastMessage = '';
        let lastMessageTime = 0;

        function receiveMessage(data, skip_purify = false) {
            try {
                if (!data) return;

                // Handle the skip_purify flag if it was passed as part of a string (e.g., "message;1")
                // but also respect the second argument if BYOND passed it correctly.
                if (typeof data === 'string' && data.endsWith(';1')) {
                    skip_purify = true;
                    data = data.substring(0, data.length - 2);
                }

                let decodedData = data;
                try {
                    decodedData = decodeURIComponent(data);
                } catch (e) {
                    console.warn("Chat: Failed to decode message", e);
                }

                let messageHtml = '';
                if (typeof decodedData === 'string' && decodedData.charAt(0) === '{') {
                    try {
                        const parsed = JSON.parse(decodedData);
                        messageHtml = parsed.message || decodedData;
                    } catch (e) {
                        messageHtml = decodedData;
                    }
                } else {
                    messageHtml = decodedData;
                }

                if (!messageHtml) return;

                // Deduplication for OpenDream/BYOND glitches
                if (messageHtml === lastMessage && (Date.now() - lastMessageTime) < 100) {
                    return;
                }
                lastMessage = messageHtml;
                lastMessageTime = Date.now();

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                // Robust sanitization with fallback
                if (skip_purify || typeof DOMPurify === 'undefined') {
                    messageDiv.innerHTML = messageHtml;
                } else {
                    try {
                        messageDiv.innerHTML = DOMPurify.sanitize(messageHtml, {
                            USE_PROFILES: { html: true },
                            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|ftp|tel|file|sms|byond):|[^&:/?#]*(?:[/?#]|$))/i
                        });
                    } catch (e) {
                        console.error("Chat: Sanitization failed", e);
                        messageDiv.innerText = messageHtml; // Fallback to plain text on failure
                    }
                }

                const chatType = classifyMessage(messageDiv);
                noteMessageType(messageDiv, chatType);
                messagesContainer.appendChild(messageDiv);

                // Keep memory usage in check by trimming old messages per
                // type. When reading above the tail, keep a surviving visible
                // message at the same screen position.
                trimType(chatType);

                scrollToTail();
            } catch (err) {
                console.error("Chat Fatal Error:", err);
            }
        }

        /**
         * Clears all messages from the chat.
         */
        function clearChat() {
            messagesContainer.innerHTML = '';
            for (const type in typeCounts) typeCounts[type] = 0;
            unread = [];
            renderTabs();
            followingTail = true;
            scrollToTail();
        }

        // Expose to global scope for BYOND
        window.receiveMessage = receiveMessage;
        window.clearChat = clearChat;
        window.selectChatTab = selectTab;

        // Notify BYOND that we are ready
        window.location.href = 'byond://?chat_ready=1';
    </script>
</body>
